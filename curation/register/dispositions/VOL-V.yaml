# Unit dispositions for VOL-V (Draft Project Agreement, extract). PROPOSED, not reviewed.
# Headings are structural by kind. consequence_note: why a consequence word in the unit needs no row of its own.
doc: VOL-V
prepared_by: "AI-assisted draft (register agent, session 05); not reviewed"
units:
  # ---- cover and Note to Bidders
  "VOL-V:cover/para1": {disposition: informational, reason: "name of the (fictional) procuring authority; no obligation"}
  "VOL-V:cover/para2": {disposition: informational, reason: "volume title"}
  "VOL-V:cover/para3": {disposition: informational, reason: "tender reference and date of issue (14 September 2026, fixed)"}
  "VOL-V:cover/para4": {disposition: informational, reason: "states that the clauses are an extract issued for tender and not for execution"}
  "VOL-V:cover/notice": {disposition: informational, reason: "notice that the pack is a constructed artefact; no obligation"}
  "VOL-V:cover/note-to-bidders": {disposition: requirement, rows: [VOL-V-NOTE-01]}
  # ---- Clause 1: definitions
  "VOL-V:1.1": {disposition: definition, reason: "defines Availability Payment (Clause 29, adjusted under Clause 31)"}
  "VOL-V:1.2": {disposition: definition, reason: "defines Effective Date (execution by both parties); the term in 3.1 runs from it (I-CONCESSION)"}
  "VOL-V:1.3": {disposition: definition, reason: "defines Estimated Project Cost (the delay LD cap in 18.4 is 10% of it)"}
  "VOL-V:1.4": {disposition: definition, reason: "defines Financing Documents"}
  "VOL-V:1.5": {disposition: definition, reason: "defines PCOD as the Independent Engineer's certification against VOL-II 7.2 (row VOL-II-7.2-01)"}
  "VOL-V:1.6": {disposition: definition, reason: "defines Unavailability Event by reference to 31.1"}
  # ---- Clause 3: term
  "VOL-V:3.1":
    disposition: requirement
    rows: [VOL-V-3.1-01]
    consequence_note: "'unless terminated earlier in accordance with its terms' refers to the termination provisions (Clause 39; rows VOL-V-39.1-01, VOL-V-18.3-01, VOL-V-31.4-01) and states no consequence of its own"
  "VOL-V:3.2": {disposition: requirement, rows: [VOL-V-3.2-01]}
  "VOL-V:3.3": {disposition: informational, reason: "limits the Project Company's entitlement to a term extension to Clauses 34 and 36; states no obligation to perform"}
  # ---- Clause 12: construction
  "VOL-V:12.1": {disposition: requirement, rows: [VOL-V-12.1-01]}
  "VOL-V:12.2": {disposition: requirement, rows: [VOL-V-12.2-01]}
  "VOL-V:12.3": {disposition: requirement, rows: [VOL-V-12.3-01], reason: "the appointment is an Authority duty; the equal cost share binds the Project Company"}
  "VOL-V:12.4": {disposition: requirement, rows: [VOL-V-12.4-01, VOL-V-12.4-02]}
  # ---- Clause 18: delay and liquidated damages
  "VOL-V:18.1": {disposition: consequence, rows: [VOL-V-12.1-01], reason: "delay liquidated damages for missing the Scheduled PCOD of 12.1"}
  "VOL-V:18.2":
    disposition: authority
    reason: "limits the Authority's financial remedy for late completion to delay liquidated damages, without prejudice to termination under Clause 39"
    consequence_note: "the delay liquidated damages are the consequence of VOL-V-12.1-01 (quoted from 18.1) and termination for late PCOD that of VOL-V-18.3-01; this sentence adds no consequence for the Project Company"
  "VOL-V:18.3": {disposition: requirement, rows: [VOL-V-18.3-01]}
  "VOL-V:18.4":
    disposition: informational
    reason: "caps the Project Company's aggregate liability for delay liquidated damages at 10% of the Estimated Project Cost; no obligation to perform"
    consequence_note: "caps the delay liquidated damages carried as the consequence of VOL-V-12.1-01 (quoted from 18.1); the cap ('shall not exceed ten per cent (10%) of the Estimated Project Cost', p2) is quoted in that row's interpretation note (A1 'Interpretation note' column)"
  # ---- Clause 24: project accounts and reserves
  "VOL-V:24.1": {disposition: requirement, rows: [VOL-V-24.1-01]}
  "VOL-V:24.2": {disposition: requirement, rows: [VOL-V-24.2-01]}
  "VOL-V:24.3": {disposition: requirement, rows: [VOL-V-24.3-01]}
  "VOL-V:24.4": {disposition: requirement, rows: [VOL-V-24.4-01]}
  # ---- Clause 29: payment mechanism
  "VOL-V:29.1":
    disposition: authority
    reason: "the Authority's duty to pay the Availability Payment monthly in arrears from PCOD (ADD-01 Q6: availability based, volume not guaranteed)"
    consequence_note: "'subject to the deductions in Clause 31' refers to the deductions carried as the consequence of VOL-V-31.1-01, -02 and -03 (quoted from 31.2)"
  "VOL-V:29.2": {disposition: requirement, rows: [VOL-V-29.2-01]}
  "VOL-V:29.3":
    disposition: requirement
    rows: [VOL-V-29.3-01]
    consequence_note: "'no availability deduction shall apply' is a Ramp-Up relief from the deductions carried by VOL-V-31.1-02 (quoted from 31.2), not a consequence of its own"
  "VOL-V:29.4": {disposition: requirement, rows: [VOL-V-29.4-01], reason: "invoicing binds the Project Company; payment within 30 days is an Authority duty"}
  "VOL-V:29.5": {disposition: authority, reason: "the Authority's right to set off sums due to it against any Availability Payment"}
  # ---- Clause 31: availability and deductions
  "VOL-V:31.1": {disposition: requirement, rows: [VOL-V-31.1-01, VOL-V-31.1-02, VOL-V-31.1-03]}
  "VOL-V:31.2": {disposition: consequence, rows: [VOL-V-31.1-01, VOL-V-31.1-02, VOL-V-31.1-03], reason: "deductions for an Unavailability Event under Schedule 7 (not supplied), not capped (ADD-02 Q12 refers to this wording)"}
  "VOL-V:31.3": {disposition: requirement, rows: [VOL-V-31.3-01, VOL-V-31.3-02, VOL-V-31.3-03]}
  "VOL-V:31.4": {disposition: requirement, rows: [VOL-V-31.4-01]}
  "VOL-V:31.5":
    disposition: informational
    reason: "relief from deductions to the extent an Unavailability Event is caused by a Relief Event or a Force Majeure Event; no obligation (Force Majeure Event is not defined in the extract)"
    consequence_note: "limits the deductions carried as the consequence of VOL-V-31.1-01, -02 and -03 (quoted from 31.2)"
  # ---- Clause 34: relief events
  "VOL-V:34.1": {disposition: informational, reason: "a Relief Event entitles the Project Company to an extension of time but not to compensation; an entitlement, not an obligation"}
  "VOL-V:34.2": {disposition: definition, reason: "lists the events that are Relief Events"}
  "VOL-V:34.3": {disposition: requirement, rows: [VOL-V-34.3-01]}
  # ---- Clause 36: change in law
  "VOL-V:36.1": {disposition: informational, reason: "the Project Company's entitlement to compensation for a Discriminatory or Specific Change in Law (terms not defined in the extract)"}
  "VOL-V:36.2": {disposition: requirement, rows: [VOL-V-36.2-01], reason: "limits compensation for a General Change in Law; the Project Company bears capital expenditure up to the threshold (amended by ADD-02 8.1)"}
  "VOL-V:36.3": {disposition: definition, reason: "excludes a change in the rate of tax on profits from Change in Law"}
  # ---- Clause 39: termination
  "VOL-V:39.1": {disposition: requirement, rows: [VOL-V-39.1-01]}
  "VOL-V:39.2":
    disposition: authority
    reason: "the Authority's right to terminate where PCOD is not achieved within the 18.3 period"
    consequence_note: "the termination right is carried as the consequence of VOL-V-18.3-01 (quoted from 18.3)"
  "VOL-V:39.3":
    disposition: authority
    reason: "the Authority's right to terminate for persistent breach under 31.4"
    consequence_note: "the termination right is carried as the consequence of VOL-V-31.4-01 (quoted from 31.4)"
  "VOL-V:39.4":
    disposition: informational
    reason: "the Project Company's right to terminate for an Authority Event of Default (unpaid undisputed sum over SAR 20,000,000 for 60 days after notice); not an obligation of the Bidder or the Project Company"
    consequence_note: "the Project Company's right to terminate for Authority default; not a consequence of any Project Company obligation"
  "VOL-V:39.5":
    disposition: authority
    reason: "the Authority's duty to give the Senior Lenders the Direct Agreement's notice and cure period before terminating under 39.1, and the Senior Lenders' step-in rights (Direct Agreement not supplied, I-VOL-V-MISSING)"
    consequence_note: "conditions the Authority's termination right carried by VOL-V-39.1-01 and gives step-in rights to the Senior Lenders, not to the Authority; no further consequence for the Project Company is stated"
  # ---- Clause 40: compensation on termination
  "VOL-V:40.1":
    disposition: informational
    reason: "compensation payable to the Project Company on termination for Authority default or prolonged force majeure, calculated under Schedule 12 (not supplied)"
    consequence_note: "an entitlement of the Project Company on termination it did not cause; not a consequence of a Project Company obligation"
  "VOL-V:40.2":
    disposition: informational
    reason: "compensation on termination for Project Company default: the lesser of market value by re-tender and outstanding senior debt, less the Authority's re-tender and rectification costs"
    consequence_note: "a further financial consequence of the termination rights carried by VOL-V-39.1-01, VOL-V-18.3-01 and VOL-V-31.4-01; recorded here rather than as a separate row"
  "VOL-V:40.3": {disposition: informational, reason: "no compensation for loss of profit beyond Clause 40; limits an entitlement, states no obligation"}
  # ---- Clause 42: handback
  "VOL-V:42.1": {disposition: requirement, rows: [VOL-V-42.1-01, VOL-V-42.1-02]}
  "VOL-V:42.2": {disposition: requirement, rows: [VOL-V-42.2-01]}
  # ---- Clause 44: governing law and disputes
  "VOL-V:44.1": {disposition: informational, reason: "governing law (the laws of the Kingdom); no obligation to perform"}
  "VOL-V:44.2": {disposition: requirement, rows: [VOL-V-44.2-01]}
  "VOL-V:44.3": {disposition: requirement, rows: [VOL-V-44.3-01]}
