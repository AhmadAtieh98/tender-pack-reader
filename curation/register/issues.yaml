# Open issues kept with people (PROPOSED wording, session 04). Issues are never resolved by the program.
# `show_in_a3: true` puts an issue on the one-page A3 even when no row in the slice references it.
issues:
  I-NO-CONSEQUENCE:
    text: "The clause states no consequence of its own. A mandatory requirement is subject to the responsiveness and mandatory compliance check on a pass or fail basis (VOL-I 11.1(i)); only Proposals that pass it go on to technical evaluation (11.1(ii)). The pack gives no clause-specific label and does not say whether a failure is curable; none is implied"
    owner: Bid manager
    theme: gate
    short: "no clause-specific consequence; VOL-I 11.1(i) gate applies"
  I-LCC-ISSUER:
    text: "Local Content Certificate: issuing 'competent authority' not named and no lead time stated; the minutes (non-binding) record bidders' difficulty obtaining it in time"
    owner: Commercial
    theme: programme
    short: "LCC issuer and lead time not stated"
  I-BIDDER-FACTS:
    text: "Bidder facts (members, signatories, attendance, references) are configurable assumptions, not facts; confirm them"
    owner: Bid manager
    theme: programme
    short: "bidder facts are assumptions to confirm"
  I-F4A-FIELDS:
    a3: "Reissued Form 4-A (ADD-01 App A) drops fields and numbered confirmations and cites a 'paragraph 1' it does not have: what to print and sign"
    text: "Reissued Form 4-A (ADD-01 App A) drops fields and the numbered confirmations of the original and states a purpose ('acknowledgement of Addenda at paragraph 1') it has no paragraph for; what to print and sign, and whether to seek clarification before the cut-off"
    owner: Legal
    theme: forms
    short: "reissued Form 4-A: stale printed PDD, dropped fields, correction method"
    folds: ["I-OP-ADD-01/AppA/para1", "I-AUTO-PRINTED-AppA-proposal-due-date"]
    show_in_a3: true
  I-READING-F4C:
    text: "Form 4-C (image, Arabic): the visible Arabic text and displayed translations were confirmed by the owner (Ahmad, 3 Oct 2026; approval of VOL-IV-p6-r1), and declaration 5 refers to VOL-I 4.2. Still open: the exact placement of diacritics. The approval covers that version of the reading only, not the register's interpretations or bidder compliance"
    owner: Owner (Arabic reviewer)
    theme: forms
    short: "Form 4-C: diacritic placement"
  I-F4C-EXCLUSION:
    a3: "Form 4-C decl. 4 (Arabic): 'exclusion of the proposal' for any incorrect statement; not equated with rejection, disqualification or non-responsiveness"
    text: "Form 4-C declaration 4 says any incorrect statement 'leads to the exclusion of the proposal' (يؤدي إلى استبعاد العرض). The English volumes never use 'exclusion'; it is kept as its own category and not treated as equivalent to rejection, disqualification or non-responsiveness. Which, if any, it corresponds to is a legal question (clarification register CQ-F4C-EXCLUSION)"
    owner: Legal
    theme: forms
    short: "Form 4-C: 'exclusion' category"
    show_in_a3: true
  I-READING-T24:
    text: "Table 2-4 (image): the visible transcription (rows, headings, units, limits, assessment bases, the qualifier and Note 1) was confirmed by the owner (Ahmad, 3 Oct 2026; approval of VOL-II-p3-r1). TN = 5 mg/l is the original reading; 3 mg/l is ADD-02 5.1's separate amended value. Still open: anything outside the visible image (e.g. whether a further note was cut off below Note 1)"
    owner: Owner
    theme: technical
    short: "Table 2-4: anything outside the visible image"
  I-F4G-LETTERING:
    text: "Form 4-G is inserted after item (e) of VOL-I 9.1; the re-lettering of items (f)-(i) is not stated"
    owner: Bid manager
    theme: forms
    short: "Form 4-G: re-lettering of the VOL-I 9.1 list"
    folds: ["I-OP-ADD-02/7.1"]
  I-F4G-NO:
    a3: "Form 4-G: the effect of a 'No' answer is not stated; undertakings 3-6 add post-award obligations not in VOL-II 6"
    text: "Form 4-G undertakings are answered Yes/No; the effect of 'No' is not stated, and undertakings 3-6 add post-award obligations not in VOL-II 6"
    owner: Technical
    theme: forms
    short: "Form 4-G: effect of a 'No' answer"
    show_in_a3: true
  I-PERMIT:
    a3: "The Environmental Permit is not supplied, yet it prevails over the Table 2-4 reproduction (VOL-II p3 preamble): Permit compliance is not claimed"
    text: "Table 2-4 is reproduced from an Environmental Permit that is not in the pack. The precedence language is in the VOL-II p3 reproduction preamble ('the Environmental Permit shall prevail'; VOL-II 2.4 incorporates the table by reference); the owner confirmed that location on 3 Oct 2026. Not confirmed, and not claimed: the Permit's contents and compliance with the Permit, including after the TN amendment (ADD-02 5.1, 3 mg/l)"
    owner: Technical
    theme: missing
    short: "Environmental Permit not supplied; Permit compliance not claimed"
    show_in_a3: true
  I-CONCESSION:
    a3: "Concession term from PCOD (VOL-I 12.1) or from the Effective Date (VOL-V 3.1)? ADD-02 Q7 declined to amend"
    text: "Concession term: VOL-I 12.1 (from PCOD) vs VOL-V 3.1 (from the Effective Date); ADD-02 Q7 declined to amend. A legal/commercial question"
    owner: Legal
    theme: contract
    short: "concession term start (ADD-02 Q7: precedence)"
    folds: ["I-OP-ADD-02/Q7"]
    show_in_a3: true
  I-FLOWS:
    text: "Design flows: Table 2-6 peak hourly flow vs 3 x dry weather flow; ADD-02 Q11 did not answer. An engineering question"
    owner: Technical
    theme: technical
    short: "design flows: follow-up to ADD-02 Q11"
    folds: ["I-OP-ADD-02/Q11"]
  I-VOL-III:
    a3: "Volume III and Drawing 03-C-114 (effluent delivery point, VOL-II 5.1) not supplied; no omission claim after the PDD (VOL-I 3.4)"
    text: "Volume III referenced (VOL-I 3.1), not supplied; pack confirmed complete (2 Oct). Only Drawing 03-C-114 shows the effluent main's delivery point (VOL-II 5.1). No omission claim after the PDD (VOL-I 3.4)"
    owner: Technical
    theme: missing
    short: "Volume III / Drawing 03-C-114 not supplied"
    show_in_a3: true
