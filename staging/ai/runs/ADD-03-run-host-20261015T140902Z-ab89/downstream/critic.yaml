items:
  DS-ADD03-01:
    batch: downstream-001
    review:
      critic:
        agrees: false
        concerns:
        - 'Mostly sound: the quotations match the printed units, and the core point is real. ADD-03:3.1 says Form
          4-G ''is withdrawn'' and that Bidders ''shall not submit it''. Yet the only op, ADD-03/3.1, targets ADD-02:7.2
          alone, so the form units (ADD-02:F4-G/T1/1, T1/3, para1) and the Envelope A list entry VOL-I:9.1(e)+ADD-02
          stay active. Passing this to a person, without deciding it, is the right handling.'
        - The item states a status as fact. It says 'Row ADD-02-7.2-01 is therefore REVOKED and needs no new reading',
          but op ADD-03/3.1 is only at review 'proposed'. Statuses are set by the code and accepted by a person,
          so this should say 'would be revoked if the op is accepted'.
        - Even after the op, row ADD-02-7.2-01 still cites VOL-I:9.1(e)+ADD-02, which the item itself says stays
          active. Saying the row 'needs no new reading' is therefore a conclusion that the evidence shown does not
          support. The point should stay open.
        - 'It merges two classes of uncertainty. The reason given for the form staying active is a tool limit: the
          op engine cannot revoke a group, and check C22 rejects the member rows and the list insertion as targets.
          That is a software limitation and should be an escalation beginning ''software limitation:'' that states
          what is unsupported (what_is_unsupported). The questions about scope are a separate class.'
        - 'The real ambiguity is not stated with its readings. ADD-03:3.1 withdraws the form ''added by Addendum
          No. 2 Section 7'' but says only that ''Section 7.2 ... ceases to have effect''; it says nothing on Section
          7.1, which inserted the form into the VOL-I 9.1 list. That should be an ''ambiguous:'' point that quotes
          both texts and gives both readings: the whole of Section 7 falls, or only 7.2 falls and the list entry
          survives. The ADD-02 7.1 text is not quoted or printed in this request.'
        - Some claims cannot be checked from the evidence printed. Units ADD-02:F4-G/T1/2, T1/4, T1/5 and T1/6 are
          not in the request; the item and S-F2 say T1/5 and T1/6 are active. The current records list no activities,
          so form-4g-review and form-4g-sign cannot be checked. The EV-FORM-4G item record and the dry-run results
          behind S-F3 are not shown either.
        - The op is named inconsistently. The item and S-F2 call it 'ADD-03/3.1(a)', but the ops record has id 'ADD-03/3.1'.
        - Losing the non_responsive consequence is not named as follow-on work. That consequence is quoted from
          ADD-02:7.2 in row ADD-02-7.2-01, and row ADD-02-F4G-04's note also relies on it. If 7.2 ceases, A3 changes,
          and the item should say so explicitly.
        - The owner is given as Bid management only. The open questions also cover I-F4G-NO (owned by Technical)
          and how far a withdrawal reaches in the documents (arguably Legal or Document control). Naming the other
          owners would help the decision.
        evidence_checked:
        - ADD-03:3.1
        - ADD-02:7.2
        - VOL-I:9.1
        - VOL-I:9.1(e)+ADD-02
        - ADD-02:F4-G/T1/1
        - ADD-02:F4-G/T1/3
        - ADD-02:F4-G/para1
        - ops ADD-03/3.1 (set_status revoked, review proposed)
        - rows ADD-02-7.2-01, ADD-02-F4G-01..05, VOL-I-9.1-01
        - reviews (interview_demo origin, op proposed)
        - issues I-F4G-NO, I-F4G-LETTERING
        - statements downstream-001/S-F1, S-F2, S-F3, S-I1
        - controller_validation records
        selected_because: *id001
        route: host
        critic_run: ADD-03-run-host-20261015T140902Z-ab89-downstream-001-critic
        model_reported: claude-opus-5-5
  D-F4G06-ISSUE:
    batch: downstream-002
    review:
      critic:
        agrees: false
        concerns:
        - The main finding is supported. ADD-03:3.1 withdraws the whole of Form 4-G ('is withdrawn. Bidders shall
          disregard it and shall not submit it.'). The op record shows ADD-03/3.1 as one set_status op with status
          'revoked' on ADD-02:7.2 only. The form heading VOL-I:9.1(e)+ADD-02 and the rows ADD-02:F4-G/T1/5 and /6
          are printed as 'active'. Raising this as an open issue for Document control and Technical is the right
          handling.
        - The issue cites op 'ADD-03/3.1(a)'. The ops record only has 'ADD-03/3.1'. The id needs correcting.
        - The list of units still active is incomplete. Op ADD-02/7.1 also covers ADD-02:F4-G/para1, and the issue
          leaves it out. It lists only the heading and T1/1-6.
        - Open question (1) mentions 'the VOL-I 9.1 list entry', but the dependencies leave out row VOL-I-9.1-01.
          That row lists 'Form 4-G' among the Envelope A items at ADD-02. The withdrawal directly affects it.
        - 'The A5 activities ''form-4g-review'' and ''form-4g-sign'' cannot be checked from this request: current_records.activities
          is empty. I cannot confirm they exist.'
        - Two readings for the open interpretation are stated, (a) and (b), and they are hard to tell apart. The
          register records undertakings 5 and 6 as not in VOL-II 6. So reading (b), 'survive only so far as VOL-II
          6 itself requires them', leads to the same result as reading (a) for those duties. The ambiguity should
          be stated so that each reading has a different outcome, or the issue should say why they differ.
        - The point that the undertakings are 'not in VOL-II 6' rests on a note in the register, not on quoted VOL-II
          6 text. No VOL-II 6 unit is in the evidence, so I cannot check it.
        - The rationale says 'no op supports a removal'. A set_status op type does exist, as ADD-03/3.1 uses one.
          The rationale should say that no op has been proposed for the form units, which is amendment-phase work.
          As written, it can be read as a software limitation, which would be the wrong class.
        evidence_checked:
        - ADD-03:3.1
        - ADD-03:3.2
        - VOL-I:9.1(e)+ADD-02
        - ADD-02:7.2
        - ADD-02:F4-G/T1/5
        - ADD-02:F4-G/T1/6
        - ops ADD-03/3.1 (set_status revoked, target ADD-02:7.2)
        - ops ADD-02/7.1 covers list (T1/1-6, para1)
        - row VOL-I-9.1-01 ADD-02 items list
        - rows ADD-02-F4G-06, ADD-02-F4G-07, ADD-02-7.2-01
        - current_records.activities (empty)
        selected_because: *id002
        route: host
        critic_run: ADD-03-run-host-20261015T140902Z-ab89-downstream-002-critic
        model_reported: claude-opus-5-5
