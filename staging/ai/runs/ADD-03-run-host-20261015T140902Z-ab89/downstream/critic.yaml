          reviewer should still confirm that the direction applies to the new date and is not re-decided here.
        - VOL-I 3.4 says only 'after the Proposal Due Date'. The time element '14:00 hours' in the cut-off comes
          from the recorded owner direction, not from the words of 3.4. This is not new, but it is still not stated
          in 3.4.
        - 'The clarification date (Thursday 26 November 2026) depends on the quoted calculate output, which cannot
          be reproduced here. The earlier row called its date ''the planning reading''. This item now says ''single
          reading'' (readings_differ: false). That is consistent with the quoted tool output.'
        - The note says the new clarification cut-off falls on the old omission-claim cut-off date. This is accurate
          and useful for the bid team, and the note correctly keeps the two cut-offs separate. The interview_demo
          record and the I-VOL-III issue are kept as recorded and are not treated as resolved.
        evidence_checked:
        - VOL-I:3.4
        - 'VOL-I:6.1 (effective at ADD-03: ''Thursday 10 December 2026'')'
        - ADD-03:2.1
        - ADD-03:2.2
