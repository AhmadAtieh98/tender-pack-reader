  DS-ADD03-I-REF-THRESHOLD:
    batch: downstream-003
    review:
      critic:
        agrees: true
        concerns:
        - 'The A3 line reads: ''Reference plants: two plants each not less than 100,000 m³/day (ADD-03 4.2), else
          ‘shall be rejected without further evaluation’''. It leaves out the other condition footnote 12 attaches
          to the same rejection: ''each having achieved commercial operation within the ten (10) years preceding
          the Proposal Due Date''. The consequence words are quoted correctly, but the shortened condition could
          mislead the bid-out list. The A3 text should carry the look-back condition too, or quote footnote 12''s
          condition in full.'
        - The dependencies EV-FORM-4B, EV-COMPLETION-CERT and the activity 'references' are not in the evidence
          printed here; current_records.activities is empty. Their link to footnote 12 cannot be checked from this
          request.
        - The quotation from VOL-I:8.5 leaves off the footnote marker printed in the unit ('Form 4-B.¹²'). The controller
          accepted it as verbatim, so this is minor.
        - No bidder facts are asserted, the issue is left open with decision owner 'Technical', and the consequence
          is quoted from fn12 and not inferred. This is consistent with the rules. The issue rests on ops 4.2(a)
          and 2.1, which are proposed only and not accepted. The record for 4.2(a) is not printed, and the printed
          ADD-03/4.2 is invalid (see the review of DS-ADD03-R-8.5-01).
        evidence_checked:
        - ADD-03:4.2
        - VOL-I:8.5#fn12
        - VOL-I:8.5
        - VOL-I:6.1
        - current_records.rows.VOL-I-8.5-01
        - current_records.ops.ADD-03/4.2
        - current_records.activities
        - controller_validation (VOL-I:8.5#fn12 p4 x2, VOL-I:8.5 p4, human-owned)
        - downstream-003/S-F-REF-CAPACITY
        - downstream-003/S-F-PDD
        selected_because: *id008
        route: host
        critic_run: ADD-03-run-host-20261015T140902Z-ab89-downstream-003-critic
        model_reported: claude-opus-5-5
  D-ADD03-04:
    batch: downstream-004
    review:
      critic:
        agrees: true
        concerns:
        - The note says the programme 'must now reach PCOD within the same 36 months for the 150,000 m³/day capacity
          of VOL-II 2.1 as amended by ADD-03/4.1(a)'. This rests on op ADD-03/4.1(a), which is still only proposed
          (S-F1 is checked against the text 'after the proposed ops'). The note should say that this sentence depends
          on that op being accepted. As written, it reads as a settled effective text.
        - 'Q15 is a bidder question and Authority answer printed in ADD-03. The note treats it as an op (''confirms'').
          Whether answers in the ADD-03 Q&A table bind is not shown in the evidence: the pack''s own words on how
          Q&A answers bind are not printed, and ADD-01 3.2 says the pre-bid minutes do not bind. This is a person''s
          decision (Legal / Document control) and the item should flag it, not assume it.'
        - The note names VOL-V 18.4 (the cap) and VOL-II 7.2 (the 90% reliability run). Neither unit is printed
          in this request. They can be checked only through the quotes in the curated records VOL-V-12.1-01 and
          VOL-II-7.2-01.
        - The note says PCOD needs the reliability run 'at 90% of nominal capacity'. The quote in VOL-II-7.2-01
          says 'not less than 90%'. The note should keep the 'not less than' wording. It also implies, without saying
