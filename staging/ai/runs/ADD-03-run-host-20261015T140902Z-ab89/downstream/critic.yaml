  DS-ADD03-R-6.7-01:
    batch: downstream-003
    review:
      critic:
        agrees: true
        concerns:
        - The reading treats the VOL-I 6.7 cut-off ('before the Proposal Due Date') as following the date in VOL-I
          6.1 as amended. The earlier recorded reading relied on VOL-I 2.6 for that link, but VOL-I 2.6 is not printed
