        - statement downstream-002/S-CLAR-CUTOFF-CALC
        - review row:VOL-I-3.4-01 (interview_demo)
        selected_because: *id003
        route: host
        critic_run: ADD-03-run-host-20261015T140902Z-ab89-downstream-002-critic
        model_reported: claude-opus-5-5
