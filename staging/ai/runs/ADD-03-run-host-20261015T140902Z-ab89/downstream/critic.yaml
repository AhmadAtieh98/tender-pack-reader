          so that the provision is fully accounted for and that reading is visible.'
        - The parameter express_late_prohibition ('modifications only ... not extended to withdrawals') carries
          the owner's session-08 direction. That direction named 26 November 2026, and the review behind it is interview_demo
          origin ('no observed human review'). The item correctly leaves the carry-over to a person (I-ADD03-PDD-OWNER-DIRECTIONS).
          The issue's own text is not printed in this request, so its framing and owner cannot be checked.
        - The statement relied on, downstream-003/S-F-REVIEW-ORIGIN, cites as evidence VOL-I:6.4 'The Bid Bond shall
          be in the amount of SAR 5,600,000'. That span does not support a statement about review origin and status.
          VOL-I:6.4 is printed in this request only at SAR 4,500,000 (before the addendum), and the ADD-03 provision
          behind 5,600,000 is not printed here.
        - S-F-REVIEW-ORIGIN names ADD-03 ops 4.2(a), 4.2(b), 5.1 and 5.2(b). Of these, only ADD-03/4.2 (unsplit)
          appears in current_records.ops; the others cannot be checked here.
