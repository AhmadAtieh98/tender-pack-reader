  DS-ADD03-R-8.5-01:
    batch: downstream-003
    review:
      critic:
        agrees: true
        concerns:
        - 'The item rests on ops ''ADD-03/4.2(a)'' and ''ADD-03/4.2(b)'', which are not in current_records.ops.
          The only printed op for this provision, ADD-03/4.2, targets ''VOL-I:8.5'' (the clause body, which does
          not contain the threshold) rather than ''VOL-I:8.5#fn12''. It quotes old ''80,000 m3/day'' rather than
          the printed ''80,000 m³/day'' and is recorded valid: false. The item should state this discrepancy openly,
          so that a person sees the printed op is wrong-targeted and invalid and that the reading depends on a re-proposed
          op this request does not show. The controller''s ''ADD-03: AMENDED (ADD-03/4.2(a))'' suggests such an
          op exists, but it cannot be checked here.'
        - 'Substance checks out against ADD-03:4.2: ''deleting ‘80,000 m³/day’ and substituting ‘100,000 m³/day’''
          in footnote 12; two plants and the ten-year look-back ''are unchanged''; the rejection words in fn12 are
          untouched. The target (fn12, not the body of 8.5) is correct.'
        - The note asserts 'ADD-03 does not change ADD-01 Q5'. Only ADD-03:2.1 and ADD-03:4.2 are printed, so this
          claim about the whole addendum cannot be checked from the evidence shown.
        - The new parameter lookback_anchor moves the window with the PDD as amended by ADD-03/2.1. That rests on
          VOL-I 2.6 (not printed) and on reading 'the ten (10) year look-back are unchanged' as fixing the length
          of the period, not the window as it stood before. That reading is the natural one, but the basis should
          be cited. The proposed op 2.1 is correctly flagged as not accepted.
        - The rationale's claims (no other statement of 80,000 m³/day besides footnote 12; the Form 4-B capacity
          field; VOL-I 9.5) rest on searches and units not printed in this request and cannot be checked here.
        - As for the first item, statement S-F-REVIEW-ORIGIN cites unrelated evidence (VOL-I:6.4 'SAR 5,600,000')
          for a statement about review origin and status.
