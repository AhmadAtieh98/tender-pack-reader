# A1 register rows for Volume IV, Form Sheets 4-A to 4-F (Stage 3). PROPOSED: drafted by the register agent,
# session 05. No row has been reviewed or accepted by a person. Rows already held in curation/register/rows.yaml
# (VOL-IV-F4A-01 printed PDD, VOL-I-9.4-01 Form 4-C execution, VOL-IV-F4C-04 declaration 4, VOL-IV-F4C-N1 Form 4-C
# note) are not repeated here. Form 4-C rows rest on an image reading still PENDING the owner's review.
# Rule for re-interpretation: a row gets an interpretation at an addendum stage only where that addendum addresses
# one of its units (ADD-01 App A replaces Form 4-A; ADD-02 Q9 annotates Form 4-C).
# Form 4-A confirmations that the reissued form drops (paragraphs 1-5) do NOT follow the replacement: they show
# REPLACED from ADD-01, which is what the documents say; whether to give them anyway is I-F4A-FIELDS.
doc: VOL-IV
prepared_by: "AI-assisted draft (register agent, session 05); not reviewed"
method: >-
  Every Volume IV unit read in order (build/units.json), including the Form 4-C image reading (Arabic, logical
  order; translations are proposals). One row per form for its completion and execution, plus one row per
  independently testable confirmation, declaration or guarantee term (D3). Form notes that restate a Volume I
  clause are dispositioned as duplicates of the Volume I row. Quotes copied from the effective text at each stage
  (tenderpack.amend); consequences quoted only from the unit that states them, never inferred.
rows:
  # ---------------------------------------------------------------- general rule for all forms (VOL-IV p2)
  - id: VOL-IV-FORMS-01
    group: "VOL-IV:cover/para5"
    scope: [forms, wording]
    requirement: "Reproduce every Form without alteration to its wording"
    units: ["VOL-IV:cover/para5"]
    discipline: Bid management
    owner: Bid manager
    assessment: procedural
    no_deliverable: "a rule on how each Form is reproduced; the Forms themselves are the deliverables of their own rows"
    interpretations:
      - stage: BASE
        quote: "Forms shall be reproduced without alteration to their wording."
        consequence: {class: lesser, unit: "VOL-IV:cover/para5", quote: "A Bidder that alters the wording of a Form does so at its own risk."}
        note: "Bears on the reissued Form 4-A, which prints the old Proposal Due Date (VOL-IV-F4A-01, I-F4A-FIELDS), and on Form 4-D, which VOL-I 8.7 requires only 'substantially in the form'."
    confidence: high
    confidence_reason: "verbatim; 'at its own risk' does not say what the Authority will do"
    issues: [I-F4A-FIELDS]
  # ---------------------------------------------------------------- Form 4-A (replaced by ADD-01 Appendix A)
  - id: VOL-IV-F4A-02
    group: "VOL-IV:F4-A"
    scope: [envelope_A, forms, reissued_form]
    requirement: "Complete Form 4-A (Envelope A, mandatory) in the form reissued by ADD-01 App A; VOL-I states no consequence for a blank field. Execution and its consequence (unsigned or improperly executed: non-responsive) are row VOL-I-9.3-01"
    units: ["VOL-IV:F4-A/name-of-bidder-lead-member", "VOL-IV:cover/T1/4-A", "VOL-IV:F4-A/tender-reference", "VOL-IV:F4-A/project",
            "VOL-IV:F4-A/proposal-due-date", "VOL-IV:F4-A/commercial-registration-number", "VOL-IV:F4-A/registered-address",
            "VOL-IV:F4-A/single-point-of-contact-name-title", "VOL-IV:F4-A/contact-email-and-telephone", "VOL-IV:F4-A/signature",
            "VOL-IV:F4-A/name-of-signatory", "VOL-IV:F4-A/capacity", "VOL-IV:F4-A/power-of-attorney-reference-and-date",
            "VOL-IV:F4-A/date", "VOL-IV:F4-A/company-seal", "ADD-01:AppA/para1", "ADD-01:AppA/single-point-of-contact",
            "ADD-01:AppA/signature-name-capacity"]
    follows_replacement: true
    discipline: Legal
    owner: Bid manager
    assessment: pass_fail
    evidence: [EV-FORM-4A]
    interpretations:
      - stage: BASE
        quote: "Name of Bidder / lead member:"
        note: "The form's fields are to be completed (mandatory form, VOL-IV cover table). VOL-I 9.3's consequence is for an 'unsigned or improperly executed' Form 4-A; it is not read as 'every blank field causes rejection' (row VOL-I-9.3-01 carries it). Whether a particular omission would make the form improperly executed is for a person."
      - stage: ADD-01
        quote: "Name of Bidder / lead member:"
        note: "No consequence is stated for a blank field; VOL-I 9.3's 'unsigned or improperly executed' trigger is row VOL-I-9.3-01. ADD-01 App A reissues Form 4-A ('Bidders shall use this version'). It keeps tender reference, project, PDD, name, single point of contact, 'Signature / name / capacity' and date; it drops the CR number, registered address, contact email/telephone, Power of Attorney reference and date, and company seal. Not resolved: I-F4A-FIELDS."
    confidence: medium
    confidence_reason: "verbatim fields; the reissued form drops fields and still prints the old PDD (a decision for a person)"
    issues: [I-F4A-FIELDS]
  - id: VOL-IV-F4A-03
    group: "VOL-IV:F4-A"
    scope: [envelope_A, forms, confirmation, addenda_acknowledgement, dropped_in_reissue]
    requirement: "Form 4-A para 1: acknowledge receipt of the Addenda by number and offer the Project in conformity with the RFP Documents"
    units: ["VOL-IV:F4-A/item1"]
    discipline: Legal
    owner: Bid manager
    assessment: pass_fail
    evidence: [EV-FORM-4A]
    interpretations:
      - stage: BASE
        quote: "the receipt of which is hereby acknowledged, we offer to design, finance, construct, own, operate, maintain and transfer the Project in conformity with the RFP Documents"
        note: "No consequence stated in the form. The reissued Form 4-A (ADD-01 App A) has no paragraph 1 and no offer wording; it has an 'Addenda acknowledged (numbers)' field (row ADD-01-AppA-01)."
    confidence: medium
    confidence_reason: "verbatim; dropped by the reissued form from ADD-01 (whether to give it anyway is for a person)"
    issues: [I-F4A-FIELDS, I-NO-CONSEQUENCE]
  - id: VOL-IV-F4A-04
    group: "VOL-IV:F4-A"
    scope: [envelope_A, forms, confirmation, validity, dropped_in_reissue]
    requirement: "Form 4-A para 2: confirm the Proposal is valid for 150 days from the Proposal Due Date"
    units: ["VOL-IV:F4-A/item2"]
    discipline: Commercial
    owner: Bid manager
    assessment: pass_fail
    evidence: [EV-FORM-4A]
    date_rules:
      - {rule_id: PROPOSAL-VALIDITY-F4A, kind: relative, purpose: validity_end, anchor: PDD, offset: 150, unit: calendar_day, direction: after, source_unit: "VOL-IV:F4-A/item2", text: "valid for one hundred and fifty (150) days from the Proposal Due Date"}
    interpretations:
      - stage: BASE
        quote: "We confirm that this Proposal is valid for one hundred and fifty (150) days from the Proposal Due Date."
        parameters: {validity_days: 150}
        note: "Confirms VOL-I 7.1 (row VOL-I-7.1-01). No consequence stated. Dropped by the reissued Form 4-A from ADD-01."
    confidence: medium
    confidence_reason: "verbatim; dropped by the reissued form from ADD-01; day 0 / day 1 not stated"
    issues: [I-F4A-FIELDS, I-NO-CONSEQUENCE]
  - id: VOL-IV-F4A-05
    group: "VOL-IV:F4-A"
    scope: [envelope_A, forms, confirmation, bid_security, dropped_in_reissue]
    requirement: "Form 4-A para 3: confirm the Bid Bond required by VOL-I 6.4 accompanies the Proposal"
    units: ["VOL-IV:F4-A/item3"]
    discipline: Commercial
    owner: Bid manager
    assessment: pass_fail
    evidence: [EV-FORM-4A]
    interpretations:
      - stage: BASE
        quote: "We confirm that the Bid Bond required by Volume I Clause 6.4 accompanies this Proposal."
        note: "The Bid Bond itself is VOL-I-6.3-01, VOL-I-6.4-01 and VOL-I-6.4-02. No consequence stated. Dropped by the reissued Form 4-A from ADD-01."
    confidence: medium
    confidence_reason: "verbatim; dropped by the reissued form from ADD-01"
    issues: [I-F4A-FIELDS, I-NO-CONSEQUENCE]
  - id: VOL-IV-F4A-06
    group: "VOL-IV:F4-A"
    scope: [envelope_A, forms, confirmation, multiple_participation, dropped_in_reissue]
    requirement: "Form 4-A para 4: confirm no consortium member participates in any other Proposal for the Project"
    units: ["VOL-IV:F4-A/item4"]
