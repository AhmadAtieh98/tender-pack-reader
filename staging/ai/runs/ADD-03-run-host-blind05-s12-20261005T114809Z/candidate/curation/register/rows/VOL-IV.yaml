    assessment: pass_fail
    evidence: [EV-FORM-4A]
    interpretations:
      - stage: BASE
        quote: "We confirm that no member of our consortium participates in any other Proposal for this Project."
        note: "No consequence stated in the form; multiple participation itself leads to rejection under VOL-I 8.2 (row VOL-I-8.2-01). Also declared in Form 4-C (VOL-IV-F4C-02). Dropped by the reissued Form 4-A from ADD-01."
    confidence: medium
    confidence_reason: "verbatim; dropped by the reissued form from ADD-01; the confirmation rests on bidder facts"
    issues: [I-F4A-FIELDS, I-NO-CONSEQUENCE, I-BIDDER-FACTS]
  - id: VOL-IV-F4A-07
