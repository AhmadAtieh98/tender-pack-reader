        id: CQ-PCOD-RELIABILITY-RUN
        topic: permit/table interpretation (rolling averages in the 30-day reliability run)
        kind: ambiguity
        volume: Volume II
        clause: 7.2 and 7.3
        page: 4
        units:
        - VOL-II:7.2
        - VOL-II:7.3
        - VOL-II:T2-4
        - VOL-V:1.5
        - VOL-V:18.1
        - VOL-V:18.3
        sources:
        - unit: VOL-II:7.2
          page: 4
          words: PCOD shall not be certified until the Facility has completed a continuous reliability run of thirty
            (30) days at a daily average flow, measured at the inlet works, of not less than 85% and not more than
            110% of nominal capacity, during which every parameter in Table 2-4 has been met.
        - unit: ADD-03:3.2
          page: 2
          words: A day on which the daily average flow is outside that range shall not count towards the thirty
            (30) days.
        - unit: VOL-II:7.3
          page: 4
          words: A failure of any Table 2-4 parameter during the reliability run shall restart the run in full.
        - unit: VOL-II:T2-4
          page: 3
          words: compliance assessed as a 30-day rolling average unless stated
        - unit: VOL-V:18.1
          page: 2
          words: delay liquidated damages at the rate of SAR 180,000 for each day of delay
        gap: 'Most Table 2-4 parameters are assessed as 30-day rolling averages. VOL-II 7.2-7.3 do not say how such
          a parameter is ''met'', or what counts as ''a failure'', within the run: an average over the run, a daily
          rolling value using pre-run data, or individual samples. ADD-03 3.1-3.2 add an inlet flow range and say
          a day outside it ''shall not count towards the thirty (30) days''. They do not say whether such a day
          breaks the ''continuous'' run, or whether a Table 2-4 failure on a non-counting day restarts it under
          7.3.'
        already_settled: ''
        practical_impact: A failure restarts the full 30 days. PCOD timing drives delay liquidated damages of SAR
          180,000 per day (VOL-V 18.1) and the 365-day termination right (VOL-V 18.3). Under ADD-03 Q17, the Independent
          Engineer's reasonable costs for any run after the first fall on the Project Company. The commissioning
          programme and float depend on the answer.
        proposed_question: 'Volume II, Clauses 7.2 and 7.3, page 4 (as amended by Addendum No. 3): (a) For Table
          2-4 parameters whose basis of assessment is a 30-day rolling average, how is compliance determined during
          the 30-day reliability run? In particular, is the rolling average calculated over the run period only,
          or for each day of the run using data from before it began? What constitutes ''a failure'' of such a parameter
          for the purposes of Clause 7.3? (b) Does a day on which the daily average flow is outside the range in
          Clause 7.2 interrupt the continuity of the run, or is it only excluded from the count of thirty (30) days?
          Does a Table 2-4 failure on such a day restart the run?'
        interim_handling: Plan commissioning so that individual samples meet the rolling-average limits before the
          run starts. Plan inlet flow management to keep within 85-110% of nominal capacity. Hold programme float
          and Independent Engineer cost for at least one full restart, and record this as a programme assumption.
