      gap: The governing Arabic Table 5-1 and the English translation in Appendix B differ. Arabic note 1 covers
        temporary structures, cranes and construction equipment, while English note (1) covers permanent structures
        only. Arabic note 2 and the column heading measure height from natural ground level before grading and filling,
        while English note (2) uses finished ground level after grading and filling.
      proposed_question: Please confirm that, as 7.2 states the Arabic text governs, the Table 5-1 limits and the
        30 m threshold in Section 7.3 (a) apply to temporary structures, cranes and construction equipment, and
        (b) are measured from natural ground level before grading and filling. Please also confirm whether a corrected
        English translation will be issued.
      practical_impact: Construction cranes and temporary works in Zone A (25 m) could be constrained. Where the
        site is filled, the height available above finished level is reduced. Both affect the layout, the stack
        and process structure heights, and the crane and lifting plan required by Q21.
      interim_handling: 'Design and plan to the Arabic text: natural ground datum, with temporary works and cranes
        included.'
      decision_owner: Bid Manager / Technical lead
