# Relationships between rows, units, calculations, evidence and A5 activities (tenderpack.relationships; session 10).
# PROPOSED curation (W2, session 10); not reviewed. Every entry is `review: proposed`: a drafting flag, never a decision.
#
#   status confirmed  the documents themselves state the link: `evidence` quotes the cross-reference verbatim, on its
#                     page, and check-register checks every quote like any other
#   status proposed   inferred by a curator (or a model); `basis` says why; a person decides
#   status possible   a weaker inference; anything reached through a `words:` trigger is at most this
# `from`: a row id, a unit id (a table or form id also stands for each of its members), calc:<name>, or words:<phrase>
# (an op of the stage adds or removes words containing the phrase). `to`: a row, unit, A5 activity, evidence item, date
# rule or calc:<name>. A row reached also reaches the A5 activities that serve it (their evidence items), which are
# marked REVIEW (<class>) with their dates unchanged. Durations and the bidder configuration stay labelled assumptions
# (config/assumptions.yaml); nothing here changes them. Open questions are linked through `issues`, never resolved.
prepared_by: "session 10 (W2): curated from the volumes' own words; the blind rehearsal 03 gaps (S9, S10, M8, U5) as general entries"
method: "each link read in the PDF text layer or the approved image readings; a quote for every confirmed link; an inferred link is proposed with its basis"
relationships:
