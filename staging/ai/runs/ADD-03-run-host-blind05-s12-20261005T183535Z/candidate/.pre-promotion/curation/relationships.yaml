      - {unit: "VOL-V:H:C29", page: 3, words: "CLAUSE 29 — PAYMENT MECHANISM"}
    note: "Every sub-clause of Clause 29 is part of the payment mechanism the Availability Payment is calculated under (the Ramp-Up payment of 29.3 included)."
    origin: curator
    review: proposed
  - id: REL-PAY-DEDUCTIONS
    from: ["VOL-V:31.1", "VOL-V:31.2", "VOL-V:31.3", "VOL-V:31.4", "VOL-V:31.5"]
    to: ["calc:availability-payment"]
    kind: depends_on
    status: proposed
    evidence:
      - {unit: "VOL-V:1.1", page: 2, words: "Availability Payment means the annual payment calculated under Clause 29 and adjusted under Clause 31."}
      - {unit: "VOL-I:10.2", page: 5, words: "calculated in accordance with the payment mechanism at Volume V Clause 29"}
    basis: "The definition says the Availability Payment is adjusted under Clause 31, but the price quoted under VOL-I 10.2 is calculated under Clause 29 only: whether a change to the deductions changes the quoted price, or only the risk priced into it, is a commercial judgement (inferred, not stated)."
    origin: curator
    review: proposed
