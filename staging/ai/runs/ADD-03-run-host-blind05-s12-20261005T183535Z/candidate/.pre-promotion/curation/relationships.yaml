    basis: "Form 4-F states that the Availability Payment is derived from the Financial Model, and VOL-I 10.2 that it is calculated under the payment mechanism of Volume V Clause 29; so the model must reproduce Clause 29 (the Ramp-Up payment of 29.3 included). That a change to Clause 29 requires the model to be re-run is the curator's inference, not a stated link."
    note: "Reaches the Envelope B modelling activities (fin-model-build, fin-model-freeze) through the row's evidence item (EV-FIN-MODEL)."
    origin: curator
    review: proposed
