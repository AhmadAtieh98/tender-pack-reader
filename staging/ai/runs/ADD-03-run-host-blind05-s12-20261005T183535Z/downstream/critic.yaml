  D1:
    batch: downstream-006
    review:
      critic:
        agrees: false
        concerns:
        - The core requirement follows from the text shown. Replaced 29.2(a) says the Indexed Proportion is the
          percentage the Bidder states in Form 4-F, at least 50% and at most 70%, until the end of year 10. The
          old VOL-V 29.2 had a fixed 60/40 split.
        - The second date_note quotes 'from the start of the eleventh (11th) year of operations'. The printed ADD-03:3.3
          text stops at '(a) ... ; and', so that wording is not in the evidence shown. It is presumably in clause
          (b), which is not printed. I cannot verify it and it is not tied to any quotation.
        - The row does not say what applies after year 10. Clause (b) is not shown, so the row may be incomplete
          for the full clause, and the statement that the band covers only the first ten years rests on part of
          the text.
        - The consequence (non_responsive under VOL-I 10.5) is not stated anywhere in the pack. The item itself
          says so (S2, I-NO-CONSEQUENCE). Whether a value outside the band is 'price subject to adjustment other
          than as provided in Volume V' is a judgment. The item marks it as human decision pending, which is appropriate.
          The controller status is insufficient_evidence and the missing_information check failed.
        - The Form 4-F paragraph shown (para1) only confirms that the Availability Payment is unconditional. It
          does not show a field for the Indexed Proportion. The evidence therefore does not confirm that Form 4-F
          has a place to state it. I did not see the form layout.
        - I did not see VOL-I 9.6 or 11.5, so I cannot check the rationale for excluding them. The 5.2 clarification-window-closed
          claim (S7) is attributed to a 'task packet' and is not supported by the quotation attached to it.
        evidence_checked:
        - ADD-03:3.3
        - VOL-V:29.2
        - VOL-I:10.5 quotation
        - VOL-IV:F4-F/para1
        - VOL-IV:cover/T1/4-F
        - controller_validation
        - statements S1-S7
