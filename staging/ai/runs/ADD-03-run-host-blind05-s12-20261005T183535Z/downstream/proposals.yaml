        - unit: VOL-V:cover/note-to-bidders
          page: 2
          words: Clause numbering follows the full draft; omitted clauses are not reproduced. A deviation not listed
            in Form 4-E will be taken as accepted.
        - unit: VOL-V:29.2
          page: 3
          words: The Availability Payment shall be indexed annually from the Base Date in accordance with Schedule
            9.
        - unit: VOL-V:31.2
          page: 3
          words: the Authority shall deduct from the Availability Payment the amounts calculated under Schedule
            7
        - unit: VOL-V:39.1
          page: 4
          words: being the events listed in Schedule 11
        - unit: VOL-V:39.5
          page: 4
          words: the notice and cure period stated in the Direct Agreement
        - unit: VOL-V:40.1
          page: 4
          words: calculated under Schedule 12
        gap: Volume V is an extract. Schedules 7 (deductions), 9 (indexation), 11 (Project Company defaults) and
          12 (termination compensation), the Direct Agreement and the omitted clauses (including those defining
          Notice to Proceed and Force Majeure Event) are referred to but not issued, yet the Note to Bidders deems
          any deviation not listed in Form 4-E accepted. ADD-03 3.3 rewrites 29.2 (indexation from the Base Date;
          Indexed Proportion stated by the Bidder at 50%-70% to year 10, 75% from year 11) but still refers to Schedule
          9, which remains unissued.
        already_settled: ADD-02 Q12 refers Bidders to 31.2, under which deductions are uncapped. ADD-01 Q6 confirms
          the payment is availability based. ADD-03 3.2 defines the Base Date and ADD-03 3.3 sets the Indexed Proportion
          band. None of them supplies the missing Schedules (in particular the Schedule 9 index series and mechanics).
        practical_impact: The Availability Payment in Form 4-F and the Financial Model depend on Schedule 9 (index
          series and indexation mechanics from the Base Date), on the Indexed Proportion the Bidder now chooses
          within 50%-70%, and on Schedule 7 (deduction levels). Termination sums and lender cure rights (Schedules
          11-12, Direct Agreement) drive financing terms. Form 4-E cannot list deviations to terms not seen, yet
          unlisted deviations are deemed accepted; ADD-03 Q16 now also treats limiting assumptions on Volume V as
          qualifications to be listed in Form 4-E.
        proposed_question: 'Volume V, Note to Bidders, page 2: The extract refers to Schedules 7, 9, 11 and 12 and
          to the Direct Agreement (Clauses 29.2 as amended by Addendum No. 3, 31.2, 39.1, 39.5 and 40.1, pages 3-4),
          none of which has been issued, and states that a deviation not listed in Form 4-E will be taken as accepted.
          Will the Authority issue these Schedules (in particular Schedule 9, under which the Availability Payment
          is indexed from the Base Date) and the Direct Agreement or, if not, does the deemed acceptance in the
          Note to Bidders apply only to the clauses reproduced in the extract?'
        interim_handling: 'Build the Financial Model on the reproduced terms as amended by ADD-03: indexation from
          the Base Date per 29.2 and 1.1A, an Indexed Proportion chosen by the Commercial lead within 50%-70% for
          years 1-10 and 75% from year 11, and uncapped deductions per 31.2. Record the index series and deduction
          inputs as assumptions in the financing-assumptions schedule, not as price conditions (VOL-I 10.5), and
          state the Indexed Proportion only in Form 4-F (Envelope B, ADD-03 Q20). Legal decides whether to record
          a reservation on the unseen Schedules in Form 4-E (cf. ADD-03 Q16). Nothing is assumed about their content.
          The clarification window closed on 2026-11-12 (VOL-I 5.2), so this is a bid decision for a person.'
        decision_owner: Legal
        response_status: draft, not sent
        linked_issues:
        - I-VOL-V-MISSING
        theme: missing
