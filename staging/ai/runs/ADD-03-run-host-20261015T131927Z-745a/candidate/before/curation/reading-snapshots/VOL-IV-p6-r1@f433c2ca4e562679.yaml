prepared_by: "AI-assisted: Claude Code session 02 (2026-10-02), read visually from the native 1654x2339 px image; disputed marks re-checked on native pixels"
method: >-
  Visual reading of the embedded image. No OCR. Text bands, rule bands and left/right splits
  measured from pixels by tenderpack.regions.text_bands. Digit glyphs in the clause reference
  compared against Noto Naskh Arabic renders (advisory only).
