# PROPOSED READING — PENDING HUMAN REVIEW. Not approved.
# `source` is the text as printed, Arabic stored in logical (reading) order.
# `translation` is separate and is not evidence. Matching text is computed by the program.
# For tokens containing digits, `visual_ltr_expected` is the glyph order seen in the crop,
# left to right; the build renders `source` and checks that it reproduces that order.
region_id: VOL-IV-p6-r1
