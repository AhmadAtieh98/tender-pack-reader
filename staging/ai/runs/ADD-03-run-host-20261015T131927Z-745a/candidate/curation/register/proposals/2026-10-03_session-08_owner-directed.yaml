# Replacement proposals for VOL-I-8.3-01, VOL-I-3.4-01 and VOL-I-6.7-01 (session 08, 3 Oct 2026). Prepared by the
# assistant from the owner's written direction (worklog/2026-10-03_session-08_prompt.md §3), each one supported by the tender clauses and
# amendments quoted under `evidence` (unit, page, words). The owner's wording gives the direction; the evidence is what
# the interpretation rests on. They replace the session 06 proposals (2026-10-03_stale-rows.yaml), kept there with the
# reasons. Applying one writes the interpretation and pins it; the row is then PROPOSED and still needs the owner's
# `tenderpack accept` (or `reject` with a note). Nothing here is accepted.
proposals:
  - id: P-S08-VOL-I-8.3-01
    row: VOL-I-8.3-01
    supersedes: P-STALE-VOL-I-8.3-01
    direction: "The mandatory EPC ISO certificate must be valid at the latest amended proposal due date. Keep the accredited-issuer and envelope-copy requirements. Cite §8.3 and §11.1's mandatory-compliance pass/fail gate. Don't say there is no consequence anywhere, but don't invent an ISO-specific rejection label, automatic incurability or permission to cure."
    changed_dependency: "VOL-I:6.1 (Proposal Due Date) amended by ADD-01/2.1: 'Thursday 12 November 2026' -> 'Thursday 26 November 2026'; the time of 14:00 Riyadh time unchanged"
    evidence:
      - {unit: "VOL-I:8.3", page: 4, words: "The proposed EPC Contractor shall hold a valid ISO 9001:2015 quality management certificate, current as at the Proposal Due Date, issued by an accredited certification body. A copy of the certificate shall be submitted with Envelope A."}
      - {unit: "VOL-I:2.6", page: 2, words: "Proposal Due Date means the date and time stated in Clause 6.1, as the same may be amended by Addendum."}
      - {unit: "VOL-I:6.1", page: 3, words: "not later than 14:00 hours Riyadh time on Thursday 12 November 2026"}
      - {unit: "ADD-01:2.1", page: 1, words: "Volume I Clause 6.1 is amended by deleting ‘Thursday 12 November 2026’ and substituting ‘Thursday 26 November 2026’. The time of 14:00 Riyadh time is unchanged."}
      - {unit: "ADD-02", page: null, words: "no provision of ADD-02 amends VOL-I 6.1 or 8.3 (checked against every ADD-02 provision): 26 November 2026, 14:00 is the latest amended Proposal Due Date"}
      - {unit: "VOL-I:11.1", page: 5, words: "(i) a responsiveness and mandatory compliance check on a pass or fail basis; (ii) technical evaluation of those Proposals that pass stage (i)"}
      - {unit: "VOL-I", page: null, words: "no clause of VOL-I, ADD-01 or ADD-02 allows a defect to be cured, or says one cannot be (searched for cure, rectify, remedy, waive, clarification of a Proposal); the Section 8 heading 'QUALIFICATION AND MANDATORY REQUIREMENTS' is context only (VOL-I 2.8: headings do not affect interpretation)"}
    replace_requirement:
      old: "EPC Contractor ISO 9001:2015 certificate, current as at the Proposal Due Date, copy in Envelope A"
      new: "EPC Contractor ISO 9001:2015 certificate from an accredited certification body, current as at the Proposal Due Date (as amended), copy with Envelope A; checked pass/fail under VOL-I 11.1(i)"
    add_interpretation:
      stage: ADD-01
      quote: "current as at the Proposal Due Date"
      parameters:
        current_at: "the latest amended Proposal Due Date: 26 November 2026, 14:00 Riyadh time (VOL-I 2.6, 6.1 as amended by ADD-01 2.1; not changed by ADD-02)"
        issuer: "an accredited certification body (VOL-I 8.3)"
        copy: "submitted with Envelope A (VOL-I 8.3)"
        gate: "VOL-I 11.1(i): responsiveness and mandatory compliance check, pass or fail; only Proposals that pass go on to 11.1(ii)"
      note: >-
        As directed by the owner on 3 Oct 2026 (worklog/2026-10-03_session-08_prompt.md §3): the EPC Contractor's ISO 9001:2015 certificate must be
        valid (current) at the latest amended Proposal Due Date, 26 November 2026, 14:00 Riyadh time (VOL-I 2.6 defines
        the Proposal Due Date as the date and time in 6.1 as amended; ADD-01 2.1 moved the date and kept the time;
        ADD-02 does not change it). It must also be issued by an accredited certification body, and a copy must be
        submitted with Envelope A (VOL-I 8.3). VOL-I 8.3 states no consequence of its own; the requirement is checked
        at the responsiveness and mandatory compliance stage on a pass or fail basis, and only Proposals that pass that
        stage go on to technical evaluation (VOL-I 11.1(i)-(ii)). The pack gives no ISO-specific rejection label and
        says nothing on whether a failure can be cured; neither is implied.
    effect: "ISO-CURRENT-AT planned as 2026-11-26 (14:00 Riyadh); the row stops being STALE and is PROPOSED until the owner decides it"
    decision_needed: "Accept or reject row VOL-I-8.3-01 with this interpretation (tenderpack accept / reject)."
  - id: P-S08-VOL-I-3.4-01
    row: VOL-I-3.4-01
    supersedes: P-STALE-VOL-I-3.4-01
    direction: "The omission-claim cut-off follows the amended proposal due date and time. Keep it separate from the earlier clarification deadline."
    changed_dependency: "VOL-I:6.1 (Proposal Due Date) amended by ADD-01/2.1: 'Thursday 12 November 2026' -> 'Thursday 26 November 2026'; the time of 14:00 Riyadh time unchanged"
    evidence:
      - {unit: "VOL-I:3.4", page: 3, words: "Bidders shall satisfy themselves as to the completeness of the RFP Documents downloaded from the Portal. No claim arising from an alleged omission shall be entertained after the Proposal Due Date."}
      - {unit: "VOL-I:2.6", page: 2, words: "Proposal Due Date means the date and time stated in Clause 6.1, as the same may be amended by Addendum."}
      - {unit: "ADD-01:2.1", page: 1, words: "substituting ‘Thursday 26 November 2026’. The time of 14:00 Riyadh time is unchanged."}
      - {unit: "VOL-I:5.2", page: 3, words: "Requests for clarification shall be submitted no later than ten (10) Working Days before the Proposal Due Date. Requests received after that time will not be answered."}
      - {unit: "ADD-01:2.2", page: 1, words: "including without limitation the period in Volume I Clause 5.2 (clarification cut-off)"}
      - {unit: "VOL-I:3.3", page: 2, words: "A Bidder that identifies a conflict, ambiguity or discrepancy shall raise it as a request for clarification under Section 5."}
    replace_requirement:
      old: "Check the completeness of the RFP Documents downloaded from the Portal; omission claims are not entertained after the Proposal Due Date"
      new: "Check the completeness of the RFP Documents downloaded from the Portal; omission claims are not entertained after the Proposal Due Date and time as amended (a cut-off separate from the VOL-I 5.2 clarification deadline)"
    add_interpretation:
      stage: ADD-01
      quote: "Bidders shall satisfy themselves as to the completeness of the RFP Documents downloaded from the Portal."
      consequence: {class: lesser, unit: "VOL-I:3.4", quote: "No claim arising from an alleged omission shall be entertained after the Proposal Due Date."}
      parameters:
        omission_claim_cutoff: "the amended Proposal Due Date and time: 26 November 2026, 14:00 Riyadh time (VOL-I 2.6; 6.1 as amended by ADD-01 2.1)"
        separate_from: "the VOL-I 5.2 clarification-request deadline (ten Working Days before the Proposal Due Date; row VOL-I-5.2-01; 12 November 2026 on the planning reading)"
      note: >-
        As directed by the owner on 3 Oct 2026 (worklog/2026-10-03_session-08_prompt.md §3): the cut-off for omission claims follows the amended
        Proposal Due Date and time; no claim arising from an alleged omission is entertained after 26 November 2026,
        14:00 Riyadh time (VOL-I 3.4 with 2.6; ADD-01 2.1). It is a separate cut-off from the earlier
        clarification-request deadline of VOL-I 5.2 (ten Working Days before the Proposal Due Date, adjusted under
        ADD-01 2.2; row VOL-I-5.2-01): VOL-I 3.4 does not refer to 5.2 and the two are not merged. Whether to raise a
        known gap as a clarification request is a separate decision (the clarification register).
    effect: "OMISSION-CLAIM-CUTOFF planned as 2026-11-26 (14:00 Riyadh); the row stops being STALE and is PROPOSED until the owner decides it"
    decision_needed: "Accept or reject row VOL-I-3.4-01 with this interpretation (tenderpack accept / reject)."
  - id: P-S08-VOL-I-6.7-01
    row: VOL-I-6.7-01
    supersedes: P-STALE-VOL-I-6.7-01
    direction: "§6.7 permits written portal withdrawal or modification before the amended deadline. Its express late prohibition concerns modifications. Don't extend it beyond that wording."
    changed_dependency: "VOL-I:6.1 (Proposal Due Date) amended by ADD-01/2.1: 'Thursday 12 November 2026' -> 'Thursday 26 November 2026'; the time of 14:00 Riyadh time unchanged"
    evidence:
      - {unit: "VOL-I:6.7", page: 3, words: "A Bidder may withdraw or modify its Proposal at any time before the Proposal Due Date by written notice through the Portal. No modification will be accepted thereafter."}
      - {unit: "VOL-I:2.6", page: 2, words: "Proposal Due Date means the date and time stated in Clause 6.1, as the same may be amended by Addendum."}
      - {unit: "ADD-01:2.1", page: 1, words: "substituting ‘Thursday 26 November 2026’. The time of 14:00 Riyadh time is unchanged."}
      - {unit: "ADD-01, ADD-02", page: null, words: "no provision of either addendum amends VOL-I 6.7"}
    replace_requirement:
      old: "Withdraw or modify the Proposal only before the Proposal Due Date, by written notice through the Portal"
      new: "A withdrawal or modification of the Proposal may be made by written notice through the Portal at any time before the Proposal Due Date; no modification will be accepted thereafter"
    add_interpretation:
      stage: ADD-01
      quote: "A Bidder may withdraw or modify its Proposal at any time before the Proposal Due Date by written notice through the Portal."
      consequence: {class: lesser, unit: "VOL-I:6.7", quote: "No modification will be accepted thereafter."}
      parameters:
        cutoff: "the amended Proposal Due Date: 26 November 2026, 14:00 Riyadh time (VOL-I 2.6; 6.1 as amended by ADD-01 2.1)"
        means: "written notice through the Portal"
        express_late_prohibition: "modifications only ('No modification will be accepted thereafter')"
      note: >-
        As directed by the owner on 3 Oct 2026 (worklog/2026-10-03_session-08_prompt.md §3): a Bidder may withdraw or modify its Proposal by
        written notice through the Portal at any time before the amended Proposal Due Date, 26 November 2026, 14:00
        Riyadh time (VOL-I 6.7 with 2.6; ADD-01 2.1). The clause's express prohibition after that time concerns
        modifications only ('No modification will be accepted thereafter'); it is not extended to withdrawals, and
        nothing further is read into it.
    effect: "MODIFY-CUTOFF planned as 2026-11-26 (14:00 Riyadh); the row stops being STALE and is PROPOSED until the owner decides it"
    decision_needed: "Accept or reject row VOL-I-6.7-01 with this interpretation (tenderpack accept / reject)."
