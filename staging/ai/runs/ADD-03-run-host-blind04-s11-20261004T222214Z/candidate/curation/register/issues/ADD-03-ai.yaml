  I-ADD03-NETWORTH-EPC:
    text: VOL-I 8.4(a) as amended by ADD-03 3.1 is an Envelope A qualification test set at 25% of the Estimated
      Project Cost. ADD-03 2.1 defines that cost as the amount the Bidder states in Form 4-F, which the base pack
      places in Envelope B only. Envelope B is opened only for Proposals that pass the technical evaluation (11.3/11.3A).
      The pack does not say how the net-worth test can be demonstrated or assessed at Envelope A without disclosing
      the Form 4-F figure. The threshold also moves with the Bidder's own price. Until this is clarified, the finance
      team cannot fix a target net worth. [AI workflow run ADD-03-run-host-blind04-s11-20261004T222214Z (route host,
      model claude-code headless (opus)); PROPOSED; not reviewed]
    owner: Financial modeller
    theme: qualification
    short: Net-worth test tied to Form 4-F (Envelope B) figure
    a3: Net-worth test now 25% of the bidder's own Form 4-F cost; Envelope A/B sequencing unclear.
    show_in_a3: true
