  I-EPC-ENVELOPE-A:
    text: 'The VOL-I 8.4(a) net-worth test, an Envelope A qualification requirement, now depends on the Estimated
      Project Cost, i.e. the figure the Bidder states in Form 4-F (VOL-V 1.3 as amended). Form 4-F goes in Envelope
      B only. ADD-03 Q19 asked how to show compliance in Envelope A; the Authority referred to VOL-I 6.2 and 11.1
      and made no further amendment. So: (1) the financial-standing evidence cannot be finalised until the cost
      figure is frozen in the Financial Model, which ties the Envelope A programme to the Envelope B chain; (2)
      stating the figure in Envelope A may conflict with keeping prices out of Envelope A (see I-VOL-I-ENV-A-PRICES);
      (3) leaving it out may leave 8.4(a) undemonstrated. A higher Estimated Project Cost also raises the net-worth
      threshold and the delay LD rate (VOL-V 18.1). Decide the approach with Legal and consider a follow-up clarification.
      [AI workflow run ADD-03-run-host-blind04-s11-20261004T222214Z (route host, model claude-code headless (opus));
      PROPOSED; not reviewed]'
