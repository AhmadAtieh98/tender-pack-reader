issues:
  I-ADD03-TECH-THRESHOLD:
    text: ADD-03 says the technical threshold is 'unchanged at seventy per cent (70%)', but it is now 70% of 120
      marks (84 marks), up from 70 out of 100. The new criterion G (20 marks) is part of the base the threshold
      is measured against. The threshold still has to be applied through the undefined five-point scale multiplied
      by 'the weight shown' (I-VOL-IV-SCALE). In practice the technical proposal must score at least 84 marks across
      criteria A to G, so criterion G cannot be neglected. [AI workflow run ADD-03-run-host-blind04-s11-20261004T222214Z
      (route host, model claude-code headless (opus)); PROPOSED; not reviewed]
