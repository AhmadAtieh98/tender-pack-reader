- key: intro
  lang: ar
  role: preamble
  translation: 'We, the undersigned, in our capacity as authorised representatives of the member named below in
    the Bidder''s consortium, declare and undertake the following:'
  lines:
  - band: 4
    source: نحن الموقعون أدناه، بصفتنا ممثلين مفوضين عن العضو المذكور أدناه في ائتلاف مقدم العرض،
  - band: 5
    source: 'نقر ونتعهد بما يلي:'
- key: decl1
  lang: ar
  role: declaration
  translation: 'First: that the natural persons shown in the table below are all the beneficial owners of the member;
    a beneficial owner is every natural person who owns, directly or indirectly, ten per cent (10%) or more of the
    member''s capital or of its voting rights, or who controls the member by any other means.'
  lines:
  - band: 6
    source: 'أولاً: أن الأشخاص الطبيعيين المبينين في الجدول أدناه هم جميع المستفيدين الحقيقيين من العضو،'
  - band: 7
    source: والمستفيد الحقيقي هو كل شخص طبيعي يملك، بصورة مباشرة أو غير مباشرة، ما نسبته عشرة في
  - band: 8
    source: المائة (١٠٪) أو أكثر من رأس مال العضو أو من حقوق التصويت فيه، أو يسيطر على العضو بأي
    numerals:
    - text: ١٠
      visual_ltr_expected: ١٠
      meaning: ten (10) per cent ownership threshold, also written out in words (عشرة في المائة)
      note: printed inside brackets with the Arabic percent sign ٪, stored after the digits in logical order; the
        build renders ٪ to the left of ١٠, reviewer to confirm against the band 8 crop
  - band: 9
    source: وسيلة أخرى.
- key: decl2
  lang: ar
  role: declaration
  translation: 'Second: that none of the beneficial owners owns, directly or indirectly, any share in a member of
    another consortium submitting a proposal for this tender.'
  lines:
  - band: 10
    source: 'ثانياً: أنه لا يملك أيٌّ من المستفيدين الحقيقيين، بصورة مباشرة أو غير مباشرة، أي حصة في'
  - band: 11
    source: عضو في ائتلاف آخر يقدم عرضاً لهذه المناقصة.
- key: decl3
  lang: ar
  role: declaration
  translation: 'Third: that we have attached to this declaration a certified copy of the register of partners or
    shareholders of the member, issued within the thirty (30) days preceding the date of submission of proposals.'
