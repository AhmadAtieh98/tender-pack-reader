        sources:
        - unit: VOL-II:7.2
          page: 4
          words: PCOD shall not be certified until the Facility has completed a continuous reliability run of thirty
            (30) days at not less than 90% of nominal capacity, during which every parameter in Table 2-4 has been
            met.
        - unit: VOL-II:7.3
          page: 4
          words: A failure of any Table 2-4 parameter during the reliability run shall restart the run in full.
        - unit: VOL-II:T2-4
          page: 3
          words: compliance assessed as a 30-day rolling average unless stated
        - unit: VOL-V:18.1
          page: 2
          words: delay liquidated damages at the rate of one-twentieth of one per cent (0.05%) of the Estimated
            Project Cost for each day of delay
        gap: Most Table 2-4 parameters are assessed as 30-day rolling averages. VOL-II 7.2 and 7.3 do not say how
          such a parameter is 'met', or what counts as 'a failure', within a 30-day run. It could be an average
          over the run, a daily rolling value using pre-run data, or individual samples.
        already_settled: ''
        practical_impact: A failure restarts the full 30 days. PCOD timing drives delay liquidated damages, now
          0.05% of the Estimated Project Cost for each day of delay (VOL-V 18.1 as amended by ADD-03 4.1), which
          scales with the cost the Bidder states in Form 4-F. It also drives the 365-day termination right (VOL-V
          18.3). The commissioning programme and float therefore depend on the answer.
        proposed_question: 'Volume II, Clauses 7.2 and 7.3, page 4: For Table 2-4 parameters whose basis of assessment
          is a 30-day rolling average, how is compliance determined during the 30-day reliability run (in particular,
          is the rolling average calculated over the run period only, or for each day of the run using data from
          before it began), and what constitutes ''a failure'' of such a parameter for the purposes of Clause 7.3?'
