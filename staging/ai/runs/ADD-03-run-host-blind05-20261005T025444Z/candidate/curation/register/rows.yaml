# A1 register SLICE (Stage 2): a representative set of rows, not the full register.
# PROPOSED: drafted by the assistant (session 04). No row has been reviewed or accepted by a person.
# Each interpretation is pinned to the evidence it was drafted against by `python -m tenderpack pin`, which
# writes curation/register/pins.yaml (never this file). An interpretation added or re-reviewed is re-pinned.
# Rule used for re-interpretation in this draft: a row gets a new interpretation at a stage only where that
# addendum's own text addresses the row's units (amends, names, confirms or answers about them). Any other
# change to a dependency leaves the row STALE for a person to re-review (e.g. VOL-I 8.3 after the PDD moved).
prepared_by: "AI-assisted draft, Claude Code session 04 (2 Oct 2026); not reviewed"
method: >-
  Rows are independently testable obligations (D3), grouped by source clause (group) and tagged by scope.
  Quotes are copied from the effective text at each stage and are checked by the build; consequences are
  quoted from the unit that states them; dates are rules evaluated by tenderpack.dates, never typed.
anchors:
  PDD: {name: "Proposal Due Date", defined_in: "VOL-I:6.1"}
include: ["rows/*.yaml"]          # per-document row files (Stage 3); ids are unique across all files
rows:
