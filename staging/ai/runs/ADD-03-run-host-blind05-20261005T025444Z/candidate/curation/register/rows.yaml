        issuer: an accredited certification body (VOL-I 8.3)
        copy: submitted with Envelope A (VOL-I 8.3)
        gate: 'VOL-I 11.1(i): responsiveness and mandatory compliance check, pass or fail; only Proposals that pass
          go on to 11.1(ii)'
      note: 'As directed by the owner on 3 Oct 2026 (worklog/2026-10-03_session-08_prompt.md §3): the EPC Contractor''s
        ISO 9001:2015 certificate must be valid (current) at the latest amended Proposal Due Date, 26 November 2026,
