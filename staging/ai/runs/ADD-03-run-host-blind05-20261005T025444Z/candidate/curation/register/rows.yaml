        quote: "no later than ten (10) Working Days before the Proposal Due Date"
        consequence: {class: lesser, unit: "VOL-I:5.2", quote: "Requests received after that time will not be answered."}
      - stage: ADD-01
        quote: "no later than ten (10) Working Days before the Proposal Due Date"
        consequence: {class: lesser, unit: "VOL-I:5.2", quote: "Requests received after that time will not be answered."}
