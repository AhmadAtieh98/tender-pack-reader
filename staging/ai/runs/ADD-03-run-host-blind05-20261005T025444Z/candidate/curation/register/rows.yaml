    group: VOL-I:6.1
    scope: [bid_submission, deadline]
    requirement: "Deliver the Proposal to the Authority by the Proposal Due Date and time, at the Appendix 3 address"
    units: ["VOL-I:6.1"]
    discipline: Bid management
    owner: Bid manager
    assessment: pass_fail
    evidence: [EV-DELIVERY]
    date_rules:
      - {rule_id: PDD, kind: anchor, purpose: deadline, anchor: PDD, source_unit: "VOL-I:6.1", text: "not later than 14:00 hours Riyadh time on <date>"}
    interpretations:
      - stage: BASE
        quote: "not later than 14:00 hours Riyadh time on Thursday 12 November 2026"
        consequence: {class: rejection, unit: "VOL-I:6.6", quote: "will be rejected unopened and returned to the Bidder"}
      - stage: ADD-01
        quote: "not later than 14:00 hours Riyadh time on Thursday 26 November 2026"
        consequence: {class: rejection, unit: "VOL-I:6.6", quote: "will be rejected unopened and returned to the Bidder"}
        note: "ADD-01 §2.1 amends the date; the time is unchanged."
    confidence: high
    confidence_reason: "verbatim text-layer clause; the consequence is stated in VOL-I 6.6"
