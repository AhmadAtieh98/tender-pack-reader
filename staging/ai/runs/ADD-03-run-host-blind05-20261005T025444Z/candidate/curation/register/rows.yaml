        issuer: an accredited certification body (VOL-I 8.3)
        copy: submitted with Envelope A (VOL-I 8.3)
        jv_epc_contractor: where the EPC Contractor is an unincorporated JV, each member holds a certificate meeting
          8.3 and a copy of each is submitted with Envelope A (ADD-03 Q17)
        gate: 'VOL-I 11.1(i): responsiveness and mandatory compliance check, pass or fail'
      consequence: none_stated
      note: 'Words of VOL-I 8.3 unchanged. ADD-03 Q17 (annotation, adds obligation): for an unincorporated JV EPC
        Contractor, each member''s certificate is needed and a copy of each goes in Envelope A, so EV-ISO becomes
        one per JV member in that case. VOL-I 8.3 states no consequence of its own, and the pack says nothing on whether
        a failure can be cured. [AI workflow run ADD-03-run-host-blind05-20261005T025444Z (route host, model claude-code
        headless (opus)); PROPOSED; not reviewed]'
