# Open issues raised while drafting the Volume I rows (Stage 3). PROPOSED wording by the register agent, session 05;
# not reviewed. Issues are never resolved by the program; each is for the named role to decide.
issues:
  I-VOL-I-ENV-B:
    a3: "Envelope B holds 'only' Form 4-F and the Financial Model (VOL-I 10.1), yet 10.3 and 10.6 require more documents"
    text: "VOL-I 10.1: Envelope B holds 'only' Form 4-F and the Financial Model, yet 10.3 (model auditor's opinion) and 10.6 (financing assumptions schedule) need more documents; where they go is unstated"
    owner: Bid manager
    theme: envelopes
    short: "Envelope B: auditor opinion and financing schedule vs VOL-I 10.1 'only'"
    show_in_a3: true
  I-VOL-I-ENV-A-PRICES:
    a3: "No commercial information in Envelope A (VOL-I 6.2), yet Form 4-B there asks for each reference's contract value"
    text: "VOL-I 6.2 makes any price, rate or other commercial information in Envelope A non-responsive, but Form 4-B (Envelope A) asks for each reference's contract value in SAR"
    owner: Bid manager
    theme: envelopes
    short: "Form 4-B contract values vs no commercial information in Envelope A"
    show_in_a3: true
  I-VOL-I-COPIES:
    text: "Copy quantities are per Proposal (VOL-I 6.5: 'Each Proposal shall be submitted as' one marked original, three hard copies and one encrypted USB copy); settled. Open: how the single USB copy relates to the two separately sealed envelopes and how its means of decryption is given (draft question CQ-USB-PACKAGING)"
    owner: Bid manager
    theme: envelopes
    short: "USB copy vs the two sealed envelopes (copies per Proposal: settled)"
  I-VOL-I-FILE-NAMES:
    text: "The Financial Model must be in Microsoft Excel (VOL-I 10.3); settled. Open: how the Appendix 2 naming convention, which ends in '.pdf' and does not define [BIDDER] or the date in [YYYYMMDD], applies to it (draft question CQ-FILENAMES)"
    owner: Bid manager
    theme: envelopes
    short: "file naming of the Excel Financial Model (Excel itself: settled)"
  I-VOL-I-BOND-LONGSTOP:
    text: "The VOL-I 12.2 periods (Commercial Close 120 days, Financial Close 270 days from the Preferred Bidder Notification) are unchanged: settled by ADD-02 Q13. Open: the Bid Bond's 180-day validity from the PDD (VOL-I 6.3) may end before the Financial Close long-stop, on which 12.2 lets the Authority call it; whether it must be extended to cover that period, and 'long-stop date' is undefined (draft question CQ-BOND-FC-COVERAGE)"
    owner: Commercial lead
    theme: contract
    short: "bid bond validity vs the Financial Close call (12.2 periods: settled by Q13)"
  I-VOL-I-APPENDICES:
    text: "VOL-I 9.2 excludes 'the appendices expressly permitted by Volume II' from the page limit; none was found in the Volume II extract"
    owner: Technical lead
    theme: envelopes
    short: "page-limit appendices not identified"
