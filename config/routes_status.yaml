# Where and when each AI route was last EXERCISED, and with what result (session 13). A record, not a measurement of
# quality: `tenderpack ai routes` prints it beside each route's LIVE availability on this machine (a key present, a
# command on PATH, the local Ollama answering), the launcher (option 5) and the panel's addendum box show both.
# Update it by hand when a route is exercised somewhere new (date, place, what ran, the result); never from code.
# Session 14 (W6): each route also says what WORKS (and where it was shown), what was NEVER RUN, and what is READY to
# try (the exact commands, none of them run by tenderpack on its own). `ai routes`, the launcher (its route list and
# option 5), the panel's addendum box, docs/AI_ROUTES.md section 1, docs/MAC_CHECKLIST.md and the interview folder's
# README all read or quote this file (tests/test_session14_routes_status.py holds them to it).
#
# status vocabulary: tested | built, unverified | untested | blocked here, unverified | pending on the Mac
# A cloud-container test proves nothing about the owner's Mac: every Mac check is PENDING until run there
# (docs/VERIFY_ON_MAC.md).
version: 1
first: host            # the route to rehearse first (the owner, session 13: "Claude Code is the first route to rehearse")
order: [host (connected: Claude Code), codex (connected, manual), anthropic (API key), openrouter (API key), ollama (offline)]
routes:
  host:
    label: Claude Code (connected coding host; the host's own plan pays; no application API call)
    status: tested
    where: the owner's Mac on 11 Oct 2026 (Claude Code CLI 2.1.296, an unzipped copy of the interview package through its panel); before that the cloud container (sessions 10-13), the last time from an unzipped twin of the interview folder, its own .venv and its panel   # session 13 (F4; audit R3 N-3): the panel prints it
    when: 2026-10-04 to 2026-10-11
    result: >-
      headless `claude -p` sessions over the tenderpack MCP tools ran for real on blind rehearsals 03-07 (readings,
      analysis, downstream, critic, repairs); a rate limit stopped blind-04 after about seven sessions (deferral exit 5
      and resume were built from it); blind-07 (6 Oct, the sealed addendum, from the interview folder's twin through
      its panel, two sessions in flight) ran to the candidate outputs and review packet in 19.6 minutes of steps with a
      planned SIGTERM after the second analysis batch and a resume from the panel; three defects found and fixed on the
      way (E159: the server started where the package was not importable; E160: a letterhead rule counted as a table
      rule; E161: killed sessions retried after the stop). On the owner's Mac (11 Oct 2026, session 19, the drill
      ADD03, claude-opus-5-5 as the CLI reported it): the panel upload ran to the review packet in 20:34 (PARTIAL,
      6.1 and 7.1 unresolved); a separate probe copy was stopped and resumed. An older CLI (2.1.206) rejected
      --permission-prompts and the model: now a named setup failure (docs/INTERVIEW_DEMO_HANDOVER.md)
    works: >-
      on the owner's Mac: the panel upload, every phase that ran (analysis, downstream, critic), image crops, the stop
      and resume, one bounded repair session; in the cloud container: the workflow starting Claude Code sessions itself, every phase, the stop and resume, the
      rate-limit deferral, the run from an unzipped interview folder (sessions 10-13)
    never_run: "on the owner's Mac: the launcher path (INTERVIEW_START.command), a rate-limit deferral, a reading-phase region; the AI quick review on a real host"
    ready: >-
      `claude` on PATH and logged in; launcher option 1 (connected), then option 6, route host (Enter); or
      `.venv/bin/python -m tenderpack ai run ADD-03 --pdf smoke-test/ADD-03_Addendum_No_3.pdf --route host`
    next: on the Mac, docs/MAC_CHECKLIST.md step 6 from the launcher (docs/VERIFY_ON_MAC.md "connected route with Claude Code")
  codex:
    label: Codex (connected coding host over MCP; manual path)
    status: built, unverified
    where: the MCP server Codex would use, over stdio JSON-RPC (tests/test_session09_ai_mcp.py), and the manual host path (tests/test_session10_workflow.py); no Codex here
    when: 2026-10-04 (the MCP server tests)
    result: >-
      this manual path (MCP tools, then `tenderpack ai submit` / `submit-batch`) has not run with Codex. Codex sessions
      have run automatically through the host route with host_session.driver: codex on the development machine (8-10
      Oct 2026, as recorded in docs/INTERVIEW_DEMO_HANDOVER.md; config/interview-ai-codex.yaml); not re-run in session 19
    works: >-
      tested in the cloud container: the MCP server Codex would talk to (stdio JSON-RPC, the tool list, a submission),
      the manual host path (`ai run --route host --host-manual` stops with exit 4 and a task packet; `ai submit-batch`
      validates the answer exactly as any route's)
    never_run: "a Codex session over this manual path; the ~/.codex/config.toml registration"
    ready: >-
      in ~/.codex/config.toml: [mcp_servers.tenderpack] command = "<folder>/.venv/bin/python", args = ["-m",
      "tenderpack", "ai", "serve-mcp"]; then `.venv/bin/python -m tenderpack ai run ADD-03 --pdf <pdf> --route host
      --host-manual` (exit 4, the packet's path), Codex answers, `.venv/bin/python -m tenderpack ai submit-batch
      <run id> answer.json --by "<who>" --host-model "<the model>"`
    next: register the MCP server in ~/.codex/config.toml (docs/AI_ROUTES.md section 3) and run one batch by hand
  anthropic:
    label: Anthropic API key (the application's paid Messages API calls)
    status: untested
    where: recorded responses in tests only; no API-key call has been made from this project's environment
    when: never live
    result: >-
      the adapter, capability check, structured output and failure classes are tested against recorded responses;
      a live call needs a key AND the owner's caps (max_calls / tokens / max_usd) in config/ai.yaml
    works: "recorded responses only (tests): the request and response code, the capability policy, the caps refusal"
    never_run: any call to api.anthropic.com from this project (no key has been used)
    ready: >-
      dry run (no paid call; it reads the model's limits): `.venv/bin/python -m tenderpack ai capabilities --route
      anthropic --model claude-opus-5-5`; then set routes.anthropic.caps in config/ai.yaml (they are null: the route
      refuses to start until you set them)
    next: >-
      the key through the secure configuration only (ANTHROPIC_API_KEY in the environment, or a chmod-600
      ~/.config/tenderpack/keys.env outside the folder; never chat or logs), then `tenderpack ai capabilities --route
      anthropic --model claude-opus-5-5`
  openrouter:
    label: OpenRouter API key (paid; another provider's models)
    status: blocked here, unverified
    where: openrouter.ai is blocked from the cloud container; recorded responses in tests only
    when: never live
    result: the model slugs in config/ai.yaml are unverified; nothing has reached openrouter.ai from this project
    works: "recorded responses only (tests): the listing-based capability check, the request shape, the refusals"
    never_run: any call to openrouter.ai (blocked here); the slugs in config/ai.yaml have never been checked
    ready: >-
      OPENROUTER_API_KEY in the environment (or the chmod-600 keys.env); config/ai.yaml routes.openrouter.models.propose
      (anthropic/claude-opus-5.5, unverified) and routes.openrouter.caps (null until you set them); dry run:
      `.venv/bin/python -m tenderpack ai capabilities --route openrouter --model anthropic/claude-opus-5.5`
    next: as for the Anthropic key (OPENROUTER_API_KEY), then `tenderpack ai capabilities --route openrouter --model M`
  ollama:
    label: Ollama (local inference on this machine; the offline route)
    status: pending on the Mac
    where: a fake local server and recorded answers in tests (tests/test_session12_offline.py, tests/test_session14_mac_levels.py); no real Ollama here
    when: 2026-10-05 to 2026-10-07 (tests only)
    result: >-
      offline mode refuses every hosted route before any call (tested); no real local model has run; no model is ever
      pulled by tenderpack
    works: >-
      prepared for local use and tested against a fake local server: the model roles in config/ai.yaml
      (routes.ollama.models: text, vision, critic), the discovery of the installed models with their capabilities and
      context, the memory estimate against 48 GB, offline mode, the three check levels (connectivity, valid content,
      complete workflow)
    never_run: a real local model, on any machine; the memory and timing measurements
    ready: >-
      the pull commands are your choice (tenderpack never pulls): `ollama pull qwen3:30b-a3b` (text) and `ollama pull
      qwen3-vl:32b` (vision, critic), or point routes.ollama.models at models you have; then `.venv/bin/python -m
      tenderpack ai ollama-models` and `bash scripts/mac/checks.sh --only 6,7`
    next: on the Mac, docs/MAC_CHECKLIST.md step 5 (checks.sh checks 6 and 7, then one offline run)
