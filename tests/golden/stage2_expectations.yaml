# -------------------------------------------------------------------------------------
# Discrepancies noticed in the pack (facts; no resolution implied)
# -------------------------------------------------------------------------------------
discrepancies:
  - "Form 4-A, both the original (VOL-IV p3) and the ADD-01 reissue (ADD-01 p3), prints PDD 12 November 2026 after ADD-01 moved it to 26 November 2026."
  - "ADD-01 Appendix A says the reissue adds the Addenda acknowledgement 'at paragraph 1', but the reissued form has no numbered paragraphs. It also drops all six numbered confirmations and five fields of the original."
  - "ADD-01 minutes Item 3 ('seventy / thirty split', said to 'remain') disagree with VOL-I 11.2 (60/40) and with ADD-02 (65/35)."
  - "ADD-02 makes the 11.2 weighting change only in a note to the revised Table 1-1; its opening summary does not mention it."
  - "ADD-02 note (3) speaks of 'the weight shown' and a 'standard five-point scale'; the table shows Marks, and the scale is not defined in the pack."
  - "ADD-01 4.1 deletes VOL-I 8.6; ADD-02 9.1 reinstates it at 35% (BASE 30%) and adds a non-responsiveness consequence that BASE 8.6 lacked."
  - "Concession term: VOL-I 12.1 runs from PCOD, VOL-V 3.1 from the Effective Date. ADD-02 Q7 declines to amend and points to the VOL-I 3.2 order of precedence."
  - "Form 4-C Arabic declaration 4 gives 'exclusion (استبعاد) of the proposal' for any incorrect statement. No English text in the pack carries this consequence or uses this category."
  - "VOL-II Table 2-4 image is titled 'Minimum Effluent Quality Parameters' but its qualifier says 'all values are maxima'. Residual Chlorine and pH are ranges."
  - "VOL-II p3 says 'The following page is reproduced as issued', but the reproduced table image sits on the same page (p3)."
  - "VOL-II p3 says the Environmental Permit (not in the pack) prevails over the reproduction, while ADD-02 5.1 amends the reproduction's TN value."
  - "VOL-II Table 2-6: 'Storm flow to be passed to full treatment' is 3 x dry weather flow. With 120,000 m3/day (5,000 m3/h average) that exceeds the 7,500 m3/h 'Peak hourly flow (design)'. ADD-02 Q11 only points to VOL-II 4.2."
  - "VOL-I footnote 12 is printed mid-page, between 8.5 and 8.6, not at the page foot."
  - "ADD-02 7.1 adds Form 4-G to VOL-IV but does not amend the VOL-IV cover ('Forms 4-A to 4-F') or the Index of Forms."
  - "ADD-01's opening summary does not mention the Form 4-A reissue (Appendix A) or the 3.1 attendance-notification requirement."

