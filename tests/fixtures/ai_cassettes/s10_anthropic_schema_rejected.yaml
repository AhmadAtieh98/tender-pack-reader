# RECORDED HTTP FIXTURE (hand-written; NOT a live endpoint's output). Session 10, W4. The endpoint REJECTS the
# structured-output schema (a 400 naming output_config.format): the adapter switches to the plain tool-use path for the
# rest of the run, with a route notice in the run log and the review request (never silently), and the attempt is
# retried (counted as a call) WITHOUT output_config.format; the effort setting is kept. The answer is parsed and
# validated locally. Expected: ADD-03/2.1 evidence_verified.
name: s10-anthropic-schema-rejected
exchanges:
