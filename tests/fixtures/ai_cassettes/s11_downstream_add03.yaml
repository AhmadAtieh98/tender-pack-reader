              {"id": "D17", "state": ${state}, "statement_type": "clarification_item", "task": "clar:CQ-BOND-FC-COVERAGE", "provision": "ADD-03:3.2", "payload": {"entry": {"id": "CQ-BOND-FC-COVERAGE", "topic": "bond coverage (follow-up to ADD-02 Q13)", "kind": "discrepancy", "volume": "Volume I", "clause": "6.3 (with 12.2)", "page": 3, "units": ["VOL-I:6.3", "VOL-I:12.2", "VOL-I:7.1", "VOL-I:7.2", "ADD-02:Q13", "ADD-02:Q8", "ADD-01:Q3"], "sources": [{"unit": "VOL-I:6.3", "page": 3, "words": "shall remain valid for one hundred and eighty (180) days from the Proposal Due Date and shall be extended on demand where the Authority extends the period of Proposal validity"}, {"unit": "VOL-I:12.2", "page": 6, "words": "Failure to achieve Financial Close by the long-stop date entitles the Authority to call the Bid Bond and to proceed with the next ranked Bidder."}, {"unit": "VOL-I:12.2", "page": 6, "words": "Financial Close within two hundred and seventy (270) days, of the date of the Preferred Bidder Notification"}, {"unit": "ADD-02:Q13", "page": 2, "words": "The periods in Volume I Clause 12.2 are unchanged."}], "gap": "As amended by Addendum No. 3, the Bid Bond runs 210 days from the Proposal Due Date and must be extended only when Proposal validity (now 180 days) is extended, but VOL-I 12.2 lets the Authority call it if Financial Close is missed, up to 270 days after the Preferred Bidder Notification. No clause requires the bond to cover that period.", "already_settled": "ADD-02 Q13 settles that the 12.2 periods (Commercial Close 120 days, Financial Close 270 days from the Preferred Bidder Notification) are unchanged; ADD-02 Q8 and ADD-01 Q3 settle the bond amount and issuer. None of these is re-asked.", "practical_impact": "Determines the expiry date and extension commitment the issuing bank must give, and its cost, and the Preferred Bidder's exposure to a call at Financial Close; a fixed-expiry bank instrument must be drafted to match.", "proposed_question": "Volume I, Clause 6.3, page 3, as amended by Addendum No. 3 Section 3.2, and Clause 12.2, page 6: will the Preferred Bidder be required to extend the Bid Bond so that it remains valid until Financial Close or the long-stop date and, if so, to what date?", "interim_handling": "Arrange the bond to VOL-I 6.3-6.4 with an expiry no earlier than the later counting reading (25 May 2027), and obtain the bank's indicative agreement to extend it through a Financial Close long-stop; carry that extension cost in the bid budget without assuming the Authority's answer.", "decision_owner": "Commercial", "response_status": "draft, not sent", "linked_issues": ["I-VOL-I-BOND-LONGSTOP"], "theme": "contract"}}, "evidence": [{"doc": "ADD-03", "unit_id": "ADD-03:3.2", "page": 1, "kind": "span", "words": "‘two hundred and ten (210) days’ is substituted"}]},
