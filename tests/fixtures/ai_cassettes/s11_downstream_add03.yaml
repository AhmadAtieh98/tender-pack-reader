# RECORDED WORKFLOW (hand-written for offline tests; NOT a live model's output and not a live integration).
# Session 11, D1: the workflow (tenderpack ai run --route recorded) on the first page of blind rehearsal 02's Addendum
# No. 3 (cover and Sections 1-3; the rest cut away by the test, so the addendum has 12 provisions) added to the
# real pack. ${state} is replaced with the state identity from the batch's task packet. The test runs the
# downstream phase as ONE batch (downstream batch size and output cap set for it), which this one session answers.
#
# analysis: every one of the 12 provisions is answered (both batches recorded): no_effect for the cover lines and the
#   recitals; the Form 4-A acknowledgement in the cover annotated as an added obligation; 2.1, 2.3, 3.1, 3.2
#   replace_text; 2.4 insert_unit (new Clause 6.8); 3.3 annotate (interprets Form 4-A); 2.2 (it ends a statement of
#   ADD-01 2.1) escalated: the engine does not re-target an earlier amendment, a person decides.
# downstream: one session answering every downstream task the workflow plans for this state (see its comment).
#   Session 14 (W2): the workflow now also plans a CONDITIONAL impact investigation for the escalated 2.2 and one
#   obligation task per op that adds a unit or an obligation (2.4, cover/para3); D31-D33 answer them `no_change`.
