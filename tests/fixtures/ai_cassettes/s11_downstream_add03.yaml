              {"id": "D15", "state": ${state}, "statement_type": "issue", "task": "c46:ADD-03/2.4", "provision": "ADD-03:2.4", "payload": {"id": "I-ADD03-DELIVERY-REG", "owner": "Bid manager", "theme": "envelopes", "short": "register the delivery representatives five Working Days before the PDD (new VOL-I 6.8)", "text": "New VOL-I Clause 6.8 (ADD-03 2.4): up to two representatives who will deliver the Proposal are registered through the Portal five Working Days before the Proposal Due Date; access to the delivery address is refused to anyone not registered, and a Proposal not received in time for that reason is late (VOL-I 6.6). Who delivers is a bidder decision."}, "evidence": [{"doc": "ADD-03", "unit_id": "ADD-03:2.4", "page": 1, "kind": "span", "words": "Access to Administrative Building A will be refused to any person who is not so registered"}]},
