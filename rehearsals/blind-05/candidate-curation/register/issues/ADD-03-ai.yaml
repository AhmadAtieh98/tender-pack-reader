issues:
  I-ADD03-PRICE-BASIS:
    text: ADD-03 gives two price bases for the Availability Payment. (1) 3.1 amends VOL-V 1.1 to 'the annual payment,
      expressed at Base Date prices'. 3.3 replaces VOL-V 29.2 so that indexation runs 'annually from the Base Date',
      which is 28 days before the PDD. (2) Q19 says the Form 4-F figure is 'the amount payable for year 1 of operations,
      in the prices of that year' and that 'Indexation under Volume V Clause 29.2 applies from the first anniversary
      of PCOD'. A figure at Base Date prices indexed from the Base Date is not the same as a year 1 figure indexed
      from the first anniversary of PCOD. The Form 4-F price and the Financial Model (ADD-03 3.4) cannot be prepared
      on both bases. The pack does not say which governs. The clarification cut-off (2026-11-12) passed before ADD-03
      issued on 2026-11-15, so the route for a question needs a decision. Owner to decide the basis, or to seek
      an Authority response. [AI workflow run ADD-03-run-host-blind05-20261005T025444Z (route host, model claude-code
      headless (opus)); PROPOSED; not reviewed]
