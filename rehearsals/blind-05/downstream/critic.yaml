          of PCOD. 3.1 states Base Date prices, and 3.3 indexes annually from the Base Date.
        - The Base Date definition in 3.2 and the content of Schedule 9 are not in the evidence shown. The proposer
          correctly lists them as missing, so the conflict cannot be resolved from the pack.
        evidence_checked:
        - ADD-03:Q19
        - ADD-03:3.1
        - ADD-03:3.3
        selected_because: *id003
        route: host
