  DS-ADD03-ESC-COVER:
    batch: downstream-003
    review:
      critic:
        agrees: false
        concerns:
        - The conflict between the cover and ADD-03 5.1 is real. The cover says the odour criterion is in VOL-II
          3.5, but VOL-II:3.5 is a noise limit (55/45 dB(A)). The odour limit is in VOL-II 3.4, and that is the
          clause 5.1 amends.
        - The claim that 2.1 contradicts 'without change of substance' is not shown. ADD-03:2.1 and the original
          VOL-I 6.6/6.7 text are not printed in the units. Only the 2.1 quote about a two-Working-Day modification
          deadline is given. Without the earlier 6.6/6.7 wording, we can't tell whether that deadline is a change
          of substance.
        - The statement that the Form 4-A units in units_after are all superseded is not in the printed evidence.
          The unclear acknowledgement version therefore can't be checked.
        - The item cites 'VOL-I 3.2 precedence within a document'. The cover itself only says the addendum takes
          precedence over the RFP Documents. No VOL-I 3.2 text is shown.
        - The 'unsupported downstream changes' list names rows, activities and clarifications that are not in the
          evidence. This part can't be checked.
        evidence_checked:
