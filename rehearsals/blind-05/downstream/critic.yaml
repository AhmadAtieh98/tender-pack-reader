    batch: downstream-001
    review:
      critic:
        agrees: true
        concerns:
        - The reading is an interpretation. Q20 says only that Clause 6.2 applies, and 'other commercial information'
          is not defined, so a person must confirm it.
        - Q20 also requires the figure in the Form 4-F row. The evidence shown does not say which envelope Form
          4-F belongs to, so the reading depends on Form 4-F being outside Envelope A.
        evidence_checked:
        - ADD-03:Q20
        - VOL-I:6.2
        selected_because: *id001
        route: host
        critic_run: ADD-03-run-host-blind05-20261005T025444Z-downstream-001-critic
        model_reported: claude-sonnet-5-5
