          of PCOD. ADD-03 3.3 says indexation runs 'from the Base Date', and the 3.1 quote says 'expressed at Base
          Date prices'.
        - The 3.1 text is not printed in the units. I relied on the controller's verbatim check of that quote.
        - The claim that Q20's field is not a qualification is an interpretation, and a person must confirm it.
          The target sentence is unchanged and states no consequence.
        - Q20 also says 'Volume I Clause 6.2 applies'. The item does not discuss it, and its text is not in the
          evidence.
        - The Base Date being 28 days before the PDD is not in the evidence shown.
        evidence_checked:
        - VOL-IV:F4-F/para1
        - ADD-03:Q19
        - ADD-03:Q20
        - ADD-03:3.3
        selected_because: *id004
        route: host
