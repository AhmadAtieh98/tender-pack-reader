cover:
  text: "This Addendum consolidates Volume I Clauses 6.6 and 6.7 without change of substance, amends the definition of Availability Payment and the indexation of the Availability Payment under Volume V Clause 29.2, adds a membrane filtration requirement to Volume II Clause 3.1, replaces the odour criterion in Volume II Clause 3.5 by reference to the Environmental and Social Impact Assessment, inserts a new Volume II Clause 5.6 limiting the height of permanent structures at the site in accordance with Table 5-1, and responds to clarification requests 15 to 21."
  planted_errors:
    - id: E1
      mechanism: "False editorial characterisation: a substantive change is labelled as a consolidation 'without change of substance'. (Not used in blind-01..04.)"
      claim: "consolidates Volume I Clauses 6.6 and 6.7 without change of substance"
      truth: "The merged 6.6 moves the last day for MODIFYING a Proposal from 'at any time before the Proposal Due Date' to 'not later than two (2) Working Days before the Proposal Due Date' (Tuesday 24 November 2026), and a late modification is now 'rejected unopened and returned to the Bidder' (formerly 'No modification will be accepted thereafter'). Withdrawal is still allowed until the PDD."
      detect_by: "Diff ADD-03 2.1's quoted 6.6 against VOL-I 6.6 + 6.7 (SB01, SB02) clause by clause; do not trust the 'consolidation' label."
      severity: high
    - id: E2
      mechanism: "Wrong-provision attribution: the cover names a real neighbouring clause number (VOL-II 3.5, noise) for a change the body makes to another clause (VOL-II 3.4, odour). (Not used in blind-01..04.)"
      claim: "replaces the odour criterion in Volume II Clause 3.5"
      truth: "Section 5.1 amends VOL-II Clause 3.4 (odour). The quoted deleted words 'not more than 5 OU/m3 at the site boundary' exist only in 3.4. VOL-II 3.5 (noise, 55/45 dB(A)) is NOT amended."
      detect_by: "Locate the deleted words of 5.1 in the pack (SB20, VOL-II p.3, Clause 3.4); check SB21 is untouched by the body."
      severity: medium
      trap: "A tool indexing changes from the cover would flag VOL-II 3.5 (noise) as amended - must not be reported (see must_not_report)."
    - id: E3
      mechanism: "The cover repeats the non-governing convenience translation: it describes the scope of Table 5-1 as the English translation does ('permanent structures') although the governing Arabic text says otherwise. (Not used in blind-01..04.)"
      claim: "limiting the height of permanent structures at the site"
      truth: "Arabic Note 1 of Table 5-1 (governing, ADD-03 7.2): the limits apply to all permanent AND TEMPORARY structures, including stacks, cranes and construction equipment. Only the English translation (Appendix B Note (1)) says 'all permanent structures, including stacks'."
      detect_by: "Read the image on page 4 (Arabic Note 1: 'الدائمة والمؤقتة' and 'الرافعات ومعدّات الإنشاء'); corroborated in the English body by 7.3 ('any structure, plant or equipment') and Q21 (crane and lifting plan must demonstrate compliance with Table 5-1)."
      severity: high
  accurate_items:
    - "amends the definition of Availability Payment (VOL-V 1.1) and the indexation under VOL-V 29.2"
    - "adds a membrane filtration requirement to VOL-II 3.1"
    - "the odour criterion is replaced by reference to the ESIA (only the clause number is wrong)"
    - "inserts a new VOL-II 5.6 in accordance with Table 5-1 (only the scope description is wrong)"
    - "responds to clarification requests 15 to 21 (seven answers; range correct)"
  not_planted_but_acceptable_to_note:
    - "The cover does not mention the new VOL-V Clause 1.1A (Base Date) - part of the AP/indexation change; noting it is correct but it is not a planted error."
    - "The cover does not mention 7.3 (notice of structures over 30 m) or the requirement-level changes made in responses 17, 20 and 21; the cover of ADD-02 likewise did not itemise Q&A content."

secondary_undisclosed_effects:
  - {id: S1, where: "2.1 (merged 6.6)", effect: "Modification cut-off moves to 2 Working Days before the PDD (Tue 24 Nov 2026); a late modification is rejected unopened and returned. Hidden behind E1."}
  - {id: S2, where: "3.2", effect: "New defined term Base Date (VOL-V 1.1A) = 28 days before the PDD = Thursday 29 October 2026 (already in the past at issue)."}
  - {id: S3, where: "3.3 (new 29.2)", effect: "Indexation runs from the Base Date; the 60/40 split is replaced by a Bidder-elected Indexed Proportion of 50%-70% until the end of year 10 of operations, then a fixed 75% from year 11 (outside the band by design)."}
  - {id: S4, where: "5.1", effect: "The odour assessment point moves from the site boundary to the nearest sensitive receptor (location only in ESIA Figure 7-2), and the 5 OU/m3 value is replaced by a value not in the pack."}
  - {id: S5, where: "4.1", effect: "VOL-II 3.2 (membrane life >= 7 years warranted, replacement in lifecycle plan) switches from conditional ('Where a membrane process is proposed') to always applicable; ADD-01 response 1 becomes partly wrong."}
  - {id: S6, where: "7.3", effect: "New Portal notice by Mon 23 Nov 2026 for any structure, plant or equipment above 30 m (Bidder-design-dependent); no consequence stated."}
  - {id: S7, where: "Table 5-1 Arabic (image)", effect: "Datum = natural ground level before grading/fill; scope includes temporary structures, cranes, construction equipment and stacks; 30-day prior notice to the Office before erecting any crane."}
  - {id: S8, where: "Q17", effect: "VOL-I 8.3 extended: every member of an unincorporated EPC JV must hold a compliant ISO 9001:2015 certificate; a copy of each in Envelope A."}
  - {id: S9, where: "Q20", effect: "Form 4-F row 'Indexation basis assumed' must be completed with the Indexed Proportion after the pre-printed words; the Indexed Proportion must not appear anywhere in Envelope A (VOL-I 6.2)."}
  - {id: S10, where: "Q21", effect: "VOL-I 9.7 extended: the construction methodology must include a crane and lifting plan demonstrating compliance with Table 5-1."}

provisions:
  - ref: "ADD-03 1.3"
    target: "VOL-I 5.2 (context)"
    type: recital_fact
    new: "Requests for clarification received after the time stated in Volume I Clause 5.2 have not been answered."
    expected_result: "No change to 5.2. Record that the clarification cut-off (Thu 12 Nov 2026) passed before ADD-03 was issued (Sun 15 Nov 2026): no clarification route remains for anything ADD-03 makes unclear."
  - ref: "ADD-03 2.1"
    target: "VOL-I 6.6 + 6.7"
    type: "merger of two clauses with a hidden substantive change"
    old: ["A Proposal received after the time stated in Clause 6.1 will be rejected unopened and returned to the Bidder.", "A Bidder may withdraw or modify its Proposal at any time before the Proposal Due Date by written notice through the Portal. No modification will be accepted thereafter."]
    new: "A Bidder may withdraw its Proposal at any time before the Proposal Due Date, and may modify its Proposal not later than two (2) Working Days before the Proposal Due Date, in each case by written notice through the Portal. A Proposal received after the time stated in Clause 6.1, and a modification received after the time stated in this Clause, will be rejected unopened and returned to the Bidder."
    expected_result: "VOL-I 6.6 AMENDED (replaced by merged text); VOL-I 6.7 DELETED (number left unused). Register rows that cited 6.7 must be re-pointed to 6.6 with the chain VOL-I 6.6/6.7 -> ADD-03 2.1."
    consequences:
      - "Withdrawal: unchanged (until the PDD)."
      - "Modification: last day Tuesday 24 November 2026 (2 WD before Thu 26 Nov, VOL-I 2.4 backward count). Time of day not stated (see D2)."
      - "Late modification: rejected unopened and returned (new consequence wording)."
      - "Late Proposal: unchanged (rejected unopened and returned)."
  - ref: "ADD-03 2.2"
    target: "VOL-I numbering"
    type: "non-renumbering statement"
    new: "The number 6.7 is not reused. The Clauses of Volume I are not renumbered."
    expected_result: "No renumbering anywhere. Clause 6.7 becomes a gap."
  - ref: "ADD-03 3.1"
    target: "VOL-V 1.1 (definition used in Form 4-F, VOL-I 10.2, 11.5, VOL-V 24.3, 29, 31)"
    type: "change to a defined term whose term is used in forms"
    old: "the annual payment calculated under Clause 29"
    new: "the annual payment, expressed at Base Date prices, calculated under Clause 29"
    expected_result: "VOL-V 1.1 AMENDED. Every use of 'Availability Payment' now means a Base-Date-price amount, including the three uses in Form 4-F (row 'Availability Payment (SAR per annum, year 1 of operations)', the words row, and the confirmation statement), which Form 4-F itself does not show."
    consequences: ["Form 4-F and the Financial Model must state the AP at Base Date prices (but see D1: Q19 says the opposite)."]
  - ref: "ADD-03 3.2"
    target: "VOL-V new 1.1A"
    type: insertion_of_definition
    new: "Base Date means the date falling twenty-eight (28) days before the Proposal Due Date."
    expected_result: "VOL-V 1.1A ADDED. Base Date = Thursday 29 October 2026 (calendar days, not Working Days). It moves if the PDD moves."
  - ref: "ADD-03 3.3"
    target: "VOL-V 29.2"
    type: "tolerance band replacing a single value + Bidder election + staged (two time phases)"
    old: "The Availability Payment shall be indexed annually in accordance with Schedule 9, with sixty per cent (60%) of the payment indexed to the published consumer price index and forty per cent (40%) remaining fixed."
    new: "The Availability Payment shall be indexed annually from the Base Date in accordance with Schedule 9. The proportion of the payment indexed to the published consumer price index (the Indexed Proportion) shall be: (a) until the end of the tenth (10th) year of operations, the percentage stated by the Bidder in Form 4-F, which shall be not less than fifty per cent (50%) and not more than seventy per cent (70%); and (b) from the start of the eleventh (11th) year of operations, seventy-five per cent (75%). The balance of the payment shall remain fixed."
    expected_result: "VOL-V 29.2 REPLACED. Register: Indexed Proportion = Bidder election in [50%, 70%] (fixed balance 30%-50%) to end of year 10; 75%/25% from year 11; indexation from the Base Date per Schedule 9 (not supplied). The register must hold the band AND the election AND both stages, not a single value."
    consequences:
      - "A figure outside 50%-70% in Form 4-F is a 'price subject to adjustment other than as provided in Volume V' -> non-responsive under VOL-I 10.5 (derived; the addendum states no consequence itself)."
      - "Form 4-F row 'Indexation basis assumed' must carry the figure (Q20)."
      - "Stage (b) 75% lies outside the stage (a) band on purpose; it is not an inconsistency."
  - ref: "ADD-03 3.4"
    target: "VOL-I 10.3 Financial Model"
    type: confirming_instruction
    new: "Bidders shall reflect this Section 3 in the Financial Model submitted under Volume I Clause 10.3."
    expected_result: "Financial Model row: add the Base Date price basis and the staged indexation (and flag D1)."
  - ref: "ADD-03 4.1"
    target: "VOL-II 3.1"
    type: "replacement whose main effect is to trigger a conditional clause and overtake an earlier answer"
    old: "The Authority does not mandate a particular process train."
    new: "The treatment process shall include a membrane filtration step, either in the tertiary treatment stage or as part of a membrane bioreactor, with a nominal pore size not exceeding 0.1 µm. Subject to the preceding sentence, the Authority does not mandate a particular process train."
    expected_result: "VOL-II 3.1 AMENDED (new mandatory requirement: membrane filtration, pore size <= 0.1 µm, tertiary or MBR)."
    consequences:
      - "VOL-II 3.2 becomes APPLICABLE (status change from conditional to mandatory) although 3.2 is not cited: warranted membrane life >= 7 years; membrane replacement in the lifecycle plan."
      - "ADD-01 response 1 is now PARTLY WRONG: 'No' (MBR not mandatory) still holds; 'Any process capable of meeting Table 2-4 under the Table 2-2 influent conditions is acceptable' no longer holds."
      - "VOL-II 4.3 (four parallel streams per treatment stage) applies to the membrane filtration stage."
  - ref: "ADD-03 4.2"
    target: "VOL-II Section 3 process design"
    type: confirming_instruction
    new: "Bidders shall reflect this Section 4 in the process design submitted under Volume II Section 3."
  - ref: "ADD-03 5.1"
    target: "VOL-II 3.4"
    type: "change expressed by cross-reference to another document's figure (value not supplied)"
    old: "not more than 5 OU/m3 at the site boundary"
    new: "not more than the odour concentration shown for the nearest sensitive receptor in Figure 7-2 of the Environmental and Social Impact Assessment referred to in Volume II Clause 9.1, at that receptor"
    expected_result: "VOL-II 3.4 AMENDED: limit = value in ESIA Figure 7-2 (NOT IN PACK), assessed at the nearest sensitive receptor (location NOT IN PACK); 98th percentile hourly basis unchanged. The 5 OU/m3 value is gone; no replacement value may be stated. Status: amended, value unresolved (missing evidence ME1)."
  - ref: "ADD-03 5.2"
    target: "Technical Proposal"
    type: confirming_instruction
    new: "Bidders shall demonstrate compliance with Volume II Clause 3.4, as amended, in the Technical Proposal."
  - ref: "ADD-03 7.1"
    target: "VOL-II new 5.6"
    type: "insertion incorporating an image-only foreign-language table by reference"
    new: "The Project Company shall comply with the height limits in Table 5-1, which is reproduced at Appendix A to this Addendum as issued by the Northern Region Airspace Safeguarding Office and is incorporated into this Volume by reference."
    expected_result: "VOL-II 5.6 ADDED; Table 5-1 (Arabic, image) ADDED. Values must be read from the image: Zone A (within 1,500 m of the eastern site boundary) 25 m; Zone B (remainder) 40 m; metres above NATURAL ground level; obstacle lighting required in Zone A, and in Zone B for any part above 30 m; limits cover permanent and temporary structures incl. stacks, cranes, construction equipment; 30 days' prior notice to the Office before erecting any crane."
  - ref: "ADD-03 7.2"
    target: "Table 5-1 language"
    type: governing_language_rule
    new: "Table 5-1 is issued in the Arabic language. The Arabic text governs. The English translation at Appendix B is provided for convenience only."
    expected_result: "Where Appendix B differs from Appendix A, record the Arabic. Two discrepancies (AR1, AR2) must be reported."
  - ref: "ADD-03 7.3"
    target: "new bid-stage notice (Bidder-design-dependent)"
    type: "change that depends on the Bidder's own election, with a derived deadline"
    new: "A Bidder whose Proposal provides for any structure, plant or equipment at the site exceeding thirty (30) metres in height shall notify the Authority through the Portal, not later than three (3) Working Days before the Proposal Due Date, of the zone of Table 5-1 in which it is to be located and its proposed height."
    expected_result: "New conditional obligation: applies only if the Bidder's design or construction plant (cranes count, see Arabic Note 1 and Q21) exceeds 30 m; deadline Monday 23 November 2026; content = zone + proposed height. No consequence stated: NOT an A3 disqualifier."
  - ref: "ADD-03 7.4"
    target: "Technical Proposal"
    type: confirming_instruction
    new: "Bidders shall reflect Table 5-1 in the Technical Proposal."

answers:
  - no: 15
    class: decoy_no_effect
    question_topic: "VOL-II 6.4 data retention: 7 years vs 10 years"
    response: "Volume II Clause 6.4 states a minimum period. A Bidder may propose a longer period but is not required to do so."
    expected: "No change. VOL-II 6.4 stays 'not less than seven (7) years'. Must not register 10 years."
  - no: 16
    class: confirming_in_imperative_words
    question_topic: "Form 4-E 'no deviations' and assumptions in the Technical Proposal"
    response: "A Bidder that states ‘no deviations’ in Form 4-E shall not include any qualification of Volume V elsewhere in its Proposal. An assumption that limits or qualifies an obligation in Volume V is a qualification and shall be listed in Form 4-E. Volume I Clause 9.6 applies."
    expected: "Confirms VOL-I 9.6 (already a non-responsiveness trigger); no new requirement, no status change. May be linked to the 9.6 row as a confirmation. Note its interaction with D1: an assumption about the AP price basis would be a qualification (Form 4-E is in Envelope A, so it would also be commercial information under 6.2)."
  - no: 17
    class: changing
    question_topic: "VOL-I 8.3 ISO 9001:2015 where the EPC Contractor is an unincorporated JV"
    response: "Each member of the joint venture shall hold a certificate that meets Volume I Clause 8.3, and a copy of each certificate shall be submitted with Envelope A."
