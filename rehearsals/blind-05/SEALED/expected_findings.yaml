deliberate_ambiguities:
  - id: D1
    no_correct_answer: true
    subject: "Price basis of the Availability Payment stated in Form 4-F, and the start of indexation"
    horn_a: "ADD-03 3.1 + 3.2 + 3.3: AP 'expressed at Base Date prices' (29 Oct 2026) and 'indexed annually from the Base Date' -> Form 4-F carries a Base-Date (real) figure that is indexed up to and through operations."
    horn_b: "ADD-03 Q19: the Form 4-F figure is 'the amount payable for year 1 of operations, in the prices of that year' and indexation 'applies from the first anniversary of PCOD' -> Form 4-F carries a nominal year-1 figure. Supported by the pre-printed Form 4-F label 'year 1 of operations'."
    why_unresolvable:
      - "Both texts are in the same Addendum; VOL-I 3.2(a) ranks only a later Addendum over an earlier one, and nothing ranks body over responses within one Addendum."
      - "The clarification route closed on Thu 12 Nov 2026, before ADD-03 was issued (VOL-I 5.2; ADD-03 1.3); VOL-I 3.3 says unilateral resolution is at the Bidder's risk."
      - "The Bidder cannot qualify the price: conditional/qualified price -> VOL-I 10.5 non-responsive; Form 4-F confirms the AP 'is not subject to any qualification'; an assumption in Form 4-E would sit in Envelope A (6.2) and qualify the price."
      - "It cannot be fixed later: a clarification response that changes the AP is non-responsive (VOL-I 11.5)."
    stakes: "For the same economic offer the Form 4-F number differs by the CPI movement on the Indexed Proportion from 29 Oct 2026 to year 1 of operations (several years: Financial Close up to 270 days after PBN, then 36 months to Scheduled PCOD), plus one extra year of indexation under horn A. Schedule 9 is not supplied, so the size can only be expressed as a formula."
    expected: "Escalate to a named human owner (commercial lead) with both horns, the clause references and the non-responsiveness constraints. No machine resolution, no default."
  - id: D2
    no_correct_answer: false
    subject: "Time of day of the modification cut-off in merged 6.6"
    note: "'not later than two (2) Working Days before the Proposal Due Date' gives Tue 24 Nov 2026 but no time; PDD is a date and time (VOL-I 2.6). Conservative planning: 14:00 Riyadh time on Tue 24 Nov. Flag, do not assert."
  - id: D3
    no_correct_answer: false
    subject: "Which height datum 7.3's 'exceeding thirty (30) metres in height' uses"
    note: "7.3 states no datum; reading it with Table 5-1 (Arabic) gives natural ground level. Flag with medium confidence."
  - id: D4
    no_correct_answer: false
    subject: "Whether membranes are 'major assets' for VOL-V 42.1 handback"
    note: "Undefined in the pack; affects the lifecycle chain IE5 only. Flag as an assumption if used."

