cover:
  text: >-
    This Addendum incorporates the Network Operator's Table 1-3 describing the two tie-in points referred to in Volume II
    Clause 1.3, requires a Bidder that elects to interrupt flows at a tie-in point to obtain the Authority's acceptance of
    its shutdown programme, applications for which shall be made within eight (8) Working Days of the date of this
    Addendum, introduces a flow range for the reliability run in Volume II Clause 7.2, replaces Volume II Clauses 8.1 to
    8.3, adds to Volume V Clause 31.1 a new Unavailability Event for loss of treated effluent volume, with no cure period
    and with no deduction during the Ramp-Up Period, and responds to clarification requests 15 to 20.
  governing_rule: The operative Sections govern; each planted error is a cover discrepancy to report, never a change to register. Where the cover is wrong but the operative provision is clear, the change is resolved (not unresolved) and the discrepancy is listed separately.
  planted_errors:
    - id: E1
      mechanism: phantom provision (the cover announces an operative effect that no Section makes)
      cover_says: "with no deduction during the Ramp-Up Period"
      operative_truth: No Section of ADD-03 amends VOL-V 29.3 or mentions the Ramp-Up Period. VOL-V 29.3 relieves only "a parameter listed in Table 2-4 as assessed on a rolling average basis"; the new 31.1(d) is not a Table 2-4 parameter, so deductions for 31.1(d) apply from PCOD, including during the Ramp-Up Period.
      detect_by: Search ADD-03 Sections 1-6 for 29.3 / Ramp-Up (none); read SB17; note that 5.1-5.2 touch only 31.1 and 31.3.
      consequence_if_missed: Financial Model and risk register understate deduction exposure in the first 12 months after PCOD.
    - id: E2
      mechanism: wrong temporal anchor (period counted from the Addendum's date instead of from the Proposal Due Date)
      cover_says: "applications for which shall be made within eight (8) Working Days of the date of this Addendum"
      operative_truth: "Section 2.5: 'not later than eight (8) Working Days before the Proposal Due Date' = Monday 16 November 2026 (VOL-I 2.4 backward counting)."
      cover_date_if_believed: Sunday 22 November 2026 (8 WD after Tue 10 Nov, issue day not counted; Thursday 19 November if the issue day is counted)
      detect_by: Compare cover with Section 2.5; compute both dates.
      consequence_if_missed: A5 marshalling drop-dead for the Shutdown Acceptance Letter placed 3-4 Working Days too late; a Bidder relying on it loses method (b) by deeming (2.6).
    - id: E3
      mechanism: actor substitution (wrong issuer of a required document)
      cover_says: "to obtain the Authority's acceptance of its shutdown programme"
      operative_truth: Section 2.5 requires a Shutdown Acceptance Letter from the Network Operator (Northern Region Water Services Company), applied for to the Network Operator. The Authority does not accept or issue anything.
      detect_by: Read Section 2.5 ("a letter from the Network Operator"; "Applications ... shall be made to the Network Operator").
      consequence_if_missed: A5 marshalling row names the wrong issuer and the wrong application route.
  accurate_parts_not_errors:
    - 'incorporates the Network Operator''s Table 1-3 ... Volume II Clause 1.3 - accurate'
    - 'introduces a flow range for the reliability run in Volume II Clause 7.2 - accurate; the cover does not say the lower bound is relaxed from 90% to 85% (an undisclosed effect, not a planted error)'
    - 'replaces Volume II Clauses 8.1 to 8.3 - accurate; the silent deletion of 8.2 is a secondary undisclosed effect'
    - 'with no cure period - accurate (Section 5.2)'
    - 'responds to clarification requests 15 to 20 - accurate; answers 17 and 19 change requirements, and Q&A changes are not itemised on the ADD-01/ADD-02 covers either'

