  - {id: U9, what: "New conditional rejection ground for over-long interruptions of flow (2.7), governed by the Arabic Table 1-3", source: "ADD-03 2.7, 2.2"}
  - {id: U10, what: "Free-standing Addendum requirements (2.3-2.7, 3.2) that are not inserted into any Volume; register rows must cite ADD-03 itself", source: "ADD-03 2.3-2.7, 3.2"}

provisions:
  - id: P2.1
    section: "2.1"
    target: VOL-II 1.3
    change_type: append (incorporation by reference of a third-party Arabic table)
    old_anchor: "including any temporary works required to maintain flows during construction."
    added: "The two designated tie-in points are TP-1 and TP-2, described in Table 1-3, which is reproduced at Appendix A to this Addendum as issued by the Northern Region Water Services Company (the Network Operator) and is incorporated into this Volume by reference."
    expected_result: VOL-II 1.3 = SB01 + the added sentence. Table 1-3 becomes part of Volume II (precedence (d) under VOL-I 3.2, but issued by an Addendum - precedence (a) for ADD-03 itself).
    consequences: [new register rows for TP-1/TP-2 conditions (window, maximum duration, notice, one shutdown per point, Ramadan/Eid exclusion), Network Operator defined as a new term]
  - id: P2.2
    section: "2.2"
    change_type: governing-language rule
    text: "Table 1-3 is issued in the Arabic language. The Arabic text governs. The English translation at Appendix B is provided for convenience only."
    expected_result: Values are taken from the image (Appendix A); Appendix B discrepancies AR1 and AR2 are reported and resolved in favour of the Arabic.
  - id: P2.3
    section: "2.3"
    change_type: Bidder election per tie-in point (free-standing requirement)
    text: "The Bidder shall elect, for each tie-in point, one of the following methods of maintaining flows during the connection works, and shall state its election in the construction methodology section of the Technical Proposal: (a) temporary over-pumping, without interruption of flow in the existing collection network; or (b) interruption of flow within the permitted shutdown window stated for that tie-in point in Table 1-3."
    expected_result: Register a Technical Proposal content requirement (scored under Table 1-1 criterion B, construction methodology - 15 marks per ADD-02); requirements downstream are conditional on the election and may differ between TP-1 and TP-2.
    consequences: [no stated consequence for failing to state an election (not an A3 item)]
  - id: P2.4
    section: "2.4"
    change_type: requirement by reference to a value that is not supplied
    text: "The temporary works for method (a) shall be capable of passing, at each tie-in point, the maximum transfer flow stated for that tie-in point in Table 1-3."
    expected_result: Register the requirement with value UNKNOWN - Table 1-3 (Arabic and English) has no maximum transfer flow entry. See missing_evidence ME1.
  - id: P2.5
    section: "2.5"
    change_type: conditional new Envelope A document from a third party with a derived application deadline
    text: "Where the Bidder elects method (b) for a tie-in point, it shall submit with Envelope A a letter from the Network Operator accepting the Bidder's proposed shutdown programme for that tie-in point (a Shutdown Acceptance Letter). Applications for a Shutdown Acceptance Letter shall be made to the Network Operator not later than eight (8) Working Days before the Proposal Due Date. The Network Operator has undertaken to respond within five (5) Working Days of receipt of a complete application."
    expected_result: "Conditional Envelope A item (one letter per tie-in point for which (b) is elected). Application deadline Monday 16 November 2026. Response within 5 WD of a complete application (latest Monday 23 November 2026 if applied on 16 November). Issuer: Network Operator."
    consequences: [A5 marshalling row M1, position of the letter in the VOL-I 9.1 order is not stated (flag; 9.1(i) covers only Section 8 evidence)]
  - id: P2.6
    section: "2.6"
    change_type: deeming provision (fallback election, not a sanction)
    text: "A Bidder that elects method (b) for a tie-in point but does not submit a Shutdown Acceptance Letter for that tie-in point with Envelope A shall be deemed to have elected method (a) for that tie-in point."
    expected_result: Missing letter = deemed method (a) for that point; the Proposal is NOT non-responsive on that ground. Method (a) then binds, including P2.4 (whose value is missing).
  - id: P2.7
    section: "2.7"
    change_type: new conditional rejection ground whose threshold lives only in the Arabic image
    text: "A Proposal that provides for an interruption of flow at a tie-in point for longer than the maximum shutdown duration stated for that tie-in point in Table 1-3 shall be rejected."
    expected_result: "A3 item: rejected if the Proposal's programme interrupts flow for more than 6 hours at TP-1 or more than 4 hours at TP-2 (Arabic governs; the English '6' for TP-2 is wrong)."
  - id: P3.1
    section: "3.1"
    target: VOL-II 7.2
    change_type: tolerance band replacing a single minimum
    old: "at not less than 90% of nominal capacity"
    new: "at a daily average flow, measured at the inlet works, of not less than 85% and not more than 110% of nominal capacity"
    expected_result: "VOL-II 7.2 = 'PCOD shall not be certified until the Facility has completed a continuous reliability run of thirty (30) days at a daily average flow, measured at the inlet works, of not less than 85% and not more than 110% of nominal capacity, during which every parameter in Table 2-4 has been met.' Band = 102,000 to 132,000 m3/day (nominal 120,000 m3/day, VOL-II 2.1); previously >= 108,000 m3/day."
    consequences: [VOL-V 1.5 PCOD definition now depends on the band (IE1), see deliberate ambiguity DA1 for day counting]
  - id: P3.2
    section: "3.2"
    change_type: free-standing counting rule (Addendum-only text)
    text: "A day on which the daily average flow is outside that range shall not count towards the thirty (30) days. Volume II Clause 7.3 is unchanged."
    expected_result: Register as an ADD-03 requirement; VOL-II 7.3 unchanged (restart only on a Table 2-4 failure). The interaction with 'continuous' is DA1 - escalate, do not resolve.
  - id: P4.1
    section: "4.1"
    target: VOL-II 8.1 to 8.3 (range)
    change_type: range replacement whose replacement omits the middle clause
    new_8_1: "The Project Company shall hold a spare parts inventory sufficient for eighteen (18) months of normal operation for all items with a lead time exceeding twelve (12) weeks, and shall record that inventory in the asset register required by Clause 7.4."
    new_8_3: "The Project Company shall employ a plant manager holding a degree in chemical, civil, environmental or mechanical engineering and having not less than ten (10) years' experience in the operation of wastewater treatment facilities, and shall maintain a minimum of two (2) certified operators on shift at all times. The plant manager proposed for the first two (2) years of operation shall be named in the Technical Proposal, and his or her curriculum vitae shall be included as an appendix to it."
    expected_result: "8.1 replaced (2 years -> 18 months; record in asset register); 8.2 DELETED (not reproduced; 4.2 says not renumbered, so 8.2 is a gap); 8.3 replaced (qualifications; plant manager named with CV appendix in the Technical Proposal). 8.4 and 8.5 unchanged."
    consequences: [VOL-II 8.2 register row status = deleted by ADD-03 4.1 (later reinstated in amended form by ADD-04 3.1), internal inconsistency II1 with response 19, CV appendix is a Technical Proposal deliverable excluded from the 150-page limit (appendix expressly required by Volume II; VOL-I 9.2 as amended by ADD-02; ADD-01 response 2 still correct)]
  - id: P4.2
    section: "4.2"
    text: "The Clauses of Volume II are not renumbered. Volume II Clauses 8.4 and 8.5 are unchanged."
    expected_result: Confirms the gap at 8.2 and that 8.4/8.5 rows do not move.
  - id: P5.1
    section: "5.1"
    target: VOL-V 31.1
    change_type: replacement whose quoted old words span lettered list items (b) and (c), adding item (d)
    old: "(b) the treated effluent fails any parameter in Volume II Table 2-4, or (c) the Facility fails to deliver treated effluent to the delivery point at the required residual head."
    new: "(b) the treated effluent fails any parameter in Volume II Table 2-4, (c) the Facility fails to deliver treated effluent to the delivery point at the required residual head, or (d) the volume of treated effluent delivered to the delivery point on any day is less than ninety per cent (90%) of the volume of sewage received at the inlet works on that day."
    expected_result: "VOL-V 31.1 = 'An Unavailability Event occurs where (a) the Facility is unable to treat the flow delivered to it, (b) ... Table 2-4, (c) ... residual head, or (d) the volume of treated effluent delivered ... on that day.' Items (a)-(c) keep their letters; cross-references to 31.1(a)/(b)/(c) in 31.3 remain valid."
    note: The old words span a PDF line break ("(b) the treated / effluent fails"); match whitespace-normalised.
  - id: P5.2
    section: "5.2"
    target: VOL-V 31.3
    old: "No cure period applies to an event under Clause 31.1(b)."
    new: "No cure period applies to an event under Clause 31.1(b) or Clause 31.1(d)."
    expected_result: Second sentence of 31.3 replaced; first sentence (24 h for (a), 72 h for (c)) unchanged.

answers:
  - number: 15
    classification: decoy
    question: "Is the Network Operator owned or controlled by the Authority?"
    response: "No. The Network Operator is a separate company. Its ownership has no bearing on any requirement of the RFP Documents."
    expected: No register change.
  - number: 16
    classification: confirming
    question: "May ozonation be used as the disinfection process?"
    response: "Ozonation shall not be used as the sole means of disinfection. Disinfection shall be by chlorination with provision for dechlorination, or by ultraviolet irradiation with a validated dose, or by a combination. Volume II Clause 3.3 applies."
    expected: Confirms VOL-II 3.3 (SB08) in imperative words; no change. Must not create a new requirement or mark 3.3 as amended.
  - number: 17
    classification: changing
    question: "Volume V Clause 12.3 provides that the reasonable costs of the Independent Engineer are borne equally by the parties. Does this apply to the Independent Engineer's attendance at a repeated reliability run?"
    response: "No. The reasonable costs of the Independent Engineer attributable to any reliability run after the first shall be borne by the Project Company. Volume V Clause 12.3 is amended accordingly."
