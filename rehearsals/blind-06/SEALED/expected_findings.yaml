change_types:
  # categories an amendment engine built around replace / delete / insert / renumber / reissue / annotate may lack
  - {id: CT1, where: "3.1 (VOL-II 7.2)", type: tolerance band replacing a single minimum (90% -> 85%-110%)}
  - {id: CT2, where: "3.2", type: free-standing counting rule living only in the Addendum, interacting with an unchanged clause (7.3)}
  - {id: CT3, where: "4.1-4.2 (VOL-II 8.1 to 8.3)", type: range replacement whose replacement text omits the middle clause (8.2 silently deleted; no renumbering)}
  - {id: CT4, where: "5.1 (VOL-V 31.1)", type: replacement whose quoted old words span lettered items (b) and (c) and a line break; adds item (d) and moves the 'or'}
  - {id: CT5, where: "2.3-2.6", type: Bidder election per tie-in point with a deeming fallback instead of a sanction}
  - {id: CT6, where: "2.1-2.2, 2.7, Appendix A", type: incorporation by reference of a third-party Arabic image table whose values set a rejection threshold}
  - {id: CT7, where: "responses 17 and 19", type: amendment carried by a clarification answer (VOL-V 12.3 carve-out; VOL-II 7.4 timing)}
  - {id: CT8, where: "5.2 relies on 5.1; response 20 relies on 2.4; response 17 relies on 3.1", type: new provision relied on by a later provision of the same Addendum}
  - {id: CT9, where: "5.1 via VOL-V 1.6; 3.1 via VOL-V 1.5", type: defined term whose meaning changes without any change to its definition text}
  - {id: CT10, where: "ADD-04 2.1-2.2", type: amendment of an earlier Addendum's own text (two substitutions in one sentence sharing the phrase 'five (5) Working Days')}
  - {id: CT11, where: "ADD-04 3.1", type: reinstatement of a deleted clause in amended form}

