deliberate_ambiguities:
  - id: DA1
    where: ADD-03 3.1 + 3.2 with VOL-II 7.2 ('continuous reliability run of thirty (30) days') and 7.3 (restart only on a Table 2-4 failure, 'unchanged')
    question: What happens to the run on a day whose daily average flow is outside 85%-110% of nominal capacity?
    readings:
      - Pause/exclude - the day is ignored and the run continues; 30 qualifying days are needed, so the run is no longer 'continuous' in calendar terms.
      - Restart - 'continuous' means 30 consecutive qualifying days; an excluded day breaks continuity, so the count starts again (yet 3.2 says 'shall not count', not 'restart', and 7.3 restarts only for Table 2-4 failures).
      - Extend - the run continues and is extended by the number of excluded days (equivalent to pause in day count, different in what 'continuous' covers).
    correct_answer: none
    expected_handling: Escalate to a person / raise a clarification (still possible until Thursday 12 November 2026). Do not pick a reading. Note the knock-on to response 17 (who pays the IE for a 'run after the first') and to PCOD/LD exposure.
    resolved_by_add04: false

