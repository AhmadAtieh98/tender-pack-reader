  # ---------------------------------------------------------------- Section 12: award and close (post-award)
  - id: VOL-I-12.1-01
    group: "VOL-I:12.1"
    scope: [concession, post_award]
    requirement: "Concession period of 25 years from the Project Commercial Operation Date, then transfer of the Project to the Authority per Volume V"
    units: ["VOL-I:12.1"]
    discipline: Legal
    owner: Legal counsel
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be obtained at PCOD, the Independent Engineer''s certification that
        fixes PCOD (VOL-V 1.5), from which VOL-I 12.1 runs the 25-year concession period, and to be produced at the
        end of that period, the record of transfer of the Project to the Authority under Volume V (rows VOL-V-3.2-01
        and VOL-V-42.1-01).'
      basis:
      - unit: VOL-I:12.1
        page: 6
        words: The concession period shall be twenty-five (25) years commencing on the Project Commercial Operation
          Date, following which the Project shall transfer to the Authority in accordance with Volume V.
      - unit: VOL-I:2.3
        page: 2
        words: PCOD means the Project Commercial Operation Date, as defined in Volume V.
      - unit: VOL-V:1.5
        page: 2
        words: PCOD means the date on which the Independent Engineer certifies that the Facility has satisfied the requirements
          of Volume II Clause 7.2.
      when: at PCOD (start of the concession period on the VOL-I 12.1 reading) and at transfer at the end of the period
      bid_stage_note: 'Decide now (I-CONCESSION): VOL-V 3.1 runs the 25 years from the Effective Date instead, and ADD-02
        Q7 refers Bidders to the order of precedence at VOL-I 3.2 without amending either clause; the term start drives
        the Financial Model''s operating period and the transfer date, and Legal should decide whether to record the
        assumed start in Form 4-E, since a deviation not listed there is taken as accepted (VOL-V Note to Bidders).'
    date_rules:
      - {rule_id: CONCESSION-END-PCOD, kind: external, purpose: event, anchor: PCOD, offset: 25, unit: year, direction: after, source_unit: "VOL-I:12.1", text: "twenty-five (25) years commencing on the Project Commercial Operation Date"}
    interpretations:
      - stage: BASE
        quote: "The concession period shall be twenty-five (25) years commencing on the Project Commercial Operation Date, following which the Project shall transfer to the Authority in accordance with Volume V."
        parameters: {term_years: 25, start: "Project Commercial Operation Date"}
        note: "VOL-V 3.1 runs the term from the Effective Date instead; not resolved here (I-CONCESSION)."
      - stage: ADD-02
        quote: "The concession period shall be twenty-five (25) years commencing on the Project Commercial Operation Date, following which the Project shall transfer to the Authority in accordance with Volume V."
        parameters: {term_years: 25, start: "Project Commercial Operation Date"}
        # session 12 (F1; audit A1-1/A2-1/A3-1, PROPOSED wording): the session 11 wording (audit A1-3) said this clause
        # prevails; Q7 does not say which clause applies and no person has decided, so both readings are kept open
        note: "ADD-02 Q7 (p2) was asked 'Which applies?' and answers: 'The Authority notes the question. The order of precedence at Volume I Clause 3.2 applies. The Authority does not consider further amendment necessary at this stage.' It does not say which clause applies, and it amends neither. Two readings: this clause, 'twenty-five (25) years commencing on the Project Commercial Operation Date'; VOL-V 3.1 (p2), 'twenty-five (25) years from the Effective Date' (row VOL-V-3.1-01). VOL-I 3.2 (p2) orders the RFP Documents '(a) the Addenda, a later Addendum prevailing over an earlier one;' '(b) Volume I (Instructions to Bidders);' '(c) Volume V (Draft Project Agreement);' 'the first named prevailing'; VOL-I 3.3 (p2): 'A Bidder that resolves such a conflict unilaterally does so at its own risk'. Which clause governs the term, what to record in Form 4-E and which term start the Financial Model assumes are a decision for a person (Legal; I-CONCESSION, CQ-CONCESSION-TERM); no decision recorded."
    confidence: medium
    confidence_reason: "verbatim; conflicts with VOL-V 3.1 (from the Effective Date); ADD-02 Q7 refers to the order of precedence at VOL-I 3.2 without saying which clause applies; which clause governs is a decision for a person (Legal, I-CONCESSION); no decision recorded"
    issues: [I-CONCESSION]
