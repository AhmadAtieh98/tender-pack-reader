# A1 register rows for Volume I (Stage 3). PROPOSED: drafted by the register agent, session 05. No row has been
# reviewed or accepted by a person. Rows already held in curation/register/rows.yaml (VOL-I 5.2, 5.4, 6.1, 6.3, 6.4,
# 7.1, 8.3, 8.5 + footnote 12, 8.6, 9.3, 9.4, 11.2, 11.3, Table 1-1 B and D) are not repeated here; this file adds
# only the obligations they do not cover. Interpretations are added at an addendum stage only where that addendum
# addresses one of the row's units; any other change to a dependency leaves the row STALE for a person.
doc: VOL-I
prepared_by: "AI-assisted draft (register agent, session 05); not reviewed"
method: >-
  Every Volume I unit read in order (build/units.json); one row per independently testable obligation (D3), grouped
  by source clause. Quotes copied from the effective text at each stage (ADD-01, ADD-02 checked with tenderpack.amend);
  consequences quoted only from the unit that states them, never inferred. Ambiguities are recorded as issues for a
  person, not resolved. Dates are rules (tenderpack.dates); events not in the pack are external.
rows:
  # ---------------------------------------------------------------- Section 1: eligibility
  - id: VOL-I-1.4-01
    group: "VOL-I:1.4"
    scope: [eligibility, qualification]
    requirement: "Only a Bidder prequalified under RFQ NUPA/ISTP/2025/031 and named in Appendix 1 may submit a Proposal"
    units: ["VOL-I:1.4"]
    discipline: Bid management
    owner: Bid manager
    assessment: pass_fail
    no_deliverable: "an eligibility status (prequalified and named in Appendix 1), not a document; the Bidder submits in its prequalified name"
    interpretations:
      - stage: BASE
        quote: "Only Bidders prequalified under Request for Qualification NUPA/ISTP/2025/031 and named in Appendix 1 to this Volume are eligible to submit a Proposal."
        consequence: {class: rejection, unit: "VOL-I:1.4", quote: "A Proposal received from any other person shall be rejected without evaluation."}
        note: "Appendix 1 names five prequalified Bidders; which one is ours is a bidder fact."
    confidence: high
    confidence_reason: "verbatim; the Bidder's identity is an assumption, not a fact from the pack"
    issues: [I-BIDDER-FACTS]
  # ---------------------------------------------------------------- Section 3: documents and conflicts
  - id: VOL-I-3.3-01
    group: "VOL-I:3.3"
    scope: [clarification, conflicts]
    requirement: "Raise any conflict, ambiguity or discrepancy found in the RFP Documents as a clarification request under Section 5"
    units: ["VOL-I:3.3"]
    discipline: Bid management
    owner: Bid manager
    assessment: procedural
    evidence: [EV-CLARIFICATIONS]
    interpretations:
      - stage: BASE
        quote: "A Bidder that identifies a conflict, ambiguity or discrepancy shall raise it as a request for clarification under Section 5."
        consequence: {class: lesser, unit: "VOL-I:3.3", quote: "A Bidder that resolves such a conflict unilaterally does so at its own risk, and the Authority shall not be bound by the Bidder's interpretation."}
        note: "Conflicts found in the pack (Envelope B contents, Form 4-B contract value, concession term) fall under this clause; requests are subject to the VOL-I 5.2 cut-off."
    confidence: high
    confidence_reason: "verbatim; the consequence ('at its own risk') is stated in the same clause"
    issues: [I-VOL-I-ENV-B, I-VOL-I-ENV-A-PRICES, I-CONCESSION]
  - id: VOL-I-3.4-01
    group: "VOL-I:3.4"
    scope: [clarification, completeness, deadline]
    requirement: "Check the completeness of the RFP Documents downloaded from the Portal; omission claims are not entertained after the Proposal Due Date and time as amended (a cut-off separate from the VOL-I 5.2 clarification deadline)"
    units: ["VOL-I:3.4"]
    discipline: Bid management
    owner: Bid manager
    assessment: procedural
    evidence: [EV-CLARIFICATIONS]
    date_rules:
      - {rule_id: OMISSION-CLAIM-CUTOFF, kind: anchor, purpose: deadline, anchor: PDD, source_unit: "VOL-I:3.4", text: "No claim arising from an alleged omission shall be entertained after the Proposal Due Date."}
    interpretations:
      - stage: BASE
        quote: "Bidders shall satisfy themselves as to the completeness of the RFP Documents downloaded from the Portal."
        consequence: {class: lesser, unit: "VOL-I:3.4", quote: "No claim arising from an alleged omission shall be entertained after the Proposal Due Date."}
        note: "Volume III (Drawings) is listed in VOL-I 3.1 but not supplied; gaps are raised as clarification requests before the VOL-I 5.2 cut-off."
      - stage: ADD-01
        quote: Bidders shall satisfy themselves as to the completeness of the RFP Documents downloaded from the Portal.
        consequence:
          class: lesser
          unit: VOL-I:3.4
          quote: No claim arising from an alleged omission shall be entertained after the Proposal Due Date.
        parameters:
          omission_claim_cutoff: 'the amended Proposal Due Date and time: 26 November 2026, 14:00 Riyadh time (VOL-I 2.6;
            6.1 as amended by ADD-01 2.1)'
          separate_from: the VOL-I 5.2 clarification-request deadline (ten Working Days before the Proposal Due Date;
            row VOL-I-5.2-01; 12 November 2026 on the planning reading)
        note: 'As directed by the owner on 3 Oct 2026 (worklog/2026-10-03_session-08_prompt.md §3): the cut-off for omission
          claims follows the amended Proposal Due Date and time; no claim arising from an alleged omission is entertained
          after 26 November 2026, 14:00 Riyadh time (VOL-I 3.4 with 2.6; ADD-01 2.1). It is a separate cut-off from the
          earlier clarification-request deadline of VOL-I 5.2 (ten Working Days before the Proposal Due Date, adjusted
          under ADD-01 2.2; row VOL-I-5.2-01): VOL-I 3.4 does not refer to 5.2 and the two are not merged. Whether to
          raise a known gap as a clarification request is a separate decision (the clarification register). [Applied from
          proposal P-S08-VOL-I-3.4-01 by Claude Code (assistant), on Ahmad''s written instruction of 3 Oct 2026 (session
          08 §3) on 2026-10-03.]'
    confidence: medium
    confidence_reason: "verbatim; the cut-off moves with the PDD but this clause is not named in ADD-01 §2.2 (non-exhaustive list)"
    issues: [I-VOL-III]
