# A1 register rows for VOL-II (Technical Requirements). PROPOSED: drafted by the assistant; no row has been reviewed.
# Existing rows on VOL-II units stay in curation/register/rows.yaml (VOL-II-4.4-01, VOL-II-T2-4-TN) and are not repeated.
doc: VOL-II
prepared_by: "AI-assisted draft (register agent, session 05); not reviewed"
method: >-
  One row per independently testable obligation (D3), grouped by source clause. Volume II obligations are design and
  performance requirements assessed in the technical evaluation (VOL-I Table 1-1 criterion A, 'compliance with
  Volume II'): assessment scored, evidence the Technical Proposal; they also bind the Project Company after award.
  Table rows that are obligations (Table 2-4 limits, Table 2-6 criteria) have a row each; a row that refers to every
  parameter of such a table refers to it by note. Table rows that are design data, not obligations (Table 2-2
  influent), are listed as secondary units of the rows that use them, and a row that selects particular table rows
  by a reference (2.5: 'continuous basis'; 5.2: 'peak hourly flow') lists those rows, so that a change to them makes
  the row stale. Quotes are verbatim from the effective text; interpretations at an addendum stage only where that
  addendum addresses one of the row's units. Events outside the pack (PCOD, commissioning, construction start, end of
  the concession) are external date rules.
rows:
