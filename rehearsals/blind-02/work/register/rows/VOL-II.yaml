    group: VOL-II:1.1
    scope: [scope_of_works, concession]
    requirement: "Design, finance, construct, commission, own, operate and maintain the Facility; transfer it at concession end in the Volume V condition"
    units: ["VOL-II:1.1"]
    discipline: Technical
    owner: Technical lead
    assessment: scored
    evidence: [EV-TECH-PROPOSAL]
    interpretations:
      - stage: BASE
        quote: "The Project Company shall design, finance, construct, commission, own, operate and maintain the Wadi Sirhan Independent Sewage Treatment Plant"
        note: "Transfer 'at the end of the concession period in the condition required by Volume V' (VOL-V 3.2 and 42.1). Binds the Project Company after award."
    confidence: high
    confidence_reason: "verbatim text-layer clause; when the concession period ends depends on the term start (I-CONCESSION)"
    issues: [I-CONCESSION]
  - id: VOL-II-1.2-01
