  # ---------------------------------------------------------------- Section 3: process requirements
  - id: VOL-II-3.1-01
    group: VOL-II:3.1
    scope: [technical_design, process]
    requirement: "Treatment process able to achieve the Table 2-4 effluent quality under all Table 2-2 design influent conditions"
    units: ["VOL-II:3.1", "VOL-II:H:S3", "VOL-II:T2-2/bod5", "VOL-II:T2-2/cod", "VOL-II:T2-2/total-suspended-solids", "VOL-II:T2-2/total-nitrogen", "VOL-II:T2-2/total-phosphorus", "VOL-II:T2-2/temperature"]
    discipline: Technical
    owner: Process engineer
    assessment: scored
    evidence: [EV-TECH-PROPOSAL]
    interpretations:
      - stage: BASE
        quote: "The treatment process shall be capable of achieving the effluent quality in Table 2-4 under all design influent conditions in Table 2-2."
        note: "The Authority does not mandate a particular process train (second sentence). Limits: rows VOL-II-T2-4-*. The Section 3 heading is a unit because ADD-02 5.2 attaches to it."
      - stage: ADD-01
        quote: "The treatment process shall be capable of achieving the effluent quality in Table 2-4 under all design influent conditions in Table 2-2."
        note: "ADD-01 Q1: no process train is mandated (a membrane bioreactor is not required); any process capable of meeting Table 2-4 under the Table 2-2 influent conditions is acceptable."
      - stage: ADD-02
        quote: "The treatment process shall be capable of achieving the effluent quality in Table 2-4 under all design influent conditions in Table 2-2."
        note: "ADD-02 5.2: Bidders shall reflect the amended TN limit (ADD-02 5.1: 3 mg/l, row VOL-II-T2-4-TN) in the process design submitted under Volume II Section 3."
      - stage: ADD-03
        quote: The treatment process shall be capable of achieving the effluent quality in Table 2-4 under all design
          influent conditions in Table 2-2.
        note: Table 2-2 is replaced by Table 2-2 (revised) (ADD-03 6.1); ADD-03 6.2 requires the process design to reflect
          it (row ADD-03-6.2-01); note (2) fixes 12 °C for the nitrification design; note (3) requires a process simulation
          report at the revised Peak (design) values and minimum temperature (row ADD-03-T22n3-01).
    confidence: medium
