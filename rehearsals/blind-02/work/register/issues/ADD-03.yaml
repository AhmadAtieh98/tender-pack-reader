# Issues raised curating ADD-03 of blind rehearsal 02 (synthetic; PROPOSED; the assistant as curator, session 08).
issues:
  I-ADD03-F4A-PARA2:
    theme: forms
    owner: Bid manager
    show_in_a3: true
    short: ADD-03 3.3 amends paragraph 2 of Form 4-A, which the form in use does not have
    a3: 'ADD-03 3.3: ''Paragraph 2 of Form 4-A shall be read accordingly'' (180 days), but the Form 4-A in use (ADD-01 App A) has no paragraph 2'
    text: ADD-03 3.3 says paragraph 2 of Form 4-A (the 150-day validity statement of the form as issued) is read accordingly, i.e. 180 days. The form reissued
      by ADD-01 App A ('Bidders shall use this version') has no numbered paragraphs and no validity statement. Whether the bidder adds the statement, uses
      the original paragraph 2 or relies on VOL-I 7.1 alone is not stated.
  I-ADD03-F4A-TIME:
    theme: forms
    owner: Bid manager
    show_in_a3: true
    short: Form 4-A prints 12 November 2026, 14:00; the PDD is 26 November 2026, 11:00
    a3: 'The reissued Form 4-A prints ''Proposal Due Date: 12 November 2026, 14:00 Riyadh time''; after ADD-03 the PDD is 26 November 2026, 11:00'
    text: 'ADD-01 App A prints ''Proposal Due Date: 12 November 2026, 14:00 Riyadh time''. ADD-01 2.1 moved the date to 26 November 2026 and ADD-03 2.1
      moved the time to 11:00. Neither addendum corrects the form. Whether the bidder corrects the printed entry is for a person.'
  I-ADD03-Q15:
    theme: contract
    owner: Commercial lead
    show_in_a3: true
    short: 'Bid Bond issuer narrowed in an answer: incorporated in the Kingdom (VOL-I 6.4 says licensed)'
    a3: 'ADD-03 Q15: Bid Bond only from a bank incorporated in the Kingdom; a foreign bank''s branch, confirmed or not, ''will not be accepted'' (VOL-I
      6.4 still says ''licensed to operate'')'
    text: ADD-03 Q15 withdraws ADD-01 Q3 and requires a bank incorporated in the Kingdom meeting the VOL-I 6.4 rating; a bond from a branch of a foreign
      bank, whether or not confirmed, will not be accepted. VOL-I 6.4's words ('a bank licensed to operate in the Kingdom') are not amended; the narrower
      answer is followed for planning. A bond already arranged with a foreign bank's branch must be replaced.
  I-ADD03-Q16:
    theme: forms
    owner: Legal counsel
    show_in_a3: true
    short: 'Powers of Attorney executed abroad: legalise or apostille; ADD-03 cites the list by its new letter'
    a3: 'ADD-03 Q16: a Power of Attorney executed abroad must also be legalised or apostilled, or it ''will be treated as not submitted'''
    text: 'ADD-03 Q16 adds legalisation (embassy or consulate of the Kingdom) or an apostille for every Power of Attorney executed outside the Kingdom.
      It calls the Powers of Attorney ''item (i) of Volume I Clause 9.1 as re-lettered'': read as issued, item (i) is the Section 8 certificates; the curated
      op maps it to the Powers of Attorney item issued as (h).'
  I-ADD03-Q20:
    theme: envelopes
    owner: Bid manager
    show_in_a3: true
    short: Second USB in Envelope B and passwords within 1 hour after the PDD, set in an answer
    a3: 'ADD-03 Q20: Financial Model on a second encrypted USB in Envelope B; Envelope A USB holds Envelope A only; passwords via the Portal within 1 hour
      after the PDD'
    text: 'ADD-03 Q20 answers how the Financial Model is submitted: on a second, separate encrypted USB media in Envelope B; the VOL-I 6.5 electronic copy
      holds Envelope A only; each USB''s password is submitted through the Portal within one hour after the Proposal Due Date. VOL-I 6.5 is not amended.
      No consequence is stated for a late password; commercial information on the Envelope A media falls under VOL-I 6.2.'
  I-ADD03-NOTE4:
    theme: technical
    owner: Technical lead
    show_in_a3: false
    short: ADD-03 amends VOL-II 2.3 and adds a required report inside notes to Table 2-2 (revised)
    a3: ADD-03 changes VOL-II 2.3 (expansion 50% -> 25%) and adds the simulation report in notes to the reissued Table 2-2
    text: Notes (3) and (4) to Table 2-2 (revised) add a required process simulation report and amend VOL-II 2.3 (future expansion 50% -> 25% of nominal
      capacity). The cover summary of ADD-03 does not mention either change; both are applied from the notes' own words.
