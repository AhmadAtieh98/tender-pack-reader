  - {id: seal-and-mark, name: "Seal Envelopes A and B separately and mark each 'NUPA/ISTP/2026/014 — NOT TO BE OPENED BEFORE 11:00 ON THE PROPOSAL DUE DATE' (VOL-I 6.2, Appendix 3 as replaced by ADD-03 2.3)", owner: Bid management, discipline: Document control, resource: document_controller, issuer: Bidder, duration: seal_and_mark, predecessors: [copies], item: "Envelopes A and B, sealed and marked per Appendix 3"}
  - &copies {id: copies, name: "Make three hard copies of each envelope and the searchable electronic copy of Envelope A only on encrypted USB (ADD-03 Q20), files named ISTP2026-014_[BIDDER]_[ENV]_[VOL]_[NN]_[YYYYMMDD].pdf (max 120 characters, folders max 3 levels); check the electronic copy against the marked original (VOL-I 6.5, Appendix 2); the USB split between the envelopes follows the decision on I-VOL-I-COPIES", owner: Bid management, discipline: Document control, resource: document_controller, issuer: Bidder, duration: copies_and_usb, predecessors: [assemble-envelope-a, assemble-envelope-b], item: "3 hard copies per envelope and the encrypted USB copy (Appendix 2 naming)", gated_by: [I-VOL-I-COPIES]}
  - {id: assemble-envelope-a, name: "Assemble the marked original of Envelope A in the VOL-I 9.1 order as re-lettered by ADD-03 7.1 ((a) to (j); Form 4-G is (f)), with numbered dividers following the re-lettered list; check that no price or commercial information appears (VOL-I 6.2)", owner: Bid management, discipline: Document control, resource: document_controller, issuer: Bidder, duration: envelope_assembly, predecessors: []}
  - {id: assemble-envelope-b, name: "Assemble the marked original of Envelope B: Form 4-F and the Financial Model on a second, separate encrypted USB (VOL-I 10.1; ADD-03 Q20); no model auditor's opinion (ADD-03 4.1); package the financing-assumptions schedule as the decision on I-VOL-I-ENV-B directs (it is prepared regardless)", owner: Bid management, discipline: Document control, resource: document_controller, issuer: Bidder, duration: envelope_assembly, predecessors: [], gated_by: [I-VOL-I-ENV-B]}
  - {id: register-reps, name: "Register through the Portal the names and identity document numbers of up to two representatives who will deliver the Proposal (VOL-I 6.8 as inserted by ADD-03 2.4; access is refused to anyone not registered)", owner: Bid management, discipline: Bid management, resource: bid_manager, issuer: Bidder, duration: delivery_registration, predecessors: [], finish: {deadline_of: DELIVERY-REGISTRATION}}
