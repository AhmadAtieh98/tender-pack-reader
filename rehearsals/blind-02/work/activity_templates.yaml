# Evidence item -> activities. PROPOSED (session 04, extended in Stage 4 and session 08); not reviewed.
# Each activity names: an owner, a `discipline` (Legal, Commercial, Technical, Bid management, Document control), a
# `resource` role (config/assumptions.yaml resources:), the issuer of what it produces, a lead-time ASSUMPTION key
# (config/assumptions.yaml lead_times: elapsed value, staff effort, external party waited on), predecessors and/or
# successors, and optionally `per` (multiplied by the bidder settings: member, foreign_member, signatory = members x
# signatories_per_member, reference, epc_contractor, om_operator) and `item` (a physical or documentary item for the
# marshalling plan). Requirement ids are attached at build time from the A1 rows that need each evidence item;
# nothing here names a requirement. `finish: deadline_of: <rule_id>` makes a pack date a must-finish-by constraint.
# A duration of 0 Working Days means "done at the end of the day before its successor starts" (occupies no
# separate Working Day).
# `gated_by: [issue ids]` (FINALISATION steps only, never preparation): the activity cannot be finalised until a
# person decides the open issue (curation/register issues). Its preparation predecessors continue; the decision is
# needed by the gated activity's latest start. A person lifts a gate by removing it here once the issue is decided.
# `condition:` the activity is needed only if the condition arises; when its window has elapsed at the planning
# date it is reported as CONDITIONAL (whether the condition arose is not known), never as a missed duty.
# An activity listed under two evidence items (a YAML alias, e.g. `copies`) is one activity needed by both.
# `_exceptions: {EV-ID: reason}` lists evidence items that need no activity (C44), each with its reason.
#
# Envelope chain (both envelopes): every Envelope A document -> assemble-envelope-a; every Envelope B document
# -> assemble-envelope-b; both -> copies (3 hard copies + encrypted USB, Appendix 2 naming) -> seal-and-mark
# (Appendix 3 marking) -> deliver (PDD, 14:00). Signatures follow the Powers of Attorney.

_exceptions: {}

# Document counts the evidence vocabulary cannot express (the count used for the document, marshalling and copy
# totals). None is needed now: since session 08 the vocabulary itself says per foreign_member (EV-INVESTMENT-LICENCE).
_per_overrides: {}

# Dated pack milestones on the programme and the Gantt. The DATES come from the A1 rows' date rules at each stage
# (never typed here); this only names them. `derived` milestones have no date rule in the register: their date is
# computed from a rule as the pack's words say, and labelled as derived.
_milestones:
  labels:
    PRE-BID: {short: "Pre-Bid Conference 10:00", time: "10:00", label: "Pre-Bid Conference, 10:00 Riyadh time (VOL-I 5.4: attendance mandatory; whether the Bidder attended is NOT assumed)"}
    CLARIFICATION-CUTOFF: {short: "Clarification cut-off", label: "Clarification cut-off: requests no later than ten Working Days before the PDD (VOL-I 5.2, as adjusted by ADD-01 2.2)"}
    PDD: {short: "PDD 14:00", time: "14:00", label: "Proposal Due Date, 14:00 Riyadh time (VOL-I 6.1 as amended by ADD-01 2.1; late Proposals rejected unopened, VOL-I 6.6)"}
    ATTENDANCE-NOTICE: {short: "Attendance-notice window ends (conditional)", conditional: true, label: "End of the window to notify an incorrectly recorded attendance (ADD-01 3.1; only if the Bidder considers its attendance incorrectly recorded)"}
    BID-BOND-VALIDITY: {short: "Bid bond validity end", label: "Bid Bond validity end: 180 days from the PDD (VOL-I 6.3; extended on demand if the Authority extends Proposal validity)"}
    PROPOSAL-VALIDITY: {short: "Proposal validity end", label: "Proposal validity end: 150 days from the PDD (VOL-I 7.1)"}
    ISO-CURRENT-AT: {short: "ISO current as at", label: "EPC Contractor's ISO 9001:2015 certificate must be current as at the PDD (VOL-I 8.3)"}
    REFERENCE-LOOKBACK: {short: "Reference look-back start", label: "Start of the ten-year look-back for reference plants' commercial operation (VOL-I 8.5 footnote 12)"}
    MODIFY-CUTOFF: {short: "Withdraw/modify cut-off", label: "Last moment to withdraw or modify the Proposal through the Portal (VOL-I 6.7)"}
    OMISSION-CLAIM-CUTOFF: {short: "Omission claims cut-off", label: "No claim for an alleged omission after the PDD (VOL-I 3.4)"}
    BLACKOUT-START: {short: "Blackout start", label: "Start of the communications blackout (VOL-I 4.2)"}
  derived:
    SITE-VISIT: {from: PRE-BID, calendar_days_after: 1, short: "Site visit (optional)", source: "VOL-I:5.5; ADD-01:AppB/item-6-site-visit", label: "Site visit offered 'on the day following the Pre-Bid Conference' (VOL-I 5.5; the ADD-01 minutes, item 6: confirmed for the following day, attendance optional); derived date, no date rule in the register"}

