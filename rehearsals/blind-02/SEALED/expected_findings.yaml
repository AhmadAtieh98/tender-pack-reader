    packaging:
      - "Delivery location changes: Tender Box 2, First Floor, Administrative Building A (was Box 4, Ground Floor, Building C)."
      - "Envelope marking text changes: '...NOT TO BE OPENED BEFORE 11:00 ON THE PROPOSAL DUE DATE' (was 14:00)."
    cover: "Mentioned ('the submission address')."

  - id: "2.4"
    page: 1
    kind: insert
    target: "VOL-I new Clause 6.8 (after 6.7; no renumbering)"
    new_text: >-
      6.8 Each Bidder shall, not later than five (5) Working Days before the Proposal Due Date, register
      through the Portal the names and identity document numbers of not more than two (2) representatives
      who will deliver its Proposal. Access to Administrative Building A will be refused to any person who
