    note: "Request 18 withdrawn by the submitting Bidder; not answered (consistent with the Q&A row 18)."

  - id: "2.1"
    page: 1
    kind: amend_text
    target: "VOL-I Clause 6.1 (as amended by ADD-01 2.1)"
    old: "14:00 hours Riyadh time"
    new: "11:00 hours Riyadh time"
    unchanged: "date Thursday 26 November 2026"
    final_text: >-
      Proposals shall be received by the Authority not later than 11:00 hours Riyadh time on Thursday
      26 November 2026 at the address given in Appendix 3.
    dates:
      proposal_due_date: {old: "2026-11-26 14:00", new: "2026-11-26 11:00"}
    consequences_now_bound_to_new_time:
      - "VOL-I 6.6: a Proposal received after the time stated in Clause 6.1 'will be rejected unopened and returned to the Bidder' - now after 11:00."
      - "VOL-I 6.7: withdrawal/modification before the PDD - now before 11:00."
    knock_on:
      - "VOL-I 2.6 (definition of PDD) - PDD time changes."
      - "Appendix 3 marking (replaced by 2.3 with 11:00)."
      - "Q20 password window ends 12:00 (one hour after 11:00)."
      - "Form 4-A 'Proposal Due Date' pre-filled entry (VOL-IV and ADD-01 Appendix A) still reads '12 November 2026, 14:00 Riyadh time'; no addendum has corrected it; it is now wrong on both date and time. Expected: flag as unresolved / stale form entry; correct value 26 November 2026, 11:00."
      - "Date-based periods counted from the PDD (5.2 cut-off, 6.3, 7.1, footnote 12) keep their dates; only the time-of-day reading may differ (see ambiguities)."
    a3: "Late-submission rejection (6.6) now bites at 11:00; the A5 drop-dead for physical delivery moves three hours earlier."
    cover: "Mentioned ('amends the time for receipt'), but contradicted by E1."

  - id: "2.2"
    page: 1
    kind: delete
    target: "ADD-01 Section 2.1, second sentence ('The time of 14:00 Riyadh time is unchanged.')"
