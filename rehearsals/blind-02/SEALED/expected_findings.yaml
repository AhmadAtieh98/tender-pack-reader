      - "A Proposal that is not received by the time stated in Clause 6.1 for that reason shall be treated as a late Proposal under Clause 6.6."
    consequence_resolved: "VOL-I 6.6: rejected unopened and returned to the Bidder."
    dates:
      registration_deadline: "2026-11-19 (Thursday) - 5 Working Days before Thu 26 Nov 2026 (25,24,23,22 Nov, then 19 Nov)"
    a3: "Yes - add (pass/fail via late-Proposal rejection)."
    a5: "New milestone: delivery-team registration by Thu 19 Nov 2026; feeds the physical delivery activity."
    cover: "Mentioned ('introduces registration of the persons delivering Proposals')."

  - id: "3.1"
