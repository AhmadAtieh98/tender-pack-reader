      Tender Box 4, Ground Floor, Northern Utilities Procurement Authority, Administrative Building C,
      Sakaka. Marked: 'NUPA/ISTP/2026/014 - NOT TO BE OPENED BEFORE 14:00 ON THE PROPOSAL DUE DATE'.
