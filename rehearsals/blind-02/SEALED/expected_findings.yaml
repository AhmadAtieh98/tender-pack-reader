    new: "40 dB(A) by night"
    unchanged: "55 dB(A) by day"
    final_text: "Noise at the nearest sensitive receptor shall not exceed 55 dB(A) by day and 40 dB(A) by night."
    cover: "Mentioned."

  - id: "5.2"
    page: 2
    kind: reinstate
    target: "VOL-II Clause 4.4 (standby power autonomy) via revocation of ADD-02 Section 4.1"
    chain: "Original 72 h -> ADD-02 4.1: 96 h -> ADD-03 5.2: ADD-02 4.1 revoked, 72 h reinstated"
