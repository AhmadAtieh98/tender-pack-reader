# Answer key for blind rehearsal 02: Addendum No. 3 to tender NUPA/ISTP/2026/014.
# SEALED. Do not show to the engineer running the tool until the run is complete.
#
# Conventions
#   kind vocabulary: amend_text | set_table_value | delete | reinstate | replace_table_or_form |
#                    insert | answer_with_effect | answer_without_effect | renumber | recital
#   Dates are Riyadh time. Working Day (VOL-I 2.4) = Sunday to Thursday, the stated date not counted
#   when counting backwards; no public holiday falls in the windows used below.
#   "Day N from the Proposal Due Date" is computed as PDD date + N calendar days.

meta:
  input_pdf: rehearsals/blind-02/input/ADD-03_Addendum_No_3.pdf
  pages: 4
  addendum_number: 3
  issue_date: 2026-11-03          # printed "Issued 3 November 2026" (a Tuesday)
  tender: NUPA/ISTP/2026/014
  header_left: "Addendum No. 3"
  precedence: "Prevails over Addenda Nos. 1 and 2 and over Volumes I to V (VOL-I 3.2(a), restated at ADD-03 1.1)."
  page_map:
    1: [cover, "1.1-1.2", "2.1-2.4 (incl. quoted new 6.8)", "3.1-3.3", "4.1", "4.2 (lead-in only)"]
    2: ["quoted new 12.5", "4.3", "5.1-5.3", "6.1-6.2", "7.1-7.2", "Q&A 15-19"]
    3: ["Q&A 20-21 (table header repeated)"]
    4: ["Appendix A: Table 2-2 (revised) and Notes (1)-(4)"]
  state_before_this_addendum:
    proposal_due_date: "Thursday 26 November 2026, 14:00 Riyadh time (VOL-I 6.1 as amended by ADD-01 2.1)"
    submission_address: "Tender Box 4, Ground Floor, NUPA, Administrative Building C, Sakaka (VOL-I App. 3)"
    proposal_validity_days: 150
    bid_bond_validity_days: 180
    bid_bond_issuer: "bank licensed to operate in the Kingdom, A- or better; per ADD-01 Q3 a licensed branch of a foreign bank is acceptable"
    vol2_4_4_standby_hours: 96          # ADD-02 4.1
    page_limit_pages: 150               # ADD-02 2.1

# ---------------------------------------------------------------------------
# Cover summary paragraph (page 1) - planted errors
# ---------------------------------------------------------------------------
cover_summary:
  text: >-
    This Addendum amends the time for receipt of Proposals and the submission address, introduces
    registration of the persons delivering Proposals, extends the Proposal validity period, removes the
    model audit opinion from the Proposal, re-letters Volume I Clause 9.1, amends Volume II Clauses 3.5,
    4.4 and 8.4, reissues Volume II Table 2-2, and responds to clarification requests 15 to 21. The
    Proposal Due Date is unchanged.
  planted_errors:
    - id: E1
      type: contradiction_misleading
      cover_says: "The Proposal Due Date is unchanged."
      truth: >-
        VOL-I 2.6 defines the Proposal Due Date as the date AND time stated in Clause 6.1. Section 2.1
        moves the time from 14:00 to 11:00 on the same date. The Proposal Due Date becomes Thursday
        26 November 2026, 11:00 Riyadh time (three hours earlier). Only the calendar date is unchanged.
      expected_reader_behaviour: "Report the PDD as changed (time), flag the cover statement as inaccurate."
    - id: E2
      type: omission
      cover_says: "extends the Proposal validity period"
      truth: >-
        Section 3.2 also extends the Bid Bond validity in VOL-I 6.3 from 180 to 210 days. Not mentioned
        on the cover, and the Section 3 heading ("PROPOSAL VALIDITY") does not mention it either.
      expected_reader_behaviour: "Detect the 6.3 amendment from the body; list it as a cover omission."
  secondary_undisclosed_effects:   # not planted as cover "errors", but the cover does not itemise them
    - "Note (4) to Table 2-2 (revised) amends VOL-II Clause 2.3 (expansion provision 50% -> 25%)."
    - "Note (3) to Table 2-2 (revised) creates a new Technical Proposal deliverable (process simulation report) with a scoring consequence."
    - "Total Phosphorus peak (design) value changes 14 -> 16 in the reissued table (not mentioned on the cover NOR in the narrative at 6.1)."
    - "New VOL-I Clause 12.5 (post-award model audit opinion) and deletion of two Form 4-F rows (4.2, 4.3) - only partly signalled by 'removes the model audit opinion from the Proposal'."
    - "VOL-II 4.4 change is a revocation of ADD-02 4.1 (reinstatement of 72 hours), described on the cover as 'amends'."
    - "Index of Forms entry for Form 4-G (7.2)."
    - "Clarification responses with binding effect: Q15 (withdraws ADD-01 Q3; Bid Bond issuer), Q16 (legalisation of Powers of Attorney), Q20 (second USB in Envelope B; password deadline)."
  accurate_parts: "Every other item on the cover corresponds to a body provision."

standard_paragraph:
  text: "Bidders shall acknowledge receipt in Form 4-A."
  effect: "Form 4-A paragraph 1 must now acknowledge Addenda Nos. 1 to 3 (existing obligation, no new consequence)."

