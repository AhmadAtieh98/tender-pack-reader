# ---------------------------------------------------------------------------
# Clarification responses (Section 8, pages 2-3)
# ---------------------------------------------------------------------------
clarifications:

  - no: 15
    page: 2
    kind: answer_with_effect
    withdraws: "ADD-01 response to clarification request 3"
    target: "VOL-I Clause 6.4 (Bid Bond issuer)"
    effect: >-
      Issuer must be a bank INCORPORATED in the Kingdom meeting the A- rating requirement. A Bid Bond issued
      by a branch of a foreign bank is not accepted, whether or not confirmed (reverses ADD-01 Q3, which
      allowed a licensed branch).
    stated_consequence: "A Bid Bond issued by a branch of a foreign bank, whether or not confirmed, will not be accepted."
    a3: "Yes - Bid Bond is required with Envelope A (6.3); an unaccepted bond leaves Envelope A without one. The final step to rejection is inferential (not stated) - medium confidence."
    a2: "ADD-01 Q3 answer must be marked withdrawn/now wrong."

  - no: 16
    page: 2
    kind: answer_with_effect
    target: "VOL-I Clause 9.1(i) as re-lettered (notarised Powers of Attorney); linked to 9.3"
    new_obligation: >-
      A Power of Attorney executed outside the Kingdom must, in addition to notarisation, be legalised by an
      embassy or consulate of the Kingdom in the country of execution, or apostilled where that country is
      a party to the Apostille Convention.
    stated_consequence: "A Power of Attorney that does not comply will be treated as not submitted."
    chain: "9.3: Form 4-A must be signed by a holder of a notarised Power of Attorney; an improperly executed Form 4-A renders the Proposal non-responsive."
    trap: "The cross-reference '(i) ... as re-lettered by Section 7' = Powers of Attorney. Without applying 7.1, item (i) would wrongly resolve to 'certificates and evidence under Section 8'."
    a3: "Yes (stated consequence; non-responsiveness via 9.3 is inferential)."
    a5: "Long-lead item: legalisation/apostille of each foreign-executed Power of Attorney before the PDD."

  - no: 17
    page: 2
    kind: answer_without_effect
    confirms: "ADD-02 response to clarification request 10"
    effect: "None. No guarantee or security from the O&M Operator; VOL-I 8.7 (EPC parent only) unchanged."
    trap: "Must NOT be read as withdrawing ADD-02 Q10 or as adding an O&M PCG obligation."

  - no: 18
    page: 2
    kind: answer_without_effect
    effect: "None. Request withdrawn (see 1.2)."

  - no: 19
    page: 2
    kind: answer_without_effect
    target: "VOL-I 12.1 vs VOL-V 3.1 (concession term commencement; ADD-02 Q7)"
    effect: >-
      None. Statement of intent only ('intends to address ... in the execution version'); expressly no
      amendment. The conflict remains open and is a matter for a human (commercial/legal); a Bidder may
      propose wording in Form 4-E.
    trap: "Must NOT be treated as conforming VOL-V 3.1 to PCOD or as resolving the conflict."

  - no: 20
    page: 3
    kind: answer_with_effect
    target: "VOL-I Clauses 6.5 and 10.1 (electronic copies / Envelope B)"
    effects:
      - "Financial Model on a second, separate encrypted USB media placed in Envelope B."
      - "The 6.5 electronic copy (USB) contains Envelope A only."
      - "Password for EACH USB media submitted through the Portal within one (1) hour after the PDD."
    packaging_quantities:
      marked_original: "1 (unchanged)"
      hard_copies: "3 (unchanged)"
      encrypted_usb_media: {old: 1, new: 2, detail: "one with the Envelope A electronic copy; one with the Financial Model in Envelope B"}
    dates:
      usb_passwords_via_portal: "Thursday 26 November 2026, after 11:00 and not later than 12:00 Riyadh time (relies on 2.1; a reader that kept 14:00 would wrongly say 15:00)"
    stated_consequence: "Commercial information on the Envelope A media will be treated in accordance with Volume I Clause 6.2."
    consequence_resolved: "VOL-I 6.2: commercial information within Envelope A renders the Proposal non-responsive."
    a3: "Yes (via 6.2, existing rule applied to the new media split)."
    a5: "New post-deadline action (password upload) and an extra encrypted USB."

  - no: 21
    page: 3
    kind: answer_without_effect
    effect: "None in itself: the date is not extended. Points to Section 2 (time moved to 11:00)."
    trap: "Reinforces E1; must not be read as 'the Proposal Due Date including time is unchanged'."

# ---------------------------------------------------------------------------
# Appendix A notes (page 4) - provisions hidden outside numbered clauses
# ---------------------------------------------------------------------------
appendix_a_notes:

  - id: "Note (1)"
    kind: insert
    target: "Table 2-2 (revised)"
    effect: "Definitional: flow-weighted 24-hour composite values at the inlet works; peak (design) = 95th percentile. No obligation."

  - id: "Note (2)"
    kind: insert
    target: "VOL-II Section 3 / nitrification design"
    new_obligation: "Use the minimum temperature of 12 degC for the design of the nitrification stage."
    stated_consequence: null

  - id: "Note (3)"
    kind: insert
    target: "Technical Proposal (VOL-I 9.1(g) as re-lettered); VOL-I 9.2 page limit; Table 1-1 (revised) criterion A"
    new_obligation: >-
      Submit, as an appendix to the Technical Proposal, a process simulation report demonstrating Table 2-4
      (as amended; TN 3 mg/l per ADD-02) under the Table 2-2 (revised) peak (design) values at the minimum
      design temperature; not more than 25 pages; excluded from the 150-page limit in VOL-I 9.2.
    stated_consequence: "A Technical Proposal that does not include the report will be awarded no marks under criterion A of Table 1-1 (revised)."
    consequence_resolved: >-
      Criterion A carries 25 of 100 marks (ADD-02 Table 1-1 (revised)); the technical threshold is 70
      (VOL-I 11.3, unchanged). Omission caps the technical score at 75 - a scored consequence, not stated
      as disqualifying. Expected: register as scored with a severe-risk flag; A3 should either exclude it or
      list it separately as a de facto threshold risk (calibration test), not as a stated disqualification.
    packaging: "New deliverable in Envelope A (Technical Proposal appendix)."
    cover: "Not mentioned (secondary)."

  - id: "Note (4)"
    kind: amend_text
    target: "VOL-II Clause 2.3 (future expansion provision)"
    old: "50% of nominal capacity"
    new: "25% of nominal capacity"
    final_text: >-
      The Facility shall be designed to accommodate a future expansion of 25% of nominal capacity without
      demolition of permanent structures. Space provision only is required; no expansion works form part of
      the Works.
    trap: "A clause amendment placed in a table note; not on the cover and not in the 6.1 narrative."

