    old: "We confirm that this Proposal is valid for one hundred and fifty (150) days from the Proposal Due Date."
    new: "...valid for one hundred and eighty (180) days from the Proposal Due Date. (implied by 'shall be read accordingly')"
    trap: "The new value is not written in the provision; it must be derived from 3.1. Note the asymmetry: Form 4-A paragraph 2 is addressed, the Form 4-A PDD entry is not."

  - id: "4.1"
    page: 1
    kind: delete
