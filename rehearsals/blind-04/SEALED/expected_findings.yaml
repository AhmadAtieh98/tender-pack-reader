indirect_effects:
  - id: IE1
    trigger: ADD-03 5.1 (VOL-II 5.2 velocity 2.0 -> 1.5 m/s)
    chain:
      - "Table 2-6 row 2-6.2 peak 7,500 m3/h = 2.083 m3/s (unchanged)"
      - "required bore = sqrt(4Q / (pi v)) = 1.330 m at 1.5 m/s (was 1.152 m)"
      - "DN1200 gives 1.842 m/s > 1.5 -> VOL-II 5.3 minimum DN1200 silently insufficient -> DN1400"
      - "Q18: applies at the 3 road + 1 wadi trenchless crossings (VOL-II 5.4) -> larger bores; ductile iron only there (ADD-03 5.2)"
      - "VOL-II 4.5 surge analysis redone"
      - "EPC up (ADD-03 2.1) -> 18.1 daily LD up, 18.4 cap up, 8.4(a) TNW threshold up"
    rows_affected_not_citing_5_2: [VOL-II 5.3, VOL-II 5.4, VOL-II 4.5, VOL-IV Form 4-F EPC row, VOL-V 18.1, VOL-V 18.4, VOL-I 8.4(a)]
  - id: IE2
