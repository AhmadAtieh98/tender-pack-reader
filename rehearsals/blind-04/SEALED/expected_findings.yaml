provisions:
  - id: ADD-03 1.1
    type: recital
    expected: no register change; ADD-03 prevails over ADD-01 and ADD-02 (VOL-I 3.2(a)).
  - id: ADD-03 1.2
    type: interpretation
    expected: references are to the pack as amended by ADD-01/02.

  - id: ADD-03 2.1
    type: definition change used in several volumes
    target: VOL-V 1.3 (Estimated Project Cost)
    old: "as set out in the agreed Financial Model at Financial Close"
    new: "as stated by the Bidder in Form 4-F, excluding financing costs, interest during construction and development fees"
    final_text: "Estimated Project Cost means the aggregate capital cost of the Facility as stated by the Bidder in Form 4-F, excluding financing costs, interest during construction and development fees."
    uses_not_citing_1_3: ["VOL-IV Form 4-F row 'Estimated Project Cost (SAR)' (p9)", VOL-V 18.4, VOL-V 18.1 as amended (ADD-03 4.1), VOL-I 8.4(a) as amended (ADD-03 3.1), ADD-03 7.2(c), Q16, Q19]
    consequence: none stated; it changes what the Form 4-F figure must contain and makes it the contractual basis of 18.1/18.4 and of the 8.4(a) test.
    a3: no
  - id: ADD-03 2.2
    type: scope statement (applies wherever the expression is used)
    expected: the reader must find the uses; ADD-03 does not list them.

  - id: ADD-03 3.1
    type: change expressed as a percentage of another value (formula)
    target: VOL-I 8.4(a)
    old: "SAR 800,000,000"
    new: "twenty-five per cent (25%) of the Estimated Project Cost"
    final_text: "(a) a consolidated tangible net worth of not less than twenty-five per cent (25%) of the Estimated Project Cost as at the most recent audited financial statements"
    unchanged: limb (b) turnover SAR 1,200,000,000; combined basis weighted by shareholding.
    computed: "equal to the old SAR 800,000,000 only when EPC = SAR 3,200,000,000; lower below that, higher above it"
    consequence: no sanction stated; pass/fail by inference (Section 8 "mandatory requirements"; VOL-I 11.1 stage (i)).
    a3: yes, medium confidence (inferred), and listed as UNRESOLVED because of A1.
    expected: do NOT state that the requirement is relaxed or tightened without an EPC figure.

  - id: ADD-03 4.1
    type: change expressed as a formula on another value
    target: VOL-V 18.1
    old: "SAR 180,000 for each day of delay"
    new: "one-twentieth of one per cent (0.05%) of the Estimated Project Cost for each day of delay"
    final_text: "If PCOD is not achieved by the Scheduled PCOD, the Project Company shall pay to the Authority delay liquidated damages at the rate of one-twentieth of one per cent (0.05%) of the Estimated Project Cost for each day of delay."
    computed:
      breakeven_epc: "SAR 360,000,000 (0.05% x EPC = SAR 180,000)"
      cap_reached_after_days: 200          # 18.4 unchanged: 10% / 0.05%
      termination_right_after_days: 365    # 18.3 unchanged
    consequence: contract stage (Form 4-E / pricing); no bid-stage sanction.
    a3: no

  - id: ADD-03 5.1
    type: value replacement whose effect runs through a calculation
    target: VOL-II 5.2
    old: "2.0 m/s"
    new: "1.5 m/s"
    final_text: "The main shall be sized for the peak hourly flow in Table 2-6 with a maximum velocity of 1.5 m/s and a minimum residual head of 15 m at the delivery point."
    direction: tightening (contrary to the cover - E1)
    computed:
      peak_flow: "7,500 m3/h = 2.083 m3/s (Table 2-6 row 2-6.2, unchanged)"
      min_bore_at_2_0: 1.152 m
      min_bore_at_1_5: 1.330 m
      dn1200_velocity_at_peak: 1.842 m/s (> 1.5 -> non-compliant)
      effective_minimum: "DN1400 (next standard size); VOL-II 5.3 still prints DN1200"
    a3: no (technical / scored)

  - id: ADD-03 5.2
    type: amendment of an amendment, with a stated (retroactive) effective date
    target: ADD-01 5.1 (which added the GRP sentence to VOL-II 5.3)
    effective_date: 2026-10-08    # the issue date of ADD-01
    old: "for the buried sections of the transmission main"
    new: "for the buried sections of the transmission main other than the trenchless crossings required by Volume II Clause 5.4, at which ductile iron only shall be used"
    final_text_vol_ii_5_3_last_sentence: "Glass reinforced plastic pipe of an equivalent pressure class is acceptable for the buried sections of the transmission main other than the trenchless crossings required by Volume II Clause 5.4, at which ductile iron only shall be used, subject to the whole-life cost comparison required by this Clause."
    expected: >-
      Chain VOL-II 5.3 <- ADD-01 5.1 <- ADD-03 5.2 (effective 8 Oct 2026, i.e. as if ADD-01 had always
      read so). GRP remains acceptable elsewhere on the buried main; ductile iron only at the 3 road + 1 wadi
      trenchless crossings. ADD-01 5.1 is narrowed, not withdrawn.
    a3: no

  - id: ADD-03 6.1
    type: reissue of an addendum table with a weight change that shifts a threshold; hidden note change
    target: ADD-02 Section 3 Table 1-1 (revised) and its Notes (replaced)
    new_table: {A: 25, B: 15, C: 20, D: 20, E: 10, F: 10, G: 20, Total: 120}
    new_criterion_G: "Energy efficiency and specific energy consumption"
    notes:
      "(1)": "The technical score threshold in Volume I Clause 11.3 is unchanged at seventy per cent (70%)."
      "(2)": "The combined score weighting stated in Volume I Clause 11.2 is amended to seventy per cent (70%) technical and thirty per cent (30%) commercial."
      "(3)": "Marks are awarded on the Authority's standard five-point scale and multiplied by the weight shown."
      "(4)": "Criterion G is assessed on the Energy Performance Statement, which shall be included in the Technical Proposal in the format at Appendix C to this Addendum."
    computed:
      threshold_marks: 84              # 70% x 120 (was 70 of 100)
      weighting_chain: "VOL-I 11.2 60/40 -> ADD-02 Note (2) 65/35 -> ADD-03 Note (2) 70/30"
    a3: threshold - see a3_delta
  - id: ADD-03 6.2
    type: split of one clause into two (with content change)
    target: VOL-I 11.3
    new_11_3: "A Proposal whose technical score is less than seventy per cent (70%) of the total marks available in Table 1-1 shall not proceed to commercial evaluation."
    new_11_3A: "The Envelope B of a Proposal that does not proceed to commercial evaluation shall be retained unopened by the Authority and returned to the Bidder after the Preferred Bidder Notification."
