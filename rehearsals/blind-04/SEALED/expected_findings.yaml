deliberate_ambiguities:
  - id: A1
    kind: NO CORRECT ANSWER - escalate, do not resolve
    issue: >-
      ADD-03 3.1 makes VOL-I 8.4(a) a percentage of the Estimated Project Cost, which ADD-03 2.1 defines as
      the figure the Bidder states in Form 4-F. Form 4-F goes only in Envelope B (VOL-I 10.1). VOL-I 8.4 is a
      Section 8 mandatory requirement checked at stage (i) on a pass/fail basis (VOL-I 11.1), before
      Envelope B is opened (and a failed Proposal's Envelope B stays unopened - 11.3A). Stating the EPC in
      Envelope A risks non-responsiveness under VOL-I 6.2 ("any price, rate, or other commercial
      information"). Not stating it leaves 8.4(a) undemonstrable at stage (i). Q19 asked exactly this and
      the Authority declined to answer.
    sources: [ADD-03 2.1, ADD-03 3.1, ADD-03 Q19, VOL-I 6.2, VOL-I 10.1, VOL-I 11.1, ADD-03 6.2 (11.3A), VOL-I 3.3]
    expected: >-
      List in A3 "could not resolve" with both horns and the sources; recommend a person decide (e.g. a
      further clarification before the Thu 12 Nov 2026 cut-off, or a legal view on whether an EPC-free
      demonstration such as "TNW of SAR X, which is not less than 25% of our EPC" is acceptable). No machine
      resolution. A tool that picks one horn as the answer fails this item.
  - id: A2
    kind: convention - accept either if stated
    issue: forward counting of "five (5) Working Days after the Proposal Due Date" (Thu 3 Dec vs Wed 2 Dec) and the time of day on that date.
  - id: A3
    kind: convention - accept if stated
    issue: boundary of "within the thirty (30) days preceding" the PDD for the register (27 Oct - 25 Nov expected).
  - id: A4
    kind: flag
    issue: whether the Energy Performance Statement counts toward the 150-page narrative limit (VOL-I 9.2 as amended by ADD-02); ADD-03 says only "included in the Technical Proposal".
  - id: A5
    kind: flag
    issue: practical diameter after 5.1 (DN1400 assumes standard ductile-iron sizes and lined bore close to DN); VOL-II 5.3 still prints DN1200 - report as derived, medium confidence.
  - id: A6
    kind: flag
    issue: the retroactive effective date of ADD-03 5.2 has no practical bid-stage consequence beyond the chain record; a tool may note it.

