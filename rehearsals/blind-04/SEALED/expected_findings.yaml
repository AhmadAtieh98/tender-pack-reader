# ---------------------------------------------------------------------------
# Cover summary and its planted errors
# ---------------------------------------------------------------------------
cover_summary_verbatim: >-
  This Addendum amends the definition of Estimated Project Cost, the financial capacity requirement in
  Volume I Clause 8.4 and the delay liquidated damages in Volume V Clause 18.1, relaxes the velocity limit
  for the treated effluent transmission main, amends Section 5.1 of Addendum No. 1, reissues the technical
  evaluation table to add a criterion for energy efficiency, divides Volume I Clause 11.3 into two Clauses,
  makes a conditional amendment to Volume II Clause 1.4, adds a Declaration of Beneficial Ownership (Form
  4-H) which all Bidders may submit through the Portal within five Working Days after the Proposal Due
  Date, and responds to clarification requests 15 to 20.

cover_planted_errors:
  - id: E1
    mechanism: direction reversal (the item is named correctly; the direction of the change is inverted)
    cover_claim: "relaxes the velocity limit for the treated effluent transmission main"
    truth: >-
      Section 5.1 lowers the MAXIMUM velocity in VOL-II 5.2 from 2.0 m/s to 1.5 m/s. A lower maximum
      velocity is MORE onerous: the main must be larger. The number goes down; the requirement tightens.
    detect_by: compare the cover verb with Section 5.1; reason that "maximum velocity" is a ceiling, so 2.0 -> 1.5 tightens.
    consequence_if_missed: >-
      A reader who trusts the cover keeps DN1200 (VOL-II 5.3 minimum) and misses that the main and the
      four trenchless crossings must be re-sized (see S1), with knock-on cost in the Estimated Project Cost.
    expected: flag the cover statement as wrong (high confidence); the register follows Section 5.1.
  - id: E2
    mechanism: half-true itemisation that hides a second change inside a reissued item
    cover_claim: "reissues the technical evaluation table to add a criterion for energy efficiency"
    truth: >-
      True as far as it goes (criterion G, 20 marks, is added; A-F are unchanged, as Section 6.1 also says).
      Hidden inside the reissued Notes, which replace the ADD-02 Notes wholesale: Note (2) changes the
      combined weighting from 65/35 (ADD-02 Note (2)) to 70% technical / 30% commercial; Note (1) restates
      the threshold as "seventy per cent (70%)", which with the new total of 120 means 84 marks, not 70;
      Note (4) adds a new deliverable (Energy Performance Statement) whose format is in an Appendix C that is
      not supplied. Neither the cover nor the narrative of Section 6.1 mentions the weighting change.
    detect_by: diff the ADD-02 Table 1-1 (revised) Notes against the Notes to Table 1-1 (second revision); recompute 70% x 120.
    consequence_if_missed: A1/A2 keep 65/35 and a 70-mark threshold; the commercial team mis-models the combined score.
    expected: flag cover as incomplete/misleading; register VOL-I 11.2 = 70/30 (source ADD-03 Note (2)) and threshold 84/120.
  - id: E3
    mechanism: claim about "all Bidders" that the provision limits to a subset
    cover_claim: "Form 4-H ... which all Bidders may submit through the Portal within five Working Days after the Proposal Due Date"
    truth: >-
      Section 8.3: Form 4-H "shall be submitted with Envelope A". Only "a member of the Bidder that is
      incorporated outside the Kingdom" may instead submit its own Form 4-H through the Portal, not later
      than five Working Days after the PDD (Thursday 3 December 2026). A Kingdom-incorporated member's
      Form 4-H must be in Envelope A at 14:00 on Thursday 26 November 2026. Section 8.4: failure by the
      required time = non-responsive.
    detect_by: read Section 8.3; the relief is per member and limited by place of incorporation.
    consequence_if_missed: a Saudi member's Form 4-H submitted late through the Portal -> Proposal non-responsive (8.4).
    expected: flag cover as wrong (high confidence); A3 row states the split deadline.

cover_true_but_incomplete:           # not planted errors; credit if noticed, no penalty if not
  - claim: "divides Volume I Clause 11.3 into two Clauses"
    note: "the division also changes content (threshold re-based to 70% of total marks; Envelope B now retained until after the Preferred Bidder Notification). See S4."
  - claim: "amends Section 5.1 of Addendum No. 1"
    note: "silent on the stated retroactive effective date (8 October 2026)."

