# ---------------------------------------------------------------------------------------------
# (4) Indirect effects (land elsewhere than the provision names)
# ---------------------------------------------------------------------------------------------
indirect_effects:
  - id: IE1
    from: P2.1
    lands_on: "VOL-I 9.1 item (i) and VOL-I 10.1"
    via: {doc: VOL-I_Instructions_to_Bidders.pdf, page: 4, quote: "(i) the certificates and evidence required under Section 8."}
    effect: "The licence copy / Certificate / undertaking are Envelope A items under 9.1(i) (marshalling list), never Envelope B (10.1)."
  - id: IE2
    from: P2.1
    lands_on: "A3 and the old 8.9 undertaking row/activity"
    effect: "Modality change: base 8.9 had no stated consequence; new 8.9 'shall be rejected' -> new A3 entry. Any A1/A5 item for the 'undertaking to obtain such licence prior to Financial Close' is superseded except for 2.4 members."
  - id: IE3
    from: [P2.2, P2.3, IMG1]
    lands_on: "A5 marshalling drop-dead dates"
    effect: "Values held only in the Arabic image set the lead times: D4 Sun 22 Nov, D5 Sun 22 Nov, D6 infeasible."
  - id: IE4
    from: Q16
