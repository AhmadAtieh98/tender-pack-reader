# SEALED answer key: blind rehearsal 08. SYNTHETIC: not tender content.
# Every ADD-03 quote below (a mapping with "quote" and "page" and no "doc", or doc "ADD-03") is
# verified by `build_addendum.py --check <pack> --verify-key expected_findings.yaml` to occur on the
# stated page of the built PDF (watermark removed, whitespace normalised). Every pack quote (a mapping
# with "doc" naming a pack file) is verified verbatim on the stated page. Every "quote_ar" is verified
# against the Arabic source dictionary that the Appendix A image is rendered from.

meta:
  rehearsal: blind-08
  label: "SYNTHETIC: not tender content"
  addendum: ADD-03_Addendum_No_3.pdf
  pages: 4
  printed_issue_date: {quote: "Issued 18 November 2026", page: 1}
  issue_weekday: Wednesday
  stands_on: "Volumes I, II, IV, V as amended by ADD-01 (8 Oct 2026) and ADD-02 (22 Oct 2026) only. Volume III never supplied."
  planning_date: "Wednesday 18 November 2026 (latest addendum date; correspondence 2026-10-01 / 2026-10-02 reply item 5)"
  proposal_due_date: "Thursday 26 November 2026, 14:00 Riyadh time (VOL-I 6.1 as amended by ADD-01 2.1; not changed by ADD-03)"
  working_days_issue_to_pdd: 6   # 18, 19, 22, 23, 24, 25 Nov (issue day inclusive, PDD exclusive)
  external_assumptions:
    - "No public holiday in the Kingdom falls between 22 October and 30 November 2026 (VOL-I 2.4 depends on it; the pack gives no calendar)."
    - "A Certificate must be in hand by close of Wednesday 25 November to be marshalled into Envelope A; issue on the PDD day itself before 14:00 is not assured."
  image:
    page: 3
    description: "Appendix A: raster image (1750 x 1750 px, RGB with equal channels, FlateDecode) of the Office letter No. 228/2026 dated 16 November 2026 carrying Table 8-1 in Arabic. No text layer, no OCR layer; the Arabic exists only as pixels."
  required_elements_map:
    "1_image": [IMG1]
    "2_calculations": [C1, C2, C3, C4]
    "3_new_obligations": [N1, N2, N3, N4, N5, N6]
    "4_indirect_effects": [IE1, IE2, IE3, IE4, IE5, IE6, IE7, IE8]
    "5_genuine_ambiguity": [GA1]
    "5_looks_ambiguous_but_settled": [S1, S2, S3, S4, S5]
    "6_inserted_exception_table_into_volume": [ST1, ST2, ST3]
    "7_cover_errors": [E1, E2, E3]
    "8_decoys_and_must_not_report": [DC1, DC2, DC3, DC4, DC5, DC6, DC7, DC8, DC9, "MNR01-MNR22"]

# ---------------------------------------------------------------------------------------------
# Provisions of ADD-03, in order, with their expected effect on A1 / A2 / A3 / A5
# ---------------------------------------------------------------------------------------------
provisions:
  - id: P-COVER
    section: cover summary
    page: 1
    quote: "This Addendum replaces Volume I Clause 8.9 so that a member of a Bidder incorporated outside the Kingdom must submit either its investment licence or a Certificate of Investment Registration"
    effect: "Summary only; not operative. Contains three planted errors E1-E3. Nothing in A1/A3/A5 may be sourced from the cover."
  - id: P-PREC
    section: precedence paragraph
    page: 1
    quote: "Bidders shall acknowledge receipt in Form 4-A."
    effect:
      A1: "Form 4-A acknowledgement row: Addenda acknowledged now 1 to 3 (status updated by ADD-03)."
      A5: "Form 4-A completion lists Addendum No. 3."
  - id: P1.1
    section: "1.1"
    page: 1
    quote: "This Addendum is issued under Volume I Clause 5.3 and takes precedence over Addenda Nos. 1 and 2 in accordance with Volume I Clause 3.2."
    effect: "Precedence recital (decoy DC9). ADD-03 ranks first under VOL-I 3.2(a). No A1 row."
  - id: P1.2
    section: "1.2"
    page: 1
    quote: "A reference in this Addendum to a Clause, Table or Form is to that Clause, Table or Form as amended by Addenda Nos. 1 and 2, unless otherwise stated."
    effect: "Interpretive. Relevant to S2 ('as issued' is an express 'otherwise stated'). No clause referenced by ADD-03 was amended by ADD-01/02 except Table 1-1 (criterion B now 15) used in IE7."
  - id: P1.3
    section: "1.3"
    page: 1
    quote: "Clarification requests 15 to 19 were received before the time stated in Volume I Clause 5.2."
    effect: "Informational (decoy DC1). Confirms five requests (15-19), contradicting the cover (E2)."
  - id: P2.1
    section: "2.1"
    page: 1
    quote: "Each member of the Bidder that is incorporated outside the Kingdom shall submit with Envelope A either (a) a copy of its current investment licence or (b) a Certificate of Investment Registration issued by the Northern Region Investment Services Office (the Office) in accordance with Table 8-1. A Proposal that does not include the evidence required by this Clause for each such member shall be rejected."
    operation: "VOL-I 8.9 deleted and replaced"
    state_before: {doc: VOL-I_Instructions_to_Bidders.pdf, page: 4, quote: "The Bidder shall submit either evidence of a current investment licence for each foreign consortium member, or a signed undertaking to obtain such licence prior to Financial Close."}
    effect:
      A1: "Row VOL-I 8.9: status 'replaced by ADD-03 2.1'; new verbatim text; pass/fail; evidence = licence copy or Certificate per foreign-incorporated member; placed in Envelope A. The undertaking alternative is gone (except P2.4 members)."
      A2: "Chain VOL-I 8.9 (base, p.4) -> ADD-03 2.1 replaced -> qualified by ADD-03 2.4 (exception), 2.5 (notification), Q15 (undertaking not accepted), Q16 (row 2 period)."
      A3: "NEW disqualifier: 'shall be rejected' if, for any member incorporated outside the Kingdom (other than a 2.4 member), neither a current investment licence copy nor a Certificate is in Envelope A. Before ADD-03, 8.9 stated no consequence and was not an A3 item."
      A5: "Activities N1/N2 (see new_obligations); drop-dead dates D4-D7."
    labels: [N1, IE2]
  - id: P2.2
    section: "2.2"
    page: 1
    quote: "Table 8-1 is reproduced at Appendix A to this Addendum as issued by the Office and forms part of Volume I. Table 8-1 is issued in the Arabic language. The Arabic text governs. The English translation at Appendix B is provided for convenience only."
    effect:
      A1: "New source table VOL-I Table 8-1 (Arabic, image-only, ADD-03 p.3). Values read from the image govern (row 2 = 5 Working Days, not the English 3)."
      A2: "New item: VOL-I Table 8-1 created by ADD-03 2.2 / Appendix A; modified by ADD-03 Q16 (row 2)."
    labels: [ST3, IMG1, S1]
  - id: P2.3
    section: "2.3"
    page: 1
    quote: "Applications for a Certificate of Investment Registration shall be made by the member to the Office. The Office has undertaken to the Authority to issue a Certificate within the issue period stated in Table 8-1 for the class of the member, counted in accordance with the Notes to Table 8-1."
    effect:
      A1: "Process row: application by the member to the Office; issue period per class (Arabic Table 8-1) counted per Note (1)."
      A5: "Lead times: row 1 = 3 WD, row 2 = 5 WD (3 WD if lodged by Sun 22 Nov, Q16), row 3 = 8 WD; counted from the Working Day after receipt of a complete application."
    labels: [N2, S4]
  - id: P2.4
    section: "2.4"
    page: 1
    quote: "Section 2.1 does not apply to a member of the Bidder that is to hold not more than ten per cent (10%) of the shares in the Project Company and that has no role in the design, construction or operation of the Facility. Such a member shall instead submit with Envelope A the signed undertaking described in Volume I Clause 8.9 as issued."
    effect:
      A1: "Scoped exception row: a passive member (<=10% of Project Company shares AND no design/construction/operation role) submits the base 8.9 undertaking (to obtain an investment licence prior to Financial Close) in Envelope A instead."
      A3: "Not a stated rejection ground (2.1's rejection sentence does not apply to these members). Must not be listed as a stated disqualifier; may be flagged as a risk (AIR4)."
      A5: "Activity: obtain signed undertaking from each such member for Envelope A."
    labels: [ST2, N4, S2]
  - id: P2.5
    section: "2.5"
    page: 1
    quote: "A Bidder that relies on paragraph (b) of Volume I Clause 8.9 for any member shall notify the Authority through the Portal, not later than three (3) Working Days before the Proposal Due Date, of the name of that member and the reference number of its application to the Office."
    effect:
      A1: "New obligation (shall), pass/fail in nature but with NO stated consequence."
      A3: "NOT an A3 item. The cover's 'failing which the Proposal will be rejected' (E3) is wrong."
      A5: "Milestone: Portal notification by Monday 23 November 2026 (VOL-I 2.4 backward count, PDD not counted). Depends on N2 lodging (application reference needed)."
    labels: [N3, S3]
  - id: P2.6
    section: "2.6"
    page: 1
    quote: "The periods in Volume I Clause 12.2 for Commercial Close and Financial Close are unchanged."
    effect: "Restatement, no effect (decoy DC2)."
  - id: P3.1
    section: "3.1"
    page: 2
    quote: "The treated effluent storage reservoir referred to in Clause 1.2 shall provide a working volume of not less than six (6) hours of the design flow and shall be divided into not fewer than two (2) compartments, each capable of being isolated for cleaning while the other remains in service."
    operation: "new VOL-II Clause 4.6 inserted after 4.5"
    state_before: {doc: VOL-II_Technical_Requirements.pdf, page: 2, quote: "the treated effluent storage reservoir; and all associated electrical, control and civil works."}
    effect:
      A1: "New row(s) VOL-II 4.6: (i) working volume >= 6 h of 'the design flow' (GA1: 30,000 m3 or 45,000 m3, unresolved); (ii) >= 2 compartments, each isolatable for cleaning with the other in service. Technical requirement, evidenced in the process design (criterion A)."
      A2: "Chain: VOL-II 1.2 (reservoir in the Works, no capacity) -> ADD-03 3.1 inserts 4.6; ADD-03 Q18 points to it."
      A3: "Not a disqualifier. GA1 belongs in A3's list of things that could not be resolved."
      A5: "Process design update activity (reservoir sizing on BOTH readings until a person decides)."
    labels: [ST1, N5, GA1, C4]
  - id: P3.2
    section: "3.2"
    page: 2
    quote: "The insertion of Clause 4.6 does not renumber any other Clause of Volume II."
    effect: "Numbering note, no effect (decoy DC3)."
  - id: P3.3
    section: "3.3"
    page: 2
    quote: "In Volume V Clause 12.1, the period of thirty-six (36) months is increased by six (6) months."
    state_before: {doc: VOL-V_Draft_Project_Agreement.pdf, page: 2, quote: "The Project Company shall achieve PCOD within thirty-six (36) months of the Notice to Proceed (the Scheduled PCOD)."}
    effect:
      A1: "Row VOL-V 12.1: Scheduled PCOD = forty-two (42) months after the Notice to Proceed (computed, C2)."
      A2: "Chain VOL-V 12.1 (base, 36 months) -> ADD-03 3.3 (+6 months) = 42 months."
      A5: "Construction programme in the Technical Proposal must show PCOD within 42 months (via 3.4)."
    labels: [C2, IE5, IE6]
  - id: P3.4
    section: "3.4"
    page: 2
    quote: "Bidders shall reflect Sections 3.1 and 3.3 in the process design and the construction programme submitted in the Technical Proposal and in the Financial Model."
    effect:
      A1: "Rows VOL-I 9.7 (process design; construction programme) and VOL-I 10.3 / Form 4-F (Financial Model) gain an ADD-03 status note."
      A5: "Activities: update process design (4.6) and construction programme (42 months) for Envelope A; update Financial Model and the Form 4-F figures derived from it for Envelope B."
    labels: [N6, IE7]
  - id: P4.1
    section: "4.1"
    page: 2
    quote: "The amount stated in Volume V Clause 39.4 is reduced by forty per cent (40%)."
    state_before: {doc: VOL-V_Draft_Project_Agreement.pdf, page: 4, quote: "The Project Company may terminate for an Authority Event of Default, being a failure to pay an undisputed sum exceeding SAR 20,000,000 that continues for sixty (60) days after notice."}
    effect:
      A1: "Row VOL-V 39.4: threshold SAR 12,000,000 (computed, C1); period 60 days unchanged."
      A2: "Chain VOL-V 39.4 (base SAR 20,000,000) -> ADD-03 4.1 (-40%) = SAR 12,000,000."
      A3: "None."
    labels: [C1, IE8]
  - id: P4.2
    section: "4.2"
    page: 2
    quote: "The period of sixty (60) days in Volume V Clause 39.4 is unchanged."
    effect: "Restatement, no effect (decoy DC4)."

# ---------------------------------------------------------------------------------------------
# Responses to clarification requests (ADD-03 Section 5, page 2)
# ---------------------------------------------------------------------------------------------
responses:
  - id: Q15
    page: 2
    question: {quote: "May the undertaking required by Volume I Clause 8.9 be given by the lead member on behalf of a foreign consortium member?", page: 2}
    answer: {quote: "No. Volume I Clause 8.9 is replaced by Section 2.1 of this Addendum and an undertaking is no longer accepted, save from a member described in Section 2.4, which shall give its own undertaking.", page: 2}
    type: changing/confirming
    effect: "Confirms the undertaking route is closed except for 2.4 members, and that a 2.4 member gives its OWN undertaking (not the lead member). A1: 2.4 row evidence = member's own signed undertaking."
  - id: Q16
    page: 2
    question: {quote: "Will the Authority assist foreign consortium members that have not obtained an investment licence before the Proposal Due Date?", page: 2}
    answer: {quote: "for an application lodged not later than Sunday 22 November 2026, the issue period in row 2 of Table 8-1 is reduced by two (2) Working Days. The other issue periods in Table 8-1 are unchanged.", page: 2}
    type: changing
    effect: "Relative change to a value held only in the governing Arabic image (C3): row 2 = 5 - 2 = 3 Working Days for applications lodged on or before Sun 22 Nov. Rows 1 and 3 unchanged. A2: Table 8-1 row 2 modified by ADD-03 Q16."
    labels: [C3, IE4]
  - id: Q17
    page: 2
    question: {quote: "Will the arbitration under Volume V Clause 44.2 be conducted in English?", page: 2}
    answer: {quote: "Yes. Volume V Clause 44.2 applies.", page: 2}
    type: decoy (restatement)
    pack_basis: {doc: VOL-V_Draft_Project_Agreement.pdf, page: 4, quote: "failing resolution to arbitration seated in Riyadh conducted in the English language before three arbitrators"}
    effect: "None (DC5)."
  - id: Q18
    page: 2
    question: {quote: "Volume II Clause 1.2 includes a treated effluent storage reservoir, but no capacity is stated. What capacity is required?", page: 2}
    answer: {quote: "See new Volume II Clause 4.6, inserted by Section 3.1 of this Addendum.", page: 2}
    type: pointer
    effect: "No separate change (DC7). Does NOT resolve GA1: it points back to the ambiguous text."
  - id: Q19
    page: 2
    question: {quote: "Will the Authority reconsider the threshold for an Authority Event of Default in Volume V Clause 39.4?", page: 2}
    answer: {quote: "Yes. See Section 4 of this Addendum.", page: 2}
    type: pointer
    effect: "No separate change (DC6)."

