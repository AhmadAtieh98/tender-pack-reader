  - {id: AIR2, point: "Under VOL-V 3.1 (term from the Effective Date), a longer construction period shortens operations by six months. VOL-I 12.1 (from PCOD) prevails under 3.2(b) (ADD-02 response 7), so this need not be escalated, but it may be noted."}
  - {id: AIR3, point: "The reservoir is a permanent civil structure, so VOL-II 5.5 return periods apply to it."}
  - {id: AIR4, point: "The consequence of omitting a 2.4 undertaking is not stated. Flag it as a risk under the VOL-I 11.1 stage (i) pass/fail check."}
  - {id: AIR5, point: "Member classification edge cases (e.g. a GCC company acting through a Kingdom branch: row 1 or row 3) depend on bidder facts; flag them."}
