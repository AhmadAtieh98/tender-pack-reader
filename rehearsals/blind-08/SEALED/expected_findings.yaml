      governing_value: "٥ (5) Working Days"
      translation_value: "3"
      resolution: "Arabic governs (S1). Correct row 2 period = 5 WD (3 WD only for applications lodged by Sun 22 Nov under Q16)."
    values_that_matter: "Issue periods 3 / 5 / 8 Working Days drive A5 drop-dead dates; the documents column drives the application pack; Note (1) fixes the counting rule; Note (2) validity 90 days."

# ---------------------------------------------------------------------------------------------
# (2) Calculations
# ---------------------------------------------------------------------------------------------
computed_values:
  - id: C1
    provision: P4.1
    quote: {quote: "The amount stated in Volume V Clause 39.4 is reduced by forty per cent (40%).", page: 2}
    previous_effective_value: "SAR 20,000,000 (VOL-V 39.4 base; not amended by ADD-01/ADD-02)"
    arithmetic: "20,000,000 x (1 - 0.40) = 12,000,000"
    result: "SAR 12,000,000"
    wrong_results: ["SAR 8,000,000 (40% OF the base, as the cover says: E1)", "SAR 19,999,960 or similar literal readings"]
  - id: C2
    provision: P3.3
    quote: {quote: "In Volume V Clause 12.1, the period of thirty-six (36) months is increased by six (6) months.", page: 2}
    previous_effective_value: "36 months after the Notice to Proceed"
    arithmetic: "36 + 6 = 42"
    result: "Scheduled PCOD = 42 months after the Notice to Proceed; long-stop for termination under 18.3/39.2 = Scheduled PCOD + 365 days (42 months + 365 days after NTP)"
  - id: C3
    provision: Q16
    quote: {quote: "the issue period in row 2 of Table 8-1 is reduced by two (2) Working Days", page: 2}
    previous_effective_value: "5 Working Days: the governing Arabic value ٥ in the image (NOT the English translation's 3)"
    arithmetic: "5 - 2 = 3 Working Days, only for applications lodged on or before Sunday 22 November 2026"
    result: "3 Working Days (row 2, lodged by 22 Nov); 5 Working Days otherwise; rows 1 and 3 unchanged (3 and 8)"
    wrong_results: ["1 Working Day (3 - 2, from the English translation)", "reduction applied to rows 1 or 3", "reduction applied to applications lodged after 22 Nov"]
  - id: C4
    provision: P3.1
    quote: {quote: "not less than six (6) hours of the design flow", page: 2}
    arithmetic:
      reading_A: "average daily flow 120,000 m3/day / 24 = 5,000 m3/h; x 6 h = 30,000 m3"
      reading_B: "peak hourly flow (design) 7,500 m3/h x 6 h = 45,000 m3"
    result: "UNRESOLVED (GA1): 30,000 m3 or 45,000 m3. Both must be shown; neither may be asserted as the requirement."
    pack_basis:
      - {doc: VOL-II_Technical_Requirements.pdf, page: 3, quote: "2-6.1 Average daily flow 120,000 m3/day 2-6.2 Peak hourly flow (design) 7,500 m3/h"}
      - {doc: VOL-II_Technical_Requirements.pdf, page: 2, quote: "The Facility shall be designed for a nominal treatment capacity of 120,000 m3/day average daily flow"}

