# ---------------------------------------------------------------------------------------------
# (5) Genuine ambiguity and the points that only look ambiguous
# ---------------------------------------------------------------------------------------------
genuine_ambiguity:
  - id: GA1
    provision: P3.1
    quote: {quote: "not less than six (6) hours of the design flow", page: 2}
    reading_A: "'design flow' = the flow the Facility is designed for: 120,000 m3/day average daily flow (VOL-II 2.1; Table 2-6 row 2-6.1) -> 30,000 m3."
    reading_B: "'design flow' = the flow labelled '(design)' in Table 2-6: peak hourly flow (design) 7,500 m3/h, which also sizes the transmission main (VOL-II 5.2) -> 45,000 m3."
    why_unsettled: "The expression 'design flow' appears nowhere else in the pack (builder --check asserts its absence). No precedence rule, definition or translation decides it. ADD-02 response 11 ('design to the figures stated in Volume II') fits both. VOL-II 4.2 and VOL-I 3.3 point to a clarification, but the 5.2 cut-off (Thu 12 Nov) has passed. Q18 only points back to 4.6."
    pack_basis:
      - {doc: VOL-II_Technical_Requirements.pdf, page: 4, quote: "The main shall be sized for the peak hourly flow in Table 2-6 with a maximum velocity of 2.0 m/s"}
      - {doc: VOL-I_Instructions_to_Bidders.pdf, page: 2, quote: "A Bidder that resolves such a conflict unilaterally does so at its own risk, and the Authority shall not be bound by the Bidder's interpretation."}
      - {doc: ADD-02_Addendum_No_2.pdf, page: 2, quote: "Bidders shall design to the figures stated in Volume II. Volume II Clause 4.2 applies."}
    expected_handling: "Surface both readings with both volumes (C4) in A3's 'could not resolve' list and route to a person (commercial/technical decision: cost difference of 50% of reservoir volume). A confident single answer is wrong."
settled_points:
  - id: S1
    looks_like: "Table 8-1 row 2 issue period is 5 in the image but 3 in the English translation."
    settled_by: {quote: "The Arabic text governs. The English translation at Appendix B is provided for convenience only.", page: 1}
    also: {quote: "This translation is provided for convenience only. The Arabic text of Table 8-1 at Appendix A governs.", page: 3}
    answer: "5 Working Days (3 only under Q16 for lodging by 22 Nov)."
  - id: S2
    looks_like: "2.4 refers to 'the signed undertaking described in Volume I Clause 8.9', but 8.9 has just been replaced and no longer describes any undertaking."
    settled_by: {quote: "Such a member shall instead submit with Envelope A the signed undertaking described in Volume I Clause 8.9 as issued.", page: 1}
    also: {quote: "as amended by Addenda Nos. 1 and 2, unless otherwise stated.", page: 1}
    answer: "'As issued' is the express 'otherwise stated' of recital 1.2: the undertaking is the base 8.9 one, 'to obtain such licence prior to Financial Close', given by the member itself (Q15)."
  - id: S3
    looks_like: "'not later than three (3) Working Days before the Proposal Due Date': is the PDD counted (Tue 24 or Mon 23)?"
    settled_by: {doc: VOL-I_Instructions_to_Bidders.pdf, page: 2, quote: "Where a period expressed in Working Days is to be counted backwards from a stated date, the stated date itself shall not be counted."}
    answer: "Monday 23 November 2026."
  - id: S4
    looks_like: "Forward counting of the Office issue periods (does the day of receipt count?). The pack has no forward-counting rule."
    settled_by: {doc: ADD-03-image, page: 3, quote_ar: "١. تُحسب مدة الإصدار بأيام العمل اعتباراً من يوم العمل التالي ليوم استلام الطلب المكتمل."}
    also: {quote: "(1) The issue period is counted in Working Days from the Working Day following the day of receipt of a complete application.", page: 4}
    answer: "The day of receipt is not counted; counting starts on the next Working Day."
  - id: S5
    looks_like: "ADD-03 is issued after the clarification cut-off: is it valid, and are responses 15-19 late?"
    settled_by: {quote: "Clarification requests 15 to 19 were received before the time stated in Volume I Clause 5.2.", page: 1}
    also: {doc: VOL-I_Instructions_to_Bidders.pdf, page: 3, quote: "The Authority will publish its responses to clarification requests in the form of Addenda issued to all Bidders."}
    answer: "Valid. 5.2 limits requests, not Addenda, and the requests were in time."

