        - 'The crop details the item relies on are not in the evidence list: the date ''التاريخ: ١٦ نوفمبر ٢٠٢٦م'',
          the reference ''الرقم: ٢٢٨/٢٠٢٦'', the empty stamp oval at ADD-03:p3-image/stamp, and the signature mark
          with no name. Only the signatory title and the main region''s crop hash are evidenced. The rationale''s
          ''band b18-left'' stamp crop has no crop_sha256.'
        - The item says the values 'would feed ... the Section 2.5 notification', but no unit or quotation for Section
