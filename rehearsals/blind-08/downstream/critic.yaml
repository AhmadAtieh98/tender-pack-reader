          evidence shown. The printed unit ADD-03:p3-image gives only the table heading and intro sentence (''cells'':
          null). Rows ١ and ٣ have no quotation at all. Row ٢ ''٥'' rests only on statement downstream-002/ST-F5,
          which the controller marks ''not supported verbatim''.'
        - 'The conflict between Arabic row ٢ and English row 2 (''3'') cannot be confirmed from what is shown. The
          ''Issue period (Working Days): 3'' cell of ADD-03:T8-1/2 is verified. The Arabic ''٥'' is a one-character
          reading quote that the controller rejects elsewhere as ''too short to be evidence'' (D-23), and the reading
