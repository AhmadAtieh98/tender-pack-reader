items:
  DS-02:
    batch: downstream-001
    review:
      critic:
        agrees: true
        concerns:
        - The consequence is tied to 'the long-stop date', not to the 270-day period. The row's quote and date rule
          (270 days after the Preferred Bidder Notification) do not show that the two are the same date. The note
          correctly leaves I-VOL-I-BOND-LONGSTOP open. The row must not be read as linking the Bid Bond call to
          day 270 until a person decides.
        - The class 'contractual' for 'entitles the Authority to call the Bid Bond and to proceed with the next
          ranked Bidder' is a reading. Whether this also counts as an A3 bid-out consequence (exclusion in favour
          of the next ranked Bidder) is a person's call. The item should not settle it by its choice of class.
        - The stage is given as ADD-03, but the obligation has been in force since BASE. ADD-03:2.6 only confirms
          that the periods are unchanged. The register should make clear that ADD-03 is not the stage where the
          obligation came into force.
        evidence_checked:
        - 'VOL-I:12.2 text_before_addendum: ''Financial Close within two hundred and seventy (270) days, of the
          date of the Preferred Bidder Notification'' (verbatim)'
        - 'VOL-I:12.2: ''Failure to achieve Financial Close by the long-stop date entitles the Authority to call
          the Bid Bond and to proceed with the next ranked Bidder.'' (verbatim)'
        - 'ADD-03:2.6: ''The periods in Volume I Clause 12.2 for Commercial Close and Financial Close are unchanged.'''
        - VOL-I:8.9 span quoted in DS-18 ('a signed undertaking to obtain such licence prior to Financial Close'),
          which supports the note
        selected_because: *id001
        route: host
        critic_run: ADD-03-run-host-20261008T053735Z-77b2-downstream-001-critic
        model_reported: claude-opus-5-5
  DS-06:
    batch: downstream-001
    review:
      critic:
        agrees: false
        concerns:
        - 'insufficient evidence: the full text of ADD-03:2.5 is not printed under units. Only one span is shown,
          and the controller check confirms only that this span is verbatim. The evidence shown does not prove the
          key claim that ''Operative Section 2.5 prints the notification obligation with no consequence''. Another
          sentence of 2.5, or another provision, could state one.'
        - The issue says 'The clarification window has closed (VOL-I 5.2)', but VOL-I:5.2 is not quoted and cannot
          be checked here.
        - The framing itself (cover vs operative difference, both quoted, the cover not treated as amending, a human
          decision pending, owner Legal) is consistent with policy. If the full 2.5 is confirmed to state no consequence,
          the item would follow from it.
        evidence_checked:
        - 'ADD-03:cover/para3: ''requires a Bidder relying on a Certificate to notify the Authority of its applications,
          failing which the Proposal will be rejected'' (verbatim)'
        - 'ADD-03:2.5 span (evidence only, unit not printed): ''A Bidder that relies on paragraph (b) of Volume
          I Clause 8.9 for any member shall notify the Authority through the Portal, not later than three (3) Working
          Days before the Proposal Due Date, ...'''
        selected_because: *id002
        route: host
        critic_run: ADD-03-run-host-20261008T053735Z-77b2-downstream-001-critic
        model_reported: claude-opus-5-5
  DS-18:
    batch: downstream-001
    review:
      critic:
        agrees: false
        concerns:
        - 'The item says ADD-03/2.1 ''conflicts'' with ADD-03/2.4, but on the words shown 2.4 is an express carve-out
          from 2.1: ''Section 2.1 does not apply to a member ...''. This is not a contradiction. The real difficulties
          are different: (i) 2.4 refers to ''Volume I Clause 8.9 as issued'', which 2.1 deletes; (ii) the replacement
          and its exception may not be expressible with the available op types; (iii) whether 2.1''s rejection words
          reach a missing 2.4 undertaking. Each needs its own class (''software limitation:'' or ''ambiguous:''
          with each reading stated) rather than being called a conflict. As written, the item merges these classes.'
        - The item says the effective VOL-I 8.9 'states no consequence'. Only one span of VOL-I:8.9 is shown, so
          this cannot be checked from the evidence printed.
        - The item cites 'The clarification window has closed (VOL-I 5.2)', but VOL-I:5.2 is not quoted here.
        - Holding 2.1 unapplied leaves a printed deletion-and-replacement, with a stated rejection, out of the effective
          text. This needs a prominent A2/A3 flag. The item's a3 line does this, and its list of dependent rows,
          activity and Table 8-1 lead times is appropriate.
        - The quotations of 2.1, 2.4 and Q15 are accurate against the text shown.
        evidence_checked:
        - 'ADD-03:2.1 text_before_addendum: ''Volume I Clause 8.9 is deleted and replaced by the following: ...
          A Proposal that does not include the evidence required by this Clause for each such member shall be rejected.'''
        - 'ADD-03:2.4 spans: ''Section 2.1 does not apply to a member of the Bidder that is to hold not more than
          ten per cent (10%) ...'' and ''Such a member shall instead submit with Envelope A the signed undertaking
          described in Volume I Clause 8.9 as issued.'''
        - 'VOL-I:8.9 span: ''The Bidder shall submit either evidence of a current investment licence for each foreign
          consortium member, or a signed undertaking to obtain such licence prior to Financial Close.'''
        - 'ADD-03:Q15 row 15 ''Authority response'': ''No. Volume I Clause 8.9 is replaced by Section 2.1 of this
          Addendum and an undertaking is no longer accepted, save from a member described in Section 2.4, which
          shall give its own undertaking.'''
        - ADD-03:cover/para3 (summary of the 8.9 replacement and the 'limited exception')
        selected_because: *id003
        route: host
        critic_run: ADD-03-run-host-20261008T053735Z-77b2-downstream-001-critic
        model_reported: claude-opus-5-5
