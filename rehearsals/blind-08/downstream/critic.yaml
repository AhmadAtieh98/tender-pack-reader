        - The controller's consistency check says the item 'reverses ADD-03/disp/1.2'. The item text does not address
          ADD-03 1.2 or explain the handback, so the clash is left unexplained.
        - 'Correct as far as shown: Notes ١–٣ in (b)–(d) match the quoted readings of note1, note2 and note3. The
