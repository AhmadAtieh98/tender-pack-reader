  D-23:
    batch: downstream-002
    review:
      critic:
        agrees: false
        concerns:
        - One end of the dependency is ADD-03:p3-image/r2 '٥'. That unit is not among the printed units, and the
          controller rejects its quotation as 'too short to be evidence'. The supporting statement downstream-002/ST-F5
