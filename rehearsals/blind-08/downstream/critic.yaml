  D-ROW-02:
    batch: downstream-003
    review:
      critic:
        agrees: false
        concerns:
        - 'The ''requirement'' field is the proposer''s own English rendering of the Arabic row, not a verbatim
          quotation. A1 needs the obligation quoted verbatim, and a translation is never evidence for the source.
          It also adds wording that is not in the quoted cells: the Arabic gives a member class and ''المستندات
          المطلوبة مع الطلب'' (documents required with the application), but nothing in the quotation says the member
          ''applies to the Office''.'
        - The row cites ADD-03:p3-image/note1 and ADD-03:p3-image/note3, and the date_note says the period is 'counted
          under note 1 from an event'. Neither note's text is in the evidence or the statements, so this cannot
          be checked against the request.
        - consequence 'none_stated' rests on downstream-003/S-REJECT-2-1, which is an interpretation. ADD-03:2.1
          prints 'A Proposal that does not include the evidence required by this Clause for each such member shall
          be rejected.' Linking that rejection to issue I-INVREG-CONSEQUENCE is right. However, the row must not
          be read as having no consequence until a person decides that issue.
        - The rationale says the crop 'plainly shows ٥' and that the reading does not mark the numeral as uncertain,
          yet confidence is 'low'. The reason given (the conflict with Appendix B and Q16) is fair. Recording the
          figure from the image while holding the row as PENDING READING is consistent with the rules.
        evidence_checked:
        - ADD-03:2.2 text_before_addendum
        - 'ADD-03:p3-image/r2 quotations (documents cell; ''مدة الإصدار (أيام عمل): ٥'')'
        - 'ADD-03:T8-1/2 ''Issue period (Working Days): 3'''
        - ADD-03:Q16 quotation
        - ADD-03:2.1 'shall be rejected' quotation (via S-REJECT-2-1)
        - controller_validation conditional_on / stages / declared_conflicts
        selected_because: *id006
        route: host
        critic_run: ADD-03-run-host-20261008T053735Z-77b2-downstream-003-critic
        model_reported: claude-opus-5-5
  D-ISS-01:
    batch: downstream-003
    review:
      critic:
        agrees: true
        concerns:
        - 'The controller reports a phase-consistency failure: this item reverses ADD-03/2.2-issue, which applied
          ''The Arabic text governs.'' Handing the point to a person is allowed, because which clause governs and
          what it settles is a person''s decision. Even so, the issue should name ADD-03/2.2-issue explicitly so
          the reviewer can reconcile the two items. ''The Arabic text governs'' deals with Arabic against English.
          It does not obviously deal with the Q16 reduction, so the ambiguity is real at least for Q16.'
        - Reading (b), that Appendix B already shows the reduced period, implies arithmetic between ٥ and 3. That
          arithmetic must not be relied on without `calculate`. The issue correctly states no computed figure.
        - The Q16 quotation here includes the lodging-date condition, but the quotation in S-Q16 does not. Both
          are reported as verbatim. The full Q16 unit text is not printed in the request, so the complete wording
          could not be checked here.
        evidence_checked:
        - 'ADD-03:p3-image/r2 ''مدة الإصدار (أيام عمل): ٥'''
        - 'ADD-03:T8-1/2 ''Issue period (Working Days): 3'''
        - ADD-03:Q16 'for an application lodged not later than Sunday 22 November 2026, the issue period in row
          2 of Table 8-1 is reduced by two (2) Working Days'
        - ADD-03:2.2 'The Arabic text governs. The English translation at Appendix B is provided for convenience
          only.'
        - controller_validation consistency (phases)
        selected_because: *id007
        route: host
        critic_run: ADD-03-run-host-20261008T053735Z-77b2-downstream-003-critic
        model_reported: claude-opus-5-5
  D-CQ-01:
    batch: downstream-003
    review:
      critic:
        agrees: false
        concerns:
        - practical_impact refers to 'the latest date to lodge a row-2 member's application, before Envelope A'.
          Nothing in the evidence shown links Table 8-1 or the Office application to Envelope A or to any submission
          deadline. Without a quotation this link may be invented.
        - The Q16 entry in 'sources' leaves out the lodging-date condition ('for an application lodged not later
          than Sunday 22 November 2026'), but the proposed question depends on that condition. That clause should
          be quoted in sources.
        - The question is neutral, already_settled correctly leaves to a person whether 'The Arabic text governs'
          settles the point, interim_handling chooses neither figure, and the status is 'draft, not sent'. All of
          these are sound.
        - 'Same phase-consistency flag as D-ISS-01: the item should name ADD-03/2.2-issue so a person can reconcile
          the two.'
        evidence_checked:
        - 'ADD-03:p3-image/r2 ''مدة الإصدار (أيام عمل): ٥'''
        - 'ADD-03:T8-1/2 ''Issue period (Working Days): 3'''
        - ADD-03:Q16 quotation
        - ADD-03:2.2 text
        - controller_validation clarify.check and consistency (phases)
