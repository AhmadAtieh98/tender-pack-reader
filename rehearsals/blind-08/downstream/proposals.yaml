        member and states no consequence. Would rest on this if applied: row VOL-I-8.9-01 (requirement, consequence,
        Financial Close date rule), rows ADD-03-2.3-01, ADD-03-2.4-01 and ADD-03-2.5-01 (''paragraph (b)''), activity
        investment-licence, and the Table 8-1 lead times. Open questions for a person: how the replacement and the
        exception are recorded, and whether the rejection words reach a missing 2.4 undertaking. The existing Envelope
        A rules (ADD-02 7.2, VOL-I 6.2) concern other content and are not proposed as covering this. The clarification
        window has closed (VOL-I 5.2), so this is a bid decision. HUMAN DECISION PENDING.'
