        (1) For a member incorporated outside the Kingdom, the evidence would be ''a copy of its current investment
        licence'' or ''a Certificate of Investment Registration'', submitted ''with Envelope A''. The undertaking
        would remain only for the Section 2.4 class.

        (2) Table 8-1 Note 1 (Arabic, pending) counts the issue period from the working day after receipt of a complete
        application.

        (3) Note 2 gives a certificate validity of ninety (٩٠) days from issue, so the timing of an application
        relative to the Proposal Due Date and the Proposal validity matters.

        (4) Note 3 allows electronic lodging only through the Office portal, complete only with all listed documents.
        For row 2 those are certified commercial registration and audited financial statements for the last financial
        year.

        (5) Any date rule on row VOL-I-8.9-01 tied to Financial Close would need review.

        Open questions for Bid management (with Legal): whether to re-scope the evidence item and the lead time,
        and whether a Portal notification activity (Section 2.5) is needed. No bidder facts are stated here. Decision
        pending a person.'
