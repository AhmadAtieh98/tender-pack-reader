# CANDIDATE activity templates (AI workflow run ADD-03-run-host-20261008T053735Z-77b2 added or replaced: cir-portal-notification, investment-registration-application; PROPOSED; durations are PROVISIONAL ASSUMPTIONS).
# Evidence item -> activities. PROPOSED (session 04, extended in Stage 4 and session 08); not reviewed.
# Each activity names: an owner, a `discipline` (Legal, Commercial, Technical, Bid management, Document control), a
# `resource` role (config/assumptions.yaml resources:), the issuer of what it produces, a lead-time ASSUMPTION key
# (config/assumptions.yaml lead_times: elapsed value, staff effort, external party waited on), predecessors and/or
# successors, and optionally `per` (multiplied by the bidder settings: member, foreign_member, signatory = members x
# signatories_per_member, reference, epc_contractor, om_operator) and `item` (a physical or documentary item for the
# marshalling plan). Requirement ids are attached at build time from the A1 rows that need each evidence item;
# nothing here names a requirement. `finish: deadline_of: <rule_id>` makes a pack date a must-finish-by constraint.
# A duration of 0 Working Days means "done at the end of the day before its successor starts" (occupies no
# separate Working Day).
# `gated_by: [issue ids]` (FINALISATION steps only, never preparation): the activity cannot be finalised until a
# person decides the open issue (curation/register issues). Its preparation predecessors continue; the decision is
# needed by the gated activity's latest start. A person lifts a gate by removing it here once the issue is decided.
# `condition:` the activity is needed only if the condition arises; when its window has elapsed at the planning
# date it is reported as CONDITIONAL (whether the condition arose is not known), never as a missed duty.
# An activity listed under two evidence items (a YAML alias, e.g. `copies`) is one activity needed by both.
# `_exceptions: {EV-ID: reason}` lists evidence items that need no activity (C44), each with its reason.
# `_row_checks: {row id: {activities: [ids], basis}}` (session 11, audit A5-2): a row with no deliverable of its own
# (`no_deliverable` in the register) whose compliance a step of the programme checks; the row id is attached to those
# activities' req_ids at build time, only while the row is in force at the stage and only to activities the programme
# has at that stage. An activity that exists only to carry such a row is defined under `_row_check_activities`.
# `_row_exceptions: {row id: reason}`: an A3 (bid-out) row in force that no bid-programme step can carry, with the
# reason. Every A3 row in force is either carried by an activity or listed here, else C48 (schedule.plan).
# Session 12 (audit A5-4): C48 covers every A1 row in force: carried by an activity, or excepted with a reason, which is
# `_row_exceptions` here, else the row's own `no_deliverable`, else (assessment contractual_post_award) its
# post_award_evidence; a row with none of these is NOT CARRIED (C48 problem). A5 lists every row not carried, with the
# reason (a5/README.md and a5/requirements_not_carried.csv).
# `_volume_checks: {volume: {activities, basis, review}}` (session 12, audit A5-2): activities that check every clause of
# a volume (the Form 4-E review of Volume V); every row in force whose units are in that volume is attached to their
# req_ids at build time, so an amended clause of the volume marks them REWORK at a replan.
# `_addenda_checks: {activity id: {rows, basis, review}}` (session 12, audit A5-6): an activity whose output names the
# Addenda issued (Form 4-A 'Addenda acknowledged (numbers)'); each Addendum issued at a later stage changes what it must
# record, so the replan marks it REWORK with those rows (while in force and carried by it), quoting the rule.
# `envelope_rules: A|B` on an activity: it carries the rows of its own envelope only; a row whose scope names the other
# envelope alone (envelope_A / envelope_B) is not attached to it (session 12, audit A5-5).
# `_discipline_map: {A5 discipline: [A1 disciplines]}` (session 12, audit A5-8): A1's discipline vocabulary is the
# register's; an A5 discipline that is not an A1 discipline names the A1 disciplines whose rows it plans. Printed in
# a5/README.md.
# `finish: {deadline_of: PDD, buffer: submission.delivery_buffer_wd}`: the activity finishes that many Working Days
# before the pack date (a PROVISIONAL ASSUMPTION in config/assumptions.yaml); the legal deadline is kept as written.
#
# Envelope chain (both envelopes): every Envelope A document -> assemble-envelope-a; every Envelope B document
# -> assemble-envelope-b; both -> copies (3 hard copies + encrypted USB, Appendix 2 naming) -> seal-and-mark
# (Appendix 3 marking) -> deliver (by the PDD). Signatures follow the Powers of Attorney.
#
# Pack facts are never typed in a name or label (session 09): they are filled at plan time from the stage
# (tenderpack.schedule.fill; a placeholder that cannot be filled is a C45 problem). In an activity `name` or `item`:
# {PDD_TIME} {PDD_TZ} {PDD_DATE} {PDD_SOURCE} (the time, timezone words, date and source of the Proposal Due Date
# in the effective text of VOL-I 6.1 at the stage) and {ROW:<row id>:<parameter>} (that row's interpretation
# parameter at the stage, e.g. the Appendix 3 marking). In the label of an anchor milestone: {time} {tz} {date} {source}.

_exceptions: {}
_row_checks:
  VOL-I-6.2-02:
    activities:
    - assemble-envelope-a
    - form-4b
    basis: 'VOL-I 6.2 p3: ''The appearance of any price, rate, or other commercial information within Envelope A shall render the Proposal non-responsive.''
      assemble-envelope-a performs that check on every Envelope A document (its name: ''check that no price or commercial information appears
      (VOL-I 6.2)''); form-4b finalises the one Envelope A form that prints a price field (VOL-IV F4-B p4 ''Contract value (SAR equivalent)'';
      I-VOL-I-ENV-A-PRICES)'
  VOL-I-8.1-01:
    activities:
    - consortium-check
    basis: 'VOL-I 8.1: ''No change to the composition, shareholding or lead member of a prequalified consortium shall be effective without the
      prior written consent of the Authority.'' / ''An unapproved change shall result in rejection of the Proposal.'' The row is a status (no_deliverable),
      so a step confirms it before Form 4-A names the Bidder and lead member'
  VOL-IV-FORMS-01:
    activities:
    - form-4a
    - form-4b
    - form-4c-sign
    - pcg-wording
    - form-4e
    - form-4f
    - form-4g-sign
    basis: 'VOL-IV cover para 5: ''Forms shall be reproduced without alteration to their wording. A Bidder that alters the wording of a Form does
      so at its own risk.'' Each step that finalises a Form (and the PCG wording, which VOL-I 8.7 requires ''substantially in the form'' of Form
      4-D) checks that its wording is unaltered; the row is a rule on how each Form is reproduced (no_deliverable)'
    review: proposed
  VOL-I-4.1-01:
    activities:
    - clarifications
    basis: 'VOL-I 4.1: ''All communications between a Bidder and the Authority shall be made exclusively through the Portal and shall be in the
      English language, save where this Volume expressly requires Arabic.'' The clarification requests are the Bidder''s communications to the
      Authority in this programme (VOL-I 5.1: ''A Bidder may submit requests for clarification of the RFP Documents through the Portal'')'
    review: proposed
  VOL-I-5.5-01:
    activities:
    - ground-dd
    basis: 'VOL-I 5.5: ''Attendance at the site visit is optional and does not relieve a Bidder of its obligation to satisfy itself as to site
      conditions.'' ground-dd is the step in which the Bidder satisfies itself as to the ground conditions (its name)'
    review: proposed
  VOL-I-10.1-01:
    activities:
    - assemble-envelope-b
    basis: 'VOL-I 10.1: ''Envelope B shall contain only (a) Form 4-F (Financial Proposal Schedule) and (b) the Financial Model. No other document
      shall be placed in Envelope B.'' assemble-envelope-b assembles Envelope B (its name cites VOL-I 10.1) and so checks that rule; the Envelope
      A list (VOL-I 9.1) is not its rule (envelope_rules: B)'
    review: proposed
  VOL-I-1.4-01:
    activities:
    - consortium-check
    basis: 'VOL-I 1.4: ''A Proposal received from any other person shall be rejected without evaluation.'' (only a Bidder prequalified and named
      in Appendix 1 may submit); the same step confirms the Proposal is made in the prequalified name'
_volume_checks:
  VOL-V:
    activities:
    - deviations-review
    - form-4e
    basis: 'VOL-V Note to Bidders p2: the clauses ''on which the Authority invites comment through Form 4-E''; ''A deviation not listed in Form
      4-E will be taken as accepted.'' VOL-I 9.6: ''Form 4-E shall list every deviation, qualification or reservation to Volume V.'' The deviations
      review and Form 4-E check every clause of Volume V in force, so an amended clause (e.g. ADD-02 8.1 on VOL-V 36.2) means re-checking the
      schedule of deviations'
    review: proposed
_addenda_checks:
  form-4a-prep:
    rows:
    - ADD-01-AppA-01
    basis: 'ADD-01 App A: ''Form 4-A is reissued below to add the acknowledgement of Addenda at paragraph 1. Bidders shall use this version.''
      (field ''Addenda acknowledged (numbers)''); each Addendum''s cover: ''Bidders shall acknowledge receipt in Form 4-A.'' The numbers to acknowledge
      grow with every Addendum issued'
    review: proposed
  form-4a:
    rows:
    - ADD-01-AppA-01
    basis: 'as form-4a-prep: the signed Form 4-A must acknowledge every Addendum issued (''Bidders shall acknowledge receipt in Form 4-A.'')'
    review: proposed
_discipline_map:
  Commercial:
  - Commercial
  - Finance
  Technical:
  - Technical
  - Operations
  - Environmental
  - HSE
  Document control:
  - Bid management
_row_check_activities:
- id: consortium-check
  name: Confirm the Proposal is submitted by the Bidder prequalified and named in VOL-I Appendix 1, with no change to its composition, shareholding
    or lead member, or that the Authority's prior written consent to any change is held (VOL-I 1.4, 8.1)
  owner: Legal
  discipline: Legal
  resource: legal_counsel
  issuer: Bidder
  duration: consortium_confirmation
  predecessors: []
  successors:
  - form-4a-prep
_row_exceptions:
  VOL-I-4.2-01: 'A conduct rule, not a step: VOL-I 4.2 ''Breach of this Clause shall result in the disqualification of the Bidder.'' binds the
    Bidder and anyone acting for it from the date of issue of Volume I until the Preferred Bidder Notification (no_deliverable: ''nothing to submit'');
    no bid-programme activity discharges it'
  VOL-I-11.5-01: 'Arises only after submission: VOL-I 11.5 ''any response that does so shall render the Proposal non-responsive'' applies to a
    response to an Authority clarification request, which can come only after the Proposal Due Date (no_deliverable); outside this bid programme'
_per_overrides: {}
_milestones:
  labels:
    PRE-BID:
      short: Pre-Bid Conference {time}
      label: 'Pre-Bid Conference, {time} {tz} (VOL-I 5.4: attendance mandatory; whether the Bidder attended is NOT assumed)'
    CLARIFICATION-CUTOFF:
      short: Clarification cut-off
      label: 'Clarification cut-off: requests no later than ten Working Days before the PDD (VOL-I 5.2, as adjusted by ADD-01 2.2)'
    PDD:
      short: PDD {time}
      label: Proposal Due Date, {time} {tz} ({source}; late Proposals rejected unopened, VOL-I 6.6)
    ATTENDANCE-NOTICE:
      short: Attendance-notice window ends (conditional)
      conditional: true
      label: End of the window to notify an incorrectly recorded attendance (ADD-01 3.1; only if the Bidder considers its attendance incorrectly
        recorded)
    BID-BOND-VALIDITY:
      short: Bid bond validity end
      label: 'Bid Bond validity end: 180 days from the PDD (VOL-I 6.3; extended on demand if the Authority extends Proposal validity)'
    PROPOSAL-VALIDITY:
      short: Proposal validity end
      label: 'Proposal validity end: 150 days from the PDD (VOL-I 7.1)'
    ISO-CURRENT-AT:
      short: ISO current as at
      label: EPC Contractor's ISO 9001:2015 certificate must be current as at the PDD (VOL-I 8.3)
    REFERENCE-LOOKBACK:
      short: Reference look-back start
      label: Start of the ten-year look-back for reference plants' commercial operation (VOL-I 8.5 footnote 12)
    MODIFY-CUTOFF:
      short: Withdraw/modify cut-off
      label: Last moment to withdraw or modify the Proposal through the Portal (VOL-I 6.7)
    OMISSION-CLAIM-CUTOFF:
      short: Omission claims cut-off
      label: No claim for an alleged omission after the PDD (VOL-I 3.4)
    BLACKOUT-START:
      short: Blackout start
      label: Start of the communications blackout (VOL-I 4.2)
  derived:
    SITE-VISIT:
      from: PRE-BID
      calendar_days_after: 1
      short: Site visit (optional)
      source: VOL-I:5.5; ADD-01:AppB/item-6-site-visit
      label: 'Site visit offered ''on the day following the Pre-Bid Conference'' (VOL-I 5.5; the ADD-01 minutes, item 6: confirmed for the following
        day, attendance optional); derived date, no date rule in the register'
