# A1 register rows for VOL-V (Draft Project Agreement, extract). PROPOSED: drafted by the assistant; no row has been reviewed.
# Existing rows on VOL-V units stay in curation/register/rows.yaml (VOL-V-31.3-01, VOL-V-29.2-01) and are not repeated.
doc: VOL-V
prepared_by: "AI-assisted draft (register agent, session 05); not reviewed"
method: >-
  One row per independently testable term the Project Company must perform or bear after award (assessment
  contractual_post_award, no bid-stage deliverable), plus the one bid-stage obligation in the Note to Bidders
  (deviations in Form 4-E). Consequences of the Project Company's obligations (delay liquidated damages,
  availability deductions, termination, loss of relief) are quoted verbatim as class contractual from the unit that
  states them. Entitlements of the Project Company, duties and rights of the Authority, and definitions are
  dispositioned with a reason; where they contain a consequence word, a consequence_note says which row carries it.
  Events outside the pack (Effective Date, Notice to Proceed, PCOD, awareness of a Relief Event) are external date
  rules; deviations from Volume V must be listed in Form 4-E (VOL-I 9.6, row VOL-I-9.6-01).
rows:
  # ---------------------------------------------------------------- Note to Bidders (bid stage)
  - id: VOL-V-NOTE-01
    group: VOL-V:cover/note-to-bidders
    scope: [contract, deviations, bid_submission]
    requirement: "List every deviation from the Volume V clauses in Form 4-E; a deviation not listed is taken as accepted"
    units: ["VOL-V:cover/note-to-bidders"]
    discipline: Legal
    owner: Legal counsel
    assessment: procedural
    evidence: [EV-FORM-4E]
    interpretations:
      - stage: BASE
        quote: "This extract contains the clauses of the draft Project Agreement on which the Authority invites comment through Form 4-E."
        consequence: {class: lesser, unit: "VOL-V:cover/note-to-bidders", quote: "A deviation not listed in Form 4-E will be taken as accepted."}
        note: "VOL-I 9.6 (row VOL-I-9.6-01) requires Form 4-E to list every deviation, qualification or reservation to Volume V, and treats 'no deviations' with a qualification elsewhere as non-responsive. 'Omitted clauses are not reproduced' (I-VOL-V-MISSING). The concession-term conflict (I-CONCESSION) turns on this Note."
    confidence: high
    confidence_reason: "verbatim text-layer note"
    issues: [I-VOL-V-MISSING, I-CONCESSION]
  # ---------------------------------------------------------------- Clause 3: term
  - id: VOL-V-3.1-01
    group: VOL-V:3.1
    scope: [contract, post_award, term]
    requirement: "Agreement in force from the Effective Date for 25 years from the Effective Date, unless terminated earlier"
    units: ["VOL-V:3.1"]
    discipline: Legal
    owner: Legal counsel
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be obtained on execution, the Project Agreement executed by both
        parties, whose date of execution is the Effective Date (VOL-V 1.2) from which VOL-V 3.1 runs the 25-year term.'
      basis:
      - unit: VOL-V:3.1
        page: 2
        words: This Agreement shall come into force on the Effective Date and shall continue for a period of twenty-five
          (25) years from the Effective Date, unless terminated earlier in accordance with its terms.
      - unit: VOL-V:1.2
        page: 2
        words: Effective Date means the date of execution of this Agreement by both parties.
      when: on execution of the Project Agreement by both parties (the Effective Date)
      bid_stage_note: 'Decide now (I-CONCESSION): VOL-I 12.1 runs the 25-year concession from the Project Commercial
        Operation Date instead, and ADD-02 Q7 refers Bidders to the order of precedence at VOL-I 3.2 without amending
        either clause; Legal to decide the term start assumed in the Financial Model and whether to list it in Form
        4-E (VOL-I 9.6), since a deviation not listed is taken as accepted (VOL-V Note to Bidders).'
    date_rules:
      - {rule_id: VOL-V-TERM-END, kind: external, purpose: event, anchor: "Effective Date", offset: 25, unit: year, direction: after, source_unit: "VOL-V:3.1", text: "twenty-five (25) years from the Effective Date"}
    interpretations:
      - stage: BASE
        quote: "shall continue for a period of twenty-five (25) years from the Effective Date"
        parameters: {term_years: 25, from: "Effective Date"}
        note: "Effective Date: execution of the Agreement by both parties (VOL-V 1.2). VOL-I 12.1 states twenty-five years commencing on PCOD (I-CONCESSION)."
      - stage: ADD-02
        quote: "shall continue for a period of twenty-five (25) years from the Effective Date"
        parameters: {term_years: 25, from: "Effective Date"}
        note: "ADD-02 Q7: 'The order of precedence at Volume I Clause 3.2 applies. The Authority does not consider further amendment necessary at this stage.' Which start date governs is not answered; a deviation not listed in Form 4-E is taken as accepted (VOL-V Note)."
    confidence: medium
    confidence_reason: "verbatim, but conflicts with VOL-I 12.1 and the Authority declined to resolve it; the Effective Date is not a pack event"
    issues: [I-CONCESSION]
  - id: VOL-V-3.2-01
    group: VOL-V:3.2
    scope: [contract, post_award, handback]
    requirement: "On expiry, transfer the Facility to the Authority under Clause 42 for nil consideration"
    units: ["VOL-V:3.2"]
    discipline: Legal
    owner: Legal counsel
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced on expiry, a record of the transfer of the Facility to
        the Authority for nil consideration in accordance with Clause 42 (the extract prescribes no form of transfer
        document), supported by the handback records proposed under row VOL-V-42.1-01.'
      basis:
      - unit: VOL-V:3.2
        page: 2
        words: On expiry, the Facility shall transfer to the Authority in accordance with Clause 42 for nil consideration.
      when: on expiry of the term (the expiry date depends on the unresolved term start, I-CONCESSION)
      bid_stage_note: 'Price assumption: nothing is received for the Facility at expiry (''for nil consideration''),
        and the expiry date depends on the unresolved term start (I-CONCESSION).'
    interpretations:
      - stage: BASE
        quote: "On expiry, the Facility shall transfer to the Authority in accordance with Clause 42 for nil consideration."
    confidence: high
    confidence_reason: "verbatim; the expiry date depends on the term start (I-CONCESSION)"
    issues: [I-CONCESSION]
  # ---------------------------------------------------------------- Clauses 12 and 18: construction and delay
  - id: VOL-V-12.1-01
    group: VOL-V:12.1
    scope: [contract, post_award, programme, pcod]
    requirement: "Achieve PCOD within 36 months of the Notice to Proceed (the Scheduled PCOD)"
    units: ["VOL-V:12.1"]
    discipline: Technical
    owner: Technical lead
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be obtained at PCOD, the Independent Engineer''s certification that
        the Facility has satisfied Volume II Clause 7.2 (which fixes PCOD under VOL-V 1.5), dated within 36 months of
        the Notice to Proceed, with the Notice to Proceed itself kept to fix the Scheduled PCOD.'
      basis:
      - unit: VOL-V:12.1
        page: 2
        words: The Project Company shall achieve PCOD within thirty-six (36) months of the Notice to Proceed (the Scheduled
          PCOD).
      - unit: VOL-V:1.5
        page: 2
        words: PCOD means the date on which the Independent Engineer certifies that the Facility has satisfied the requirements
          of Volume II Clause 7.2.
      when: at PCOD; the Scheduled PCOD is 36 months after the Notice to Proceed (not a pack event)
      bid_stage_note: The construction programme in the Technical Proposal (Table 1-1 criterion B) needs to reach PCOD
        within 36 months of the Notice to Proceed; delay liquidated damages of SAR 180,000 for each day of delay, capped
        at 10% of the Estimated Project Cost (VOL-V 18.1, 18.4), are a pricing assumption.
    date_rules:
      - {rule_id: VOL-V-SCHEDULED-PCOD, kind: external, purpose: deadline, anchor: "Notice to Proceed", offset: 36, unit: month, direction: after, source_unit: "VOL-V:12.1", text: "within thirty-six (36) months of the Notice to Proceed"}
    interpretations:
      - stage: BASE
        quote: "shall achieve PCOD within thirty-six (36) months of the Notice to Proceed (the Scheduled PCOD)"
        parameters: {months_from_notice_to_proceed: 36}
        consequence: {class: contractual, unit: "VOL-V:18.1", quote: "the Project Company shall pay to the Authority delay liquidated damages at the rate of SAR 180,000 for each day of delay"}
        note: "Delay liquidated damages are the Authority's sole financial remedy for late completion, without prejudice to termination (18.2), capped at 10% of the Estimated Project Cost (18.4). PCOD: certified by the Independent Engineer against VOL-II 7.2 (VOL-V 1.5). The date rule records 36 months as 3 years (date rules have no month unit)."
    confidence: high
    confidence_reason: "verbatim; the Notice to Proceed is not a pack event, so the Scheduled PCOD cannot be dated"
  - id: VOL-V-18.3-01
    group: VOL-V:18.3
    scope: [contract, post_award, programme, pcod, termination]
    requirement: "Achieve PCOD within 365 days after the Scheduled PCOD, failing which the Authority may terminate under Clause 39.2"
    units: ["VOL-V:18.3"]
    discipline: Legal
    owner: Legal counsel
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be obtained, the Independent Engineer''s PCOD certification (VOL-V
        1.5) dated within 365 days after the Scheduled PCOD, the same record as row VOL-V-12.1-01, showing that the
        Authority''s termination right under Clause 39.2 has not arisen.'
      basis:
      - unit: VOL-V:18.3
        page: 2
        words: If PCOD has not been achieved within three hundred and sixty-five (365) days after the Scheduled PCOD,
          the Authority may terminate under Clause 39.2.
      - unit: VOL-V:39.2
        page: 4
        words: The Authority may terminate where PCOD is not achieved within the period stated in Clause 18.3.
      - unit: VOL-V:1.5
        page: 2
        words: PCOD means the date on which the Independent Engineer certifies that the Facility has satisfied the requirements
          of Volume II Clause 7.2.
      when: at PCOD, and no later than 365 days after the Scheduled PCOD
    date_rules:
      - {rule_id: VOL-V-PCOD-LONG-STOP, kind: external, purpose: deadline, anchor: "Scheduled PCOD", offset: 365, unit: calendar_day, direction: after, source_unit: "VOL-V:18.3", text: "within three hundred and sixty-five (365) days after the Scheduled PCOD"}
    interpretations:
      - stage: BASE
        quote: "If PCOD has not been achieved within three hundred and sixty-five (365) days after the Scheduled PCOD"
        parameters: {days_after_scheduled_pcod: 365}
        consequence: {class: contractual, unit: "VOL-V:18.3", quote: "the Authority may terminate under Clause 39.2"}
        note: "Restated as an Authority termination right in 39.2."
    confidence: high
    confidence_reason: "verbatim; the Scheduled PCOD depends on the Notice to Proceed, not a pack event"
  - id: VOL-V-12.2-01
    group: VOL-V:12.2
    scope: [contract, post_award, epc]
    requirement: "Have the EPC Contractor build on a fixed price, lump sum, date certain, turnkey basis with single point responsibility"
    units: ["VOL-V:12.2"]
    discipline: Commercial
    owner: Commercial lead
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced, the executed EPC Contract, showing that the construction
        works are let on a fixed price, lump sum, date certain, turnkey basis with single point responsibility (VOL-V
        12.2).'
      basis:
      - unit: VOL-V:12.2
        page: 2
        words: The Project Company shall procure that the EPC Contractor performs the construction works on a fixed
          price, lump sum, date certain, turnkey basis with single point responsibility.
      when: on execution of the EPC Contract; applies throughout the construction works
      bid_stage_note: Any departure from a single fixed price, lump sum, date certain, turnkey EPC contract (for example
        a split contract) would be a deviation to list in Form 4-E (VOL-I 9.6).
    interpretations:
      - stage: BASE
        quote: "shall procure that the EPC Contractor performs the construction works on a fixed price, lump sum, date certain, turnkey basis with single point responsibility"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  - id: VOL-V-12.3-01
    group: VOL-V:12.3
    scope: [contract, post_award, independent_engineer, cost]
    requirement: "Bear half of the Independent Engineer's reasonable costs (the Authority appoints the Independent Engineer)"
    units: ["VOL-V:12.3"]
    discipline: Commercial
    owner: Commercial lead
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced for each period in which Independent Engineer costs are
        incurred, a record of those reasonable costs and of payment of the Project Company''s equal share (VOL-V 12.3);
        the extract does not say how the costs are invoiced or shared between the parties.'
      basis:
      - unit: VOL-V:12.3
        page: 2
        words: The Authority shall appoint an Independent Engineer whose reasonable costs shall be borne equally by
          the parties.
      when: from the Authority's appointment of the Independent Engineer, as costs are incurred
      bid_stage_note: 'Price assumption: half of the Independent Engineer''s reasonable costs is a Project Company cost
        for the Financial Model; the pack gives no amount or estimate.'
    interpretations:
      - stage: BASE
        quote: "whose reasonable costs shall be borne equally by the parties"
        parameters: {project_company_share: "equal (half)"}
        note: "The appointment itself is an Authority duty."
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  - id: VOL-V-12.4-01
    group: VOL-V:12.4
    scope: [contract, post_award, reporting]
    requirement: "Submit monthly progress reports"
    units: ["VOL-V:12.4"]
    discipline: Technical
    owner: Technical lead
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced each month, the monthly progress report that VOL-V 12.4
        requires, with a record of the date it was submitted; the extract does not state the report''s content, its
        recipient, or when reporting starts and ends.'
      basis:
      - unit: VOL-V:12.4
        page: 2
        words: The Project Company shall submit monthly progress reports
      when: monthly (the clause sits under Clause 12, Construction; start and end are not stated)
    interpretations:
      - stage: BASE
        quote: "shall submit monthly progress reports"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  - id: VOL-V-12.4-02
    group: VOL-V:12.4
    scope: [contract, post_award, site_access]
    requirement: "Permit the Authority access to the site at all reasonable times"
    units: ["VOL-V:12.4"]
    discipline: Technical
    owner: Technical lead
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be kept, a site access log recording each Authority request for access
        and each visit, with the time and the access given, to show that access was permitted at all reasonable times
        (VOL-V 12.4); the clause itself prescribes no record.'
      basis:
      - unit: VOL-V:12.4
        page: 2
        words: shall permit the Authority access to the site at all reasonable times
      when: whenever the Authority seeks access (the clause sits under Clause 12, Construction; no end is stated)
    interpretations:
      - stage: BASE
        quote: "shall permit the Authority access to the site at all reasonable times"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  # ---------------------------------------------------------------- Clause 24: project accounts and reserves
  - id: VOL-V-24.1-01
    group: VOL-V:24.1
    scope: [contract, post_award, finance, accounts]
    requirement: "Open and keep the project accounts the Financing Documents require, with an account bank acceptable to the Senior Lenders"
    units: ["VOL-V:24.1"]
    discipline: Finance
    owner: Financial modeller
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced when the Financing Documents require the project accounts,
        the account bank''s confirmation that each required project account is open and the Senior Lenders'' acceptance
        of the account bank, with continued maintenance shown by the quarterly statements under VOL-V 24.4 (row VOL-V-24.4-01).'
      basis:
      - unit: VOL-V:24.1
        page: 2
        words: The Project Company shall open and maintain the project accounts required by the Financing Documents
          with an account bank acceptable to the Senior Lenders.
      - unit: VOL-V:1.4
        page: 2
        words: Financing Documents means the common terms agreement, the facility agreements, the security documents
          and every other document designated as such by the Senior Lenders.
      when: when the Financing Documents require the accounts to be opened, then for as long as they require them to
        be maintained
    interpretations:
      - stage: BASE
        quote: "shall open and maintain the project accounts required by the Financing Documents with an account bank acceptable to the Senior Lenders"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  - id: VOL-V-24.2-01
    group: VOL-V:24.2
    scope: [contract, post_award, finance, reserves]
    requirement: "Establish, maintain and fund the reserve accounts the Financing Documents require"
    units: ["VOL-V:24.2"]
    discipline: Finance
    owner: Financial modeller
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced, account statements showing each reserve account required
        by the Financing Documents established and funded to the level and at the time they require, cross-referenced
        to the Financing Documents'' requirement (VOL-V 24.2).'
      basis:
      - unit: VOL-V:24.2
        page: 3
        words: The Project Company shall establish and maintain such reserve accounts, and shall fund them to such levels
          and at such times, as are required under the Financing Documents.
      when: at the times the Financing Documents require; the levels and times are set by the Financing Documents, not
        by the Agreement
      bid_stage_note: Reserve sizing is left to the Financing Documents ('The Authority takes no position on the sizing
        of any reserve account.'), so reserve funding in the Financial Model is a financing assumption, not an Authority
        requirement.
    interpretations:
      - stage: BASE
        quote: "shall establish and maintain such reserve accounts, and shall fund them to such levels and at such times, as are required under the Financing Documents"
        note: "'The Authority takes no position on the sizing of any reserve account.'"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  - id: VOL-V-24.3-01
    group: VOL-V:24.3
    scope: [contract, post_award, finance, distributions]
    requirement: "No shareholder distribution unless the Financing Documents' conditions are met and no Unavailability Event is continuing"
    units: ["VOL-V:24.3"]
    discipline: Finance
    owner: Financial modeller
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced before each shareholder distribution, a record showing
        that the conditions to distribution in the Financing Documents are satisfied and that no Unavailability Event
        is continuing at the time (VOL-V 24.3).'
      basis:
      - unit: VOL-V:24.3
        page: 3
        words: The Project Company shall not make a distribution to its shareholders unless the conditions to distribution
          in the Financing Documents are satisfied and no Unavailability Event is continuing.
      when: before each distribution to shareholders
      bid_stage_note: 'Equity distribution timing in the Financial Model: distributions are also blocked while any Unavailability
        Event is continuing, in addition to the lenders'' conditions.'
    interpretations:
      - stage: BASE
        quote: "shall not make a distribution to its shareholders unless the conditions to distribution in the Financing Documents are satisfied and no Unavailability Event is continuing"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  - id: VOL-V-24.4-01
    group: VOL-V:24.4
    scope: [contract, post_award, finance, reporting]
    requirement: "Give the Authority quarterly statements of each project account"
    units: ["VOL-V:24.4"]
    discipline: Finance
    owner: Financial modeller
    assessment: contractual_post_award
    post_award_evidence:
      kind: proposed
      text: 'Post-award (proposed requirement): to be produced each quarter, a statement of each project account provided
        to the Authority, as VOL-V 24.4 requires, with a record of when it was provided.'
      basis:
      - unit: VOL-V:24.4
        page: 3
        words: The Project Company shall provide the Authority with quarterly statements of each project account.
      when: quarterly, once the project accounts are open
    interpretations:
      - stage: BASE
        quote: "shall provide the Authority with quarterly statements of each project account"
    confidence: high
    confidence_reason: "verbatim text-layer clause"
  # ---------------------------------------------------------------- Clause 29: payment mechanism
  - id: VOL-V-29.3-01
    group: VOL-V:29.3
    scope: [contract, post_award, payment, ramp_up, image]
    requirement: "Ramp-Up Period (12 months after PCOD): Availability Payment at the reduced percentage of the full rate stated in VOL-V 29.3; no availability deduction for Table 2-4 parameters assessed on a rolling average (a payment exception only: not an exemption from technical compliance or commissioning requirements)"
    units: ["VOL-V:29.3", "VOL-II:T2-4/BOD5", "VOL-II:T2-4/COD", "VOL-II:T2-4/TSS", "VOL-II:T2-4/TN", "VOL-II:T2-4/TP"]
    discipline: Commercial
    owner: Commercial lead
    assessment: contractual_post_award
    post_award_evidence:
      kind: not_applicable
      text: 'Not applicable: the Ramp-Up Period terms (payment at 90% of the full rate and no availability deduction
        for Table 2-4 parameters assessed on a rolling average) are a payment term and a limit on the Authority''s deductions,
        not an act the Project Company evidences, and they do not exempt the Facility from Table 2-4 compliance or the
        commissioning requirements, which are evidenced under their own rows.'
      basis:
      - unit: VOL-V:29.3
        page: 3
        words: During the first twelve (12) months after PCOD (the Ramp-Up Period) the Availability Payment shall be
          paid at ninety per cent (90%) of the full rate, and no availability deduction shall apply to a parameter listed
          in Table 2-4 as assessed on a rolling average basis.
      - unit: VOL-II:2.4
        page: 2
        words: The treated effluent shall at all times comply with the parameters set out in Table 2-4.
      - unit: VOL-II:T2-4
        page: 3
        words: compliance assessed as a 30-day rolling average unless stated
      reason: VOL-V 29.3 sets how much the Authority pays in the first twelve months after PCOD and which deductions
        it does not apply; the Project Company performs nothing under it. The effluent must still comply 'at all times'
        with Table 2-4 (VOL-II 2.4), and PCOD still requires the VOL-II 7.2 reliability run; those obligations carry
        their own evidence (rows VOL-V-31.1-02, VOL-II-2.4-01, VOL-II-7.2-01). Which parameters are assessed on a rolling
        average comes from the Table 2-4 basis column (BOD5, COD, TSS, TN, TP as read; I-READING-T24).
      bid_stage_note: 'Price assumption: the Financial Model should reflect payment at the reduced rate VOL-V 29.3 states
        for the first twelve months after PCOD (85% of the full rate from ADD-03 6.1; 90% as issued); on the Table 2-4 reading, deductions can still apply in that period to parameters
        with another stated basis (turbidity, faecal coliforms, oil and grease, and residual chlorine and pH, whose
        interaction with the table''s rolling-average qualifier is unresolved).'
    date_rules:
      - {rule_id: VOL-V-RAMP-UP-END, kind: external, purpose: event, anchor: "PCOD", offset: 12, unit: month, direction: after, source_unit: "VOL-V:29.3", text: "the first twelve (12) months after PCOD"}
    interpretations:
      - stage: BASE
        quote: "During the first twelve (12) months after PCOD (the Ramp-Up Period) the Availability Payment shall be paid at ninety per cent (90%) of the full rate"
        parameters: {ramp_up_months: 12, payment_pct_of_full_rate: 90, rolling_average_parameters_as_read: [BOD5, COD, TSS, TN, TP]}
        note: "The exception is to availability deductions only: the effluent must still comply 'at all times' with Table 2-4 (VOL-II 2.4, row VOL-II-2.4-01) and the commissioning and performance requirements still apply; nothing here exempts the plant from them. 'no availability deduction shall apply to a parameter listed in Table 2-4 as assessed on a rolling average basis': which parameters that is comes from the Table 2-4 basis column (image reading, transcription confirmed by the owner, 3 Oct 2026); those five table rows are listed as units."
      - stage: ADD-01
        quote: "During the first twelve (12) months after PCOD (the Ramp-Up Period) the Availability Payment shall be paid at ninety per cent (90%) of the full rate"
        parameters: {ramp_up_months: 12, payment_pct_of_full_rate: 90, rolling_average_parameters_as_read: [BOD5, COD, TSS, TN, TP]}
        note: "ADD-01 Q6: offtake volume is not guaranteed; the payment mechanism is availability based and does not depend on volume delivered. No change to this row."
      - stage: ADD-02
        quote: "During the first twelve (12) months after PCOD (the Ramp-Up Period) the Availability Payment shall be paid at ninety per cent (90%) of the full rate"
        parameters: {ramp_up_months: 12, payment_pct_of_full_rate: 90, rolling_average_parameters_as_read: [BOD5, COD, TSS, TN, TP]}
        note: "ADD-02 5.1 amends the TN limit to 3 mg/l 'assessed on the same basis' (30-day rolling average as read); the payment terms of this clause are unchanged."
      - stage: ADD-03
        quote: During the first twelve (12) months after PCOD (the Ramp-Up Period) the Availability Payment shall be paid
          at eighty-five per cent (85%) of the full rate
        parameters:
          ramp_up_months: 12
          payment_pct_of_full_rate: 85
          rolling_average_parameters_as_read:
          - BOD5
          - COD
          - TSS
          - TN
          - TP
        note: 'Re-made at ADD-03 by the curator of blind rehearsal 03. ADD-03 6.1: ''ninety per cent (90%)'' is replaced
          by ''eighty-five per cent (85%)''; ''The duration of the Ramp-Up Period is unchanged.'' (op ADD-03/6.1(b)).
          ADD-03 5.1 amends the TP limit on the same 30-day rolling-average basis, so TP stays among the parameters without
          Ramp-Up deductions. The cover summary does not mention this change (I-ADD03-COVER).'
    confidence: medium
    confidence_reason: "verbatim clause; the parameters exempt from Ramp-Up deductions come from an image reading (transcription confirmed by the owner, 3 Oct 2026); PCOD is not a pack event"
    issues: [I-READING-T24]
