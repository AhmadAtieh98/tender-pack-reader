        quote: "Bidders shall acknowledge receipt in Form 4-A."
        note: "App A reissues Form 4-A 'to add the acknowledgement of Addenda at paragraph 1', but the reissued form has no paragraph 1; it has an 'Addenda acknowledged (numbers)' field. No consequence stated; whether a missing acknowledgement makes Form 4-A 'improperly executed' (VOL-I 9.3) is for a person."
      - stage: ADD-02
        quote: "Bidders shall acknowledge receipt in Form 4-A."
        note: "ADD-02's cover repeats 'Bidders shall acknowledge receipt in Form 4-A.' and does not reissue the form; the ADD-01 App A version remains the one to use."
