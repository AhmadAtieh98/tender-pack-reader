# A1 register rows for obligations that the addenda create themselves (Stage 3). PROPOSED: drafted by the register
# agent, session 05. No row has been reviewed or accepted by a person. Rows already held in
# curation/register/rows.yaml (ADD-01-3.1-01, ADD-02-7.2-01, ADD-02-F4G-01 for Form 4-G items 3-6) are not repeated.
# The BASE stage does not exist for these units: each row's first interpretation is at its addendum's stage.
doc: ADD
prepared_by: "AI-assisted draft (register agent, session 05); not reviewed"
method: >-
