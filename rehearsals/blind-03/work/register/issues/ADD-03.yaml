# Issues raised curating ADD-03 of blind rehearsal 03 (synthetic; PROPOSED; the assistant as curator, session 09, after
# reviewing the host-route AI proposal). Issues are never resolved by the program; a person decides each one.
issues:
  I-ADD03-CONSENT-DATE:
    theme: programme
    owner: Legal counsel
    show_in_a3: true
    short: 'O&M Operator consent application: 3.2 gives 19 November 2026 (closure not counted), Q17 says 22 November 2026'
    a3: 'ADD-03 3.2 vs Q17: apply for consent to admit the O&M Operator four Working Days before the PDD (Thu 19 Nov with the
      22 Nov closure not counted) or by Sun 22 Nov (Q17, the closure day); planned to the earlier'
    text: 'Two deadlines for one application in the same Addendum. ADD-03 3.2: not later than four (4) Working Days before
      the Proposal Due Date (Thursday 26 November 2026), which with Sunday 22 November 2026 notified as a closure under
      VOL-I 2.4 as amended (ADD-03 2.1-2.2) is Thursday 19 November 2026 (Sunday 22 November without the closure). ADD-03
      Q17: not later than Sunday 22 November 2026, the closure day itself (the Portal stays available). The Addendum does
      not say which prevails. The programme plans to the earlier date; which governs is for a person (draft question
      CQ-ADD03-CONSENT-DATE). An unapproved change in the consortium results in rejection (VOL-I 8.1).'
  I-ADD03-CLOSURE:
    theme: programme
    owner: Bid manager
    show_in_a3: true
    short: 'Office closure on 22 November 2026 is a non-Working Day: the clarification cut-off moves to 11 November'
    a3: 'ADD-03 2.1-2.2: 22 Nov 2026 is not a Working Day; the VOL-I 5.2 cut-off moves to Wed 11 Nov (was 12 Nov); the cover
      says the closure affects no deadline'
    text: 'ADD-03 2.1 widens the VOL-I 2.4 definition of Working Day to exclude a day the Authority notifies in an Addendum
      as an office closure, and 2.2 notifies Sunday 22 November 2026 (the Portal remains available). Every Working-Day period
      that runs across that day moves: the VOL-I 5.2 clarification cut-off (ten Working Days before Thursday 26 November
      2026) becomes Wednesday 11 November 2026 instead of Thursday 12 November, and ADD-03 3.2 gives Thursday 19 November
      2026. The cover says ''The closure of the Authority''s offices does not affect any deadline under the RFP Documents.'';
      the cover is a summary and is never applied. The programme follows the operative provisions (the earlier dates);
      whether the Authority meant the cover sentence is for a person (draft question CQ-ADD03-CLOSURE).'
  I-ADD03-OM-MEMBER:
    theme: forms
    owner: Bid manager
    show_in_a3: true
    short: 'O&M Operator must be a member of the Bidder and hold 10% until two years after PCOD'
    a3: 'ADD-03 3.1-3.4: the O&M Operator must be a member of the Bidder (10% of the Project Company to the 2nd anniversary
      of PCOD); if not, consent under VOL-I 8.1 (rejection if unapproved)'
    text: 'ADD-03 3.1 adds to VOL-I 8.8 that the proposed O&M Operator shall be a member of the Bidder and shall hold, from
      Financial Close until the second anniversary of PCOD, at least 10% of the shares in the Project Company. If it is not
      a member, the Bidder notifies its intention (3.3, within five Working Days of 1 November 2026) and applies for the
      Authority''s consent under VOL-I 8.1 (3.2, see I-ADD03-CONSENT-DATE); if it ceases to be a member before the Preferred
      Bidder Notification, notice within two Working Days (3.4). Whether the proposed O&M Operator is already a member, and
      the shareholding, are bidder facts for a person; an unapproved change in composition or shareholding results in
      rejection (VOL-I 8.1).'
  I-ADD03-F4C-UNDERTAKING:
    theme: forms
    owner: Legal counsel
    show_in_a3: true
    short: 'Form 4-C new declaration 4: notify changes within three working days; breach leads to exclusion'
    a3: 'Form 4-C declaration 4 as substituted (ADD-03 4.2): notify any change to Proposal information within three working
      days until the PBN; any breach ''leads to exclusion''; the English translation says three days'
    text: 'The substituted fourth declaration (ADD-03 4.2, Arabic, governing) adds an undertaking to notify the Authority
      through the Portal within three working days (خلال ثلاثة أيام عمل) of becoming aware of any change to any of the
      information in the Proposal before the Preferred Bidder Notification; any breach of the undertaking, like an incorrect
      statement, leads to the exclusion of the Proposal. The convenience translation (ADD-03 4.3) says ''within three (3)
      days''; the Arabic governs (4.3, VOL-I 9.4). Every member gives the substituted declaration (4.4). The programme plans
      a change watch with the shorter reading as the internal target; ''exclusion'' stays its own category (I-F4C-EXCLUSION).'
  I-ADD03-F4G-ITEM7:
    theme: forms
    owner: Technical lead
    show_in_a3: false
    short: 'Reissued Form 4-G adds undertaking 7 (security screening), not mentioned in 7.1 or on the cover'
    text: 'ADD-03 7.1 says the reissued Form 4-G ''provides for its countersignature by the proposed O&M Operator''. The form
      at Appendix A also adds undertaking 7: personnel with privileged or remote access to the control system subject to
      security screening approved by the Authority before access is granted. Neither 7.1 nor the cover mentions it. Items 1
      to 6 are word for word as in ADD-02. Which screening the Authority approves is not stated; the effect of a ''No'' answer
      is still not stated (I-F4G-NO).'
  I-ADD03-Q15:
    theme: forms
    owner: Legal counsel
    show_in_a3: false
    short: 'English translation of Form 4-C now required from members incorporated outside the Kingdom (set in an answer)'
    text: 'ADD-03 Q15 amends the response to clarification request 9 in ADD-02: a member incorporated outside the Kingdom
      shall attach an English translation to its Form 4-C (for other members it stays optional under VOL-I 9.4). A substantive
      requirement set in a clarification answer; no consequence is stated for a missing translation, and whether a Form 4-C
      without it is ''complete'' under VOL-I 9.4 is for a person. Which members are incorporated outside the Kingdom is a
      bidder fact (the planning assumption counts the foreign member).'
  I-ADD03-COVER:
    theme: addenda
    owner: Bid manager
    show_in_a3: false
    short: 'ADD-03 cover summary: understates the closure and omits several changes (C28)'
    text: 'The ADD-03 cover summary is never applied. Against the provisions: it says the closure ''does not affect any
      deadline'', but 2.1-2.2 make 22 November 2026 a non-Working Day (the VOL-I 5.2 cut-off moves to 11 November; 3.2 gives
      19 November) and Q17 sets a deadline on that day (I-ADD03-CLOSURE); it mentions the deletion of VOL-V 31.4 but not of
      39.3 (6.2); it omits the Ramp-Up payment change in VOL-V 29.3 (90% to 85%, 6.1), the 10% shareholding lock-in of the
      O&M Operator (3.1) and the notices of 3.3-3.4, the new undertaking and its consequence in the substituted Form 4-C
      declaration (4.2), the new Form 4-G undertaking 7 and the treatment of an uncountersigned Form 4-G as not submitted
      (7.2), and the amendment of the ADD-02 response to request 9 (Q15).'
