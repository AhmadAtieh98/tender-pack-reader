    forward_count: the day of the event / issue is not counted (general convention; the pack states only the backward rule). Accept the other convention only if the tool states it.
    validity: PDD + N calendar days (accept PDD as day 1, one day earlier, if stated)
  page_map:
    1: [cover band (ADDENDUM NO. 3 / Issued 1 November 2026 / Tender NUPA/ISTP/2026/014), project line, cover summary (planted errors E1 and E2), precedence paragraph, "1 RECITALS 1.1-1.2", "2 WORKING DAYS AND CLOSURE 2.1-2.2", "3 MEMBERSHIP OF THE O&M OPERATOR 3.1-3.4", "4 AMENDMENT TO FORM 4-C: 4.1 + Arabic text of the fourth declaration as issued"]
    2: ["4.2 + Arabic substituted fourth declaration", "4.3 + English translation (convenience)", "4.4", "5 TABLE 2-4: 5.1-5.2", "6 VOLUME V: 6.1-6.2", "7 REISSUED FORM 4-G: 7.1-7.2", "8 Q&A grid header + Q15, Q16, Q17"]
    3: ["Q&A grid continued (header repeated): Q18, Q19"]
    4: ["APPENDIX A - REISSUED FORM 4-G: items 1-7 (item 7 new), Bidder signature line, O&M Operator countersignature line"]

