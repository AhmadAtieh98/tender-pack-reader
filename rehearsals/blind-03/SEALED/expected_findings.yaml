    page: 2
    kind: conflicting deadline, the designated genuine ambiguity (A1)
    text: "An application for consent to the admission of the proposed O&M Operator as a member of a Bidder shall be submitted through the Portal not later than Sunday 22 November 2026."
    conflict_with: "3.2: four (4) Working Days before the PDD = Thursday 19 November 2026"
    notes:
      - 22 Nov 2026 is the closure day notified in 2.2 (Portal open); Q17 matches a count that ignores the closure
      - both statements are in ADD-03; VOL-I 3.2(a) ranks Addenda by date only and says nothing about conflicts inside one Addendum; VOL-I 3.3 says raise it as a clarification and resolve it unilaterally at the Bidder's own risk
      - the question asks about any additional member; the answer covers only the O&M Operator. No deadline is given for other composition changes
    expected: escalate to a human; cite both; do not pick one as binding. Planning on 19 Nov 2026 as a labelled conservative assumption is acceptable
  Q18:
    page: 3
    kind: consequential confirmation
    with_effect: none beyond 6.2 (do not count a second deletion; do not treat as a change to 31.4 text)
  Q19:
    page: 3
    kind: confirmation (restates VOL-I 9.4)
    with_effect: none. Each member signs its own Form 4-C; the lead member cannot sign for all

