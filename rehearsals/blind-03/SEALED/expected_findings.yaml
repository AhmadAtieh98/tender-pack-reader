    kind: DECOY (restatement of VOL-II 9.4)
    with_effect: none. VOL-II 9.4 already prohibits any abstraction from the local aquifer; 'whether or not it is treated' adds nothing
    if_read_as_change: a false 'new obligation from ADD-03' (must-not-report T3)
