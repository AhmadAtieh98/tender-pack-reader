cover_summary:
  text: >-
    This Addendum amends the definition of Working Day and notifies a closure of the Authority's offices,
    requires the proposed O&M Operator to be a member of the Bidder, replaces the fourth declaration in Form 4-C,
    amends Volume II Table 2-4, deletes Volume V Clause 31.4, reissues Form 4-G, and responds to clarification
    requests 15 to 19. The closure of the Authority's offices does not affect any deadline under the RFP Documents.
  planted_errors:
    E1_misleading_statement:
      quote: "The closure of the Authority's offices does not affect any deadline under the RFP Documents."
      truth: >-
        False. Under VOL-I 2.4 as amended (ADD-03 2.1) Sunday 22 November 2026 is not a Working Day. The VOL-I 5.2
        clarification cut-off (10 Working Days before Thu 26 Nov 2026, stated date not counted) moves from
        Thursday 12 November 2026 to Wednesday 11 November 2026. The new ADD-03 3.2 deadline (4 Working Days before
        the PDD) is Thursday 19 November 2026, not Sunday 22 November 2026. The PDD itself is unaffected.
      detect_by: recomputing every Working-Day period counted from the PDD with the closure day excluded
      mechanism_note: different from blind-02 E1 (there a direct time amendment contradicted the cover; here the change is derived through a definition and is stated nowhere)
    E2_omission:
      omitted: "ADD-03 6.1: VOL-V 29.3 Ramp-Up payment rate 90% -> 85%"
      why_it_hides: section 6 is headed 'AMENDMENTS TO VOLUME V' and the cover lists only 'deletes Volume V Clause 31.4', so a reader expects section 6 to be the deletion only
      impact: commercial (Availability Payment in the first 12 months after PCOD, Financial Model, Form 4-F pricing)
  secondary_undisclosed_effects:   # not itemised on the cover; scored separately from E1/E2
    - S1: VOL-I 5.2 cut-off moves Thu 12 Nov 2026 -> Wed 11 Nov 2026 (consequence of 2.1 + 2.2; stated nowhere)
    - S2: 3.1 also imposes a shareholding lock-in (>= 10% of the Project Company from Financial Close to the second anniversary of PCOD); the cover says only 'member'
    - S3: new procedural obligations 3.2 (consent application, Thu 19 Nov 2026), 3.3 (notice of intention, Sun 8 Nov 2026), 3.4 (2 Working Days notice if the O&M Operator ceases to be a member)
    - S4: VOL-V 39.3 deleted consequentially (in 6.2)
    - S5: Form 4-G item 7 (new undertaking on security screening) appears only in Appendix A; narrative 7.1 mentions only the countersignature
    - S6: Form 4-G without the O&M Operator countersignature is 'treated as not submitted' -> non-responsive via ADD-02 7.2
    - S7: ADD-02 response 9 amended by Q15 (mandatory English translation of Form 4-C for members incorporated outside the Kingdom)
    - S8: the substituted Arabic fourth declaration adds a post-submission notification undertaking (3 Working Days, until the Preferred Bidder Notification) with exclusion for breach
    - S9: "knock-ons of O&M membership: a Form 4-C (Arabic, substituted fourth declaration) is then required from the O&M Operator (VOL-I 9.4 'each member'); VOL-I 8.2 single participation applies to it as a member; VOL-I 8.4 combined financial standing is weighted by shareholding and now includes it; VOL-I 8.1 consent is needed to admit it"
    - S10: "TP knock-ons: VOL-II 3.1 process design, VOL-II 7.2/7.3 reliability run (0.5 mg/l must be met; failure restarts the run), VOL-V 31.1(b) Unavailability Event above 0.5 mg/l (30-day rolling average); VOL-V 29.3 second limb (no deduction during the Ramp-Up Period for rolling-average parameters) covers TP"

