      - {rule_id: VOL-V-TERM-END, kind: external, purpose: event, anchor: "Effective Date", offset: 25, unit: year, direction: after, source_unit: "VOL-V:3.1", text: "twenty-five (25) years from the Effective Date"}
    interpretations:
      - stage: BASE
        quote: "shall continue for a period of twenty-five (25) years from the Effective Date"
        parameters: {term_years: 25, from: "Effective Date"}
        note: "Effective Date: execution of the Agreement by both parties (VOL-V 1.2). VOL-I 12.1 states twenty-five years commencing on PCOD (I-CONCESSION)."
      - stage: ADD-02
        quote: "shall continue for a period of twenty-five (25) years from the Effective Date"
        parameters: {term_years: 25, from: "Effective Date"}
        note: "ADD-02 Q7: 'The order of precedence at Volume I Clause 3.2 applies. The Authority does not consider further amendment necessary at this stage.' Which start date governs is not answered; a deviation not listed in Form 4-E is taken as accepted (VOL-V Note)."
    confidence: medium
    confidence_reason: "verbatim, but conflicts with VOL-I 12.1 and the Authority declined to resolve it; the Effective Date is not a pack event"
    issues: [I-CONCESSION]
  - id: VOL-V-3.2-01
