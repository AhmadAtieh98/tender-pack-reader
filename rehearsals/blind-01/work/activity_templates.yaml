  - {id: fin-assumptions, name: "Prepare the schedule of principal financing assumptions to accompany Form 4-F (VOL-I 10.6)", owner: Commercial, resource: commercial_manager, issuer: Bidder, duration: fin_assumptions_schedule, predecessors: [fin-model-freeze], successors: [assemble-envelope-b], item: "Schedule of principal financing assumptions"}
