        to: "COD on or after 10 December 2016 (window 10 Dec 2016 - 10 Dec 2026)"
        note: "The window START moves LATER. A plant with COD between 26 Nov 2016 and 9 Dec 2016 qualified under ADD-01 and no longer does."
