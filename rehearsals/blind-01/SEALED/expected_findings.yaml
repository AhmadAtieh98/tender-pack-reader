      the communication rules in Volume I Clause 4.2. Fields: member name, CR number, signatory, capacity, date,
      signature and seal. Arabic note: form must be submitted in Arabic by each consortium member; failure to
      submit it complete makes the proposal non-responsive.
    new_text_english_only: "Sixth: that neither the member nor any of its directors has, within the preceding five (5) years, been convicted in the Kingdom of an offence involving fraud, bribery or corruption."
    effect: new requirement (sixth declaration by every member)
