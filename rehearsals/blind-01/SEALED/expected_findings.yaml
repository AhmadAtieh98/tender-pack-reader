  pages: 3
  addendum_number: 3
  tender: NUPA/ISTP/2026/014
  issue_date_printed: "Issued 5 November 2026"
  issue_date_iso: "2026-11-05"          # Thursday (ADD-01 8 Oct and ADD-02 22 Oct 2026 are also Thursdays)
  numbered_sections: 13                  # sections 1-12 amend/recite, 13 = Q&A
  sub_provisions: ["1.1", "1.2", "2.1", "2.2", "2.3", "3.1", "3.2", "4.1", "5.1", "6.1", "7.1",
                   "8.1", "8.1-quoted-10.5", "8.2", "9.1", "9.2", "10.1", "11.1", "11.2", "12.1", "12.2"]
