      - {doc: VOL-IV, ref: "Form 4-C introduction", page: 5}
      - {doc: VOL-I, ref: "Clause 9.4", page: 5}
    change_type: amendment of an image-only Arabic form by English text, without reissuing the form
    existing_form_content_from_image: >-
      Five numbered Arabic declarations: (1) no actual or potential conflict of interest with the Authority or its
      advisers; (2) the company has not participated directly or indirectly in more than one proposal; (3) not on,
      and not within the previous five years on, any government debarment list in the Kingdom; (4) all information
