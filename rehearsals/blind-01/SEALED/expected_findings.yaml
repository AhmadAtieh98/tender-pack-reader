# SEALED ANSWER KEY -- Addendum No. 3 (blind fixture blind01)
# Written by the independent test author BEFORE any system processed ADD-03_Addendum_No_3.pdf.
# Sources read: VOL-I, VOL-II, VOL-IV, VOL-V, ADD-01, ADD-02 (candidate_pack), the Round 2 brief,
# and the 2026-10-02 hiring reply. Nothing else in the repository was read.
#
# Page numbers: "page" for pack documents = the page number printed in that document's footer
# (identical to the 1-based PDF page index). "add03_page" = page of ADD-03 where the provision sits.

schema_version: 1

