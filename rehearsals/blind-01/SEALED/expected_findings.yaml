    page_2: ["7", "8", "9", "10", "11", "12", "13 (Q15-Q17)"]
    page_3: ["13 (Q18-Q20, header row repeated)"]

conventions:
  working_day: >-
    VOL-I Clause 2.4 (page 2): Sunday to Thursday inclusive, excluding public holidays declared in the
    Kingdom; when counting a Working-Day period backwards from a stated date, the stated date is NOT counted.
  public_holidays_assumed: >-
    None between 5 November 2026 and 10 December 2026 (the pack is silent; Saudi fixed/Eid public holidays
    fall outside this window). If a holiday were declared, the 5.2 cut-off moves one Working Day earlier per
    holiday falling inside the counted span.
  calendar_day_periods: >-
    Pack is silent on calendar-day counting. Primary convention used here: "N days from the Proposal Due Date"
    = PDD + N calendar days (PDD is day 0). Alternative (PDD counted as day 1) shown where it changes the date.
    Neither convention is wrong; a correct system states which it used.
  planning_date: >-
    2026-11-05 (latest addendum date), per the hiring team's reply of 2 Oct 2026 ("Use the latest addendum date
    as the planning date").

baseline_before_add03:          # state of the pack after ADD-01 and ADD-02 (what ADD-03 starts from)
  proposal_due_date: "14:00 Riyadh time, Thursday 26 November 2026 (VOL-I 6.1 as amended by ADD-01 2.1)"
  clarification_cutoff: "Thursday 12 November 2026 (10 WD before 26 Nov 2026; no time of day stated)"
  bid_bond_amount: "SAR 4,500,000 (VOL-I 6.4)"
  bid_bond_validity_end: "Tuesday 25 May 2027 (26 Nov 2026 + 180 days)"
  proposal_validity_end: "Sunday 25 April 2027 (26 Nov 2026 + 150 days)"
  footnote12: "2 reference STPs, each >= 80,000 m3/day, COD within 10 years preceding PDD (on/after 26 Nov 2016)"
  local_content: "VOL-I 8.6 as reinstated by ADD-02 9.1: >= 35%, failure to submit -> non-responsive"
  fc_period: "270 days after Preferred Bidder Notification (VOL-I 12.2; ADD-02 Q13 said unchanged)"
  table_2_4_TSS: "10 mg/l, 30-day rolling average (image only, VOL-II page 3)"
  table_2_4_TN: "3 mg/l, 30-day rolling average (ADD-02 5.1; image shows 5)"
  table_2_6_peak_hourly: "7,500 m3/h (row 2-6.2, VOL-II page 3)"
  control_room: "permanently manned (VOL-II 6.1)"
  copies: "1 marked original + 3 hard copies + 1 encrypted USB (VOL-I 6.5)"

cover_text:
  add03_page: 1
  printed:
    header_left: "Addendum No. 3"
    header_right: "NUPA/ISTP/2026/014"
    cover_band: ["ADDENDUM NO. 3", "Issued 5 November 2026", "Tender NUPA/ISTP/2026/014"]
    project: "Wadi Sirhan Independent Sewage Treatment Plant"
    summary: >-
      This Addendum amends the Proposal Due Date, the clarification period, the Bid Bond amount and the number of
      copies to be submitted, amends footnote 12 to Volume I Clause 8.5 and Volume I Clauses 8.6 and 12.2, inserts a
      new Volume I Clause 10.5, amends Volume II Tables 2-4 and 2-6 and Form 4-C, and responds to clarification
      requests 15 to 20.
    standard_paragraph: >-
      This Addendum forms part of the RFP Documents and takes precedence in accordance with Volume I Clause 3.2.
      Bidders shall acknowledge receipt in Form 4-A. All other terms of the RFP Documents remain unchanged.
  effects:
    - "Precedence: ADD-03 > ADD-02 > ADD-01 > VOL-I > VOL-V > VOL-II > VOL-IV > VOL-III (VOL-I 3.2, page 2)."
    - "Form 4-A acknowledgement must now cover Addenda 1 to 3 (existing obligation, extended; no new consequence)."
    - "Planning date for the programme becomes 2026-11-05."
  traps:
    - trap: "The summary is NOT exhaustive."
      correct: >-
        It omits: 2.3 (correction of ADD-01 Appendix A), 3.2 (time of day added to cut-off), 8.2 (renumbering of
        10.5/10.6 and re-pointing of ADD-02 Q14), 9.2 (ADD-02 Q13 superseded), the substantive amendment of VOL-II
        Clause 6.1 made inside the answer to Q16, and the new restriction on affiliate references in Q17. A correct
        system takes its change list from the body and the Q&A table, not from the summary.

provisions:

  - number: "1.1"
    add03_page: 1
    text: "This Addendum is issued under Volume I Clause 5.3 and takes precedence over Addenda Nos. 1 and 2 in accordance with Volume I Clause 3.2."
    targets: [{doc: VOL-I, ref: "Clause 3.2(a)", page: 2}, {doc: VOL-I, ref: "Clause 5.3", page: 3}]
    change_type: recital / precedence statement
    effect: no change to any requirement
    no_effect: true
    no_effect_reason: "Restates VOL-I 3.2(a) (later Addendum prevails). Only the precedence chain gains ADD-03."

  - number: "1.2"
    add03_page: 1
    text: "A reference in this Addendum to a Clause, Table or Form is to that Clause, Table or Form as amended by Addenda Nos. 1 and 2, unless otherwise stated."
    change_type: interpretation rule
    effect: no change to any requirement
    no_effect: true
    no_effect_reason: >-
      Interpretive only. It confirms that e.g. "Volume I Clause 6.1" means 6.1 as amended by ADD-01 and "Table 2-4"
      means Table 2-4 with TN = 3 mg/l (ADD-02). Useful for resolving 2.1 and 10.1; creates no register row.

  - number: "2.1"
    add03_page: 1
    targets:
      - {doc: VOL-I, ref: "Clause 6.1", page: 3}
      - {doc: ADD-01, ref: "Section 2.1", page: 1}
    change_type: date substitution in text already amended by an earlier addendum (amendment chain)
    old: "Thursday 26 November 2026"      # the text of 6.1 as amended by ADD-01; VOL-I itself prints 'Thursday 12 November 2026'
    new: "Thursday 10 December 2026"
    unchanged: "The time of 14:00 Riyadh time is unchanged."
    effect: amended requirement (submission deadline)
    consequence:
      category: rejection (rejected unopened)
      source: {doc: VOL-I, ref: "Clause 6.6", page: 3}
      quote: "A Proposal received after the time stated in Clause 6.1 will be rejected unopened and returned to the Bidder."
    dates_moved:
      - item: Proposal Due Date
        from: "14:00 Riyadh, Thursday 26 November 2026"
        to: "14:00 Riyadh, Thursday 10 December 2026"
        arithmetic: "+14 calendar days, +10 Working Days"
      - item: "Last moment to withdraw/modify a Proposal (VOL-I 6.7, page 3)"
        to: "before 14:00 Riyadh, Thursday 10 December 2026"
    a3_change: "Late-submission line: deadline becomes 14:00 Riyadh time, Thursday 10 December 2026 (VOL-I 6.1/6.6)."
    programme_impact: >-
      Every activity scheduled backwards from the deadline shifts by 14 calendar days. From the planning date
      (Thu 5 Nov 2026) there are 35 calendar days to submission: 24 full Working Days (Sun 8 Nov - Wed 9 Dec)
      plus the morning of Thu 10 Dec. Physical delivery to Tender Box 4, Ground Floor, Administrative Building C,
      Sakaka (VOL-I Appendix 3, page 7) by 14:00.
    traps:
      - trap: "'Thursday 26 November 2026' does not occur in VOL-I; VOL-I 6.1 prints 'Thursday 12 November 2026'."
        correct: "Resolve through the chain VOL-I 6.1 -> ADD-01 2.1 -> ADD-03 2.1. Final value 10 Dec 2026, 14:00. Not a failed edit."
      - trap: "Appendix 3 marking 'NOT TO BE OPENED BEFORE 14:00 ON THE PROPOSAL DUE DATE' (VOL-I page 7)."
        correct: "Unchanged text; it is defined by reference to the PDD so it now means 10 Dec 2026."

  - number: "2.2"
    add03_page: 1
    text: "Section 2.2 of Addendum No. 1 applies mutatis mutandis to the amendment made by Section 2.1 of this Addendum."
    targets:
      - {doc: ADD-01, ref: "Section 2.2", page: 1}
      - {doc: VOL-I, ref: "Clause 5.2", page: 3}
      - {doc: VOL-I, ref: "Clause 6.3", page: 3}
      - {doc: VOL-I, ref: "Clause 7.1", page: 4}
      - {doc: VOL-I, ref: "footnote 12 to Clause 8.5", page: 4}
    change_type: mutatis mutandis application of an earlier addendum's knock-on clause
    effect: amended (dates recomputed; wording of the clauses unchanged)
    dates_moved:
      - item: "Clarification cut-off (VOL-I 5.2) -- combined with ADD-03 3.1/3.2"
        to: "14:00 Riyadh time, Thursday 19 November 2026"
        see: "3.1"
      - item: "Bid Bond validity (VOL-I 6.3: 180 days from the PDD)"
        from: "Tuesday 25 May 2027"
        to: "Tuesday 8 June 2027"
        arithmetic: "10 Dec 2026 + 180 days: 21 (to 31 Dec) + 31 Jan + 28 Feb + 31 Mar + 30 Apr + 31 May = 172; + 8 = 180 -> 8 June 2027"
        alternative_convention: "Monday 7 June 2027 if the PDD is counted as day 1"
        recommended_for_bond_wording: "expiry not earlier than 8 June 2027"
      - item: "Proposal validity (VOL-I 7.1: 150 days from the PDD; also Form 4-A para 2, VOL-IV page 3)"
        from: "Sunday 25 April 2027"
        to: "Sunday 9 May 2027"
        arithmetic: "21 + 31 + 28 + 31 + 30 = 141 to 30 Apr; + 9 = 150 -> 9 May 2027"
        alternative_convention: "Saturday 8 May 2027 if the PDD is counted as day 1"
      - item: "Footnote 12 reference-plant look-back (COD within the 10 years preceding the PDD)"
