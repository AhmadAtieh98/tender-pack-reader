      source: {doc: VOL-I, ref: "Clause 9.4", page: 5}
      quote: "Failure to submit a complete and properly executed Form 4-C for each member shall render the Proposal non-responsive."
    a3_change: >-
      Form 4-C line: complete and properly executed Form 4-C for each member, in Arabic, now including the sixth
      declaration -> otherwise non-responsive. Must ALSO appear on the 'could not resolve' list (see ambiguity).
    designated_ambiguity:
      summary: >-
        ADD-03 gives the sixth declaration only in English. VOL-I 9.4 requires Form 4-C to be completed in Arabic
        with the Arabic text governing; ADD-02 Q9 confirms Arabic; VOL-IV page 2 requires Forms to be reproduced
        without alteration. ADD-03 issues no Arabic text and no reissued form, and does not say where the sixth
        declaration is to be placed. A bidder-made translation would itself become the governing text of the
        declaration, so a translation error risks an 'improperly executed' Form 4-C (non-responsive).
      what_a_careful_bid_team_does: >-
        Raise a clarification through the Portal before 14:00 Thu 19 Nov 2026 asking the Authority to issue the
        Arabic text of the sixth declaration (ideally a reissued Form 4-C) and to confirm placement; meanwhile
        prepare a certified Arabic translation as a fallback and plan re-execution by every member.
      correct_system_behaviour: >-
        Create the new requirement row, status 'requires clarification / unresolved', list it on the A3
        'could not resolve' list, create a clarification-request activity due by 19 Nov 2026 14:00. Do NOT present a
        machine translation as the governing text, and do NOT mark Form 4-C compliant.
    programme_impact: >-
      Re-execution (signature + stamp) of Form 4-C by an authorised signatory of every member (foreign members:
      courier / notarisation lead time); directors' conviction-record due diligence before signing; dependency on
      the Authority's answer, which can only arrive by a later Addendum (date unknown) -> schedule risk.
    human_decisions:
      - "Whether to rely on own translation or wait for the Authority's Arabic text (legal)."
      - "Whether every member can truthfully give the declaration (directors' records) (legal/compliance)."

