    programme_impact: >-
      Bid Bond to be issued valid to at least 8 June 2027. Proposal validity statement unchanged in words
      (150 days) but now runs to 9 May 2027. Check ISO certificate expiry against 10 Dec 2026. Re-screen
      reference plants against the later window start.
    traps:
      - trap: "Applying only the new PDD and leaving the derived dates at their ADD-01 values."
        correct: "All four ADD-01 2.2 periods (and other PDD-anchored tests) are recomputed from 10 Dec 2026."
      - trap: "Believing the look-back is unaffected because ADD-03 6.1 says 'the look-back period ... is unchanged'."
        correct: "The length (ten years) is unchanged; its anchor (the PDD) moved by 2.1/2.2."

