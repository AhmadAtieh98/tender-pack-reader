  where: answer 18
  question: Can Direct Agreement terms on compensation for Project Company default override VOL-V 40.2?
  printed_precedence_nearby:
  - The order of precedence at Volume I Clause 3.2 applies. (response 18)
  - This Addendum is issued under Volume I Clause 5.3 and takes precedence over Addenda Nos. 1 and 2 in accordance with
    Volume I Clause 3.2.
  - This Addendum forms part of the RFP Documents and takes precedence in accordance with Volume I Clause 3.2. Bidders shall
    acknowledge receipt in Form 4-A. All other terms of the RFP Documents remain unchanged.
  why_not_settled: VOL-I 3.1/3.2 rank RFP Documents only. The Direct Agreement is not one of them and does not yet exist.
  expected: Escalate to a person (legal or commercial). Do not record a winner.
must_not_report:
- 'the Change in Law threshold is SAR 4,000,000 (cover E1: the delta applied to the base pack) or SAR 2,500,000 (the ADD-02
  value, ignoring 2.1)'
- VOL-II 8.5 (the handback survey) is deleted, or the obligation has lapsed
- VOL-II clauses are renumbered after the relocation
- the text of the handback survey has changed
- Table 42-1 values from the English translation (electrical/I&C 5 years; membranes 24 years) as the governing values
- VOL-II 2.2 electrical design life increased to 25 years (Appendix B note (4) is English-only and has no force)
- membrane processes are effectively prohibited (they are not; row 5 is 24 months)
- Table 42-1 has four asset classes (cover E3)
- the lifecycle demonstration (3.6) is optional (cover E2), or is a pass/fail disqualifier
- the 4.2 ground-conditions statement is a pass/fail disqualifier (no consequence is stated)
- new VOL-V 12.5 conflicts with VOL-V 3.3 (it extends the Scheduled PCOD, not the term)
- new VOL-V 12.5 is a Relief Event, or is time-only
- VOL-I 4.2 blackout is suspended or removed generally
- VOL-I 4.1 is disapplied by 4.4
- Form 4-C must be amended or re-executed because of 4.4
- answer 15 or answer 16 creates or changes a requirement
- answer 18 settles the Direct Agreement question (for example 'Volume V prevails' or 'the Direct Agreement prevails')
- DA1 resolved to a single figure without escalation
- the Proposal Due Date, the submission time or the clarification cut-off are changed
- Bidders may still raise clarification requests on this Addendum
- an Addendum issued after the VOL-I 5.2 cut-off is invalid
- a value for the Geotechnical Baseline Report or for condition grades 2 to 5 (none is supplied)
- VOL-V 36.1 or 36.3 amended
- D2 stated as a single certain date without noting that the forward counting rule is unstated
acceptable_if_raised:
- The relocated clause keeps the words 'final two (2) years of the concession' inside Volume V, which uses 'term'. This
  is noted only; it is not a subject of this Addendum.
- The scope words in 4.4 ('to the extent that they concern the identification and handling of cores and records') may be
  hard to apply in practice.
- The Independent Engineer's role in Table 42-1 note 2, and its costs under VOL-V 12.3 (unchanged).
