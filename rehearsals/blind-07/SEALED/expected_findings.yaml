  change_type: CT2
  old: A handback condition survey shall be carried out in the final two (2) years of the concession, and any remedial works
    identified shall be completed before transfer.
  new: same text, now numbered VOL-V 42.3
  expected_result: 'VOL-V 42.3: ''A handback condition survey shall be carried out in the final two (2) years of the concession,
    and any remedial works identified shall be completed before transfer.'' The obligation continues (it is not deleted).
    It now ranks as Volume V under VOL-I 3.2(c).'
  consequence: The A1 row for VOL-II 8.5 must be traced to VOL-V 42.3, with its history kept. It is now within Form 4-E
    (VOL-I 9.6), and Volume V's Note to Bidders says a deviation not listed is taken as accepted.
