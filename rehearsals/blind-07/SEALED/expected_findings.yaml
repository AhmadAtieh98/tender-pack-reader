  text: In Volume V Clause 42.1, ‘with a remaining design life of not less than five (5) years for all major assets’ is
    deleted and ‘with a residual service life, for each asset class, of not less than that stated in Table 42-1’ is substituted.
    Table 42-1 is reproduced at Appendix A to this Addendum and forms part of Volume V.
