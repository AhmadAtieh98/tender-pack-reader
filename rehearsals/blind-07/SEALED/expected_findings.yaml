change_types:
- id: CT1
  where: '2.1'
  type: relative (delta) amendment of a value that an earlier Addendum already amended
  note: The provision quotes no old text and gives no resulting figure. Recital 1.2 makes the base the ADD-02 value (SAR
    2,500,000), so the result is SAR 1,500,000. Applying the delta to the base pack gives SAR 4,000,000, which is the cover's
    error E1.
- id: CT2
  where: 3.1-3.3
  type: relocation of a clause to another Volume with its text unchanged; the old number is not reused and nothing is renumbered
  note: The obligation survives, so this is not a deletion. It changes rank under VOL-I 3.2, from (d) Volume II to (c) Volume
    V. It now falls within Form 4-E and within Volume V's 'deviation not listed ... taken as accepted' rule. 3.3 repoints
    the cross-reference in 42.1.
- id: CT3
  where: 3.4-3.5 and Appendix A
  type: a single value replaced by a per-class schedule that exists only in a governing Arabic image, with one cell whose
    unit differs from its column heading
  note: '''five (5) years for all major assets'' becomes five class values. Row 5 is in months (٢٤ شهراً) under a years
    heading (سنة).'
- id: CT4
  where: '4.4'
  type: bounded disapplication of a disqualification clause for one activity, without any change to the clause's text
  note: VOL-I 4.2 is not amended; it is disapplied for core-appointment communications with the geotechnical consultant,
    on cores and records only. The A3 item narrows. VOL-I 4.1 is not disapplied.
- id: CT5
  where: answer 17
  type: change carried by an answer that deems one document part of another (a change of container) and adds content
  note: The VOL-I 10.6 schedule 'forms part of Form 4-F'. This resolves the 'only Form 4-F and the Financial Model' conflict
    in VOL-I 10.1 and Form 4-F, and adds the minimum annual DSCR to the schedule.
- id: CT6
  where: Appendix B note (4)
  type: operative-sounding text present only in the convenience translation
  note: '''The design life of electrical equipment stated in Volume II Clause 2.2 is increased to twenty-five (25) years.''
    The governing Arabic has no such note and the English is ''for convenience only'' (3.5), so it has no effect. VOL-II
    2.2 is unchanged.'
- id: CT7
  where: 4.1 (new VOL-V 12.5)
  type: new clause whose trigger is fixed by an external document the pack does not contain
  note: '''materially more adverse than ... the Geotechnical Baseline Report ... Revision C ...''. The report is not supplied
    (ME1). 4.2 and 4.3 rely on the same report.'
