  text: Volume I Clause 4.2 does not apply to communications with the Authority's geotechnical consultant during an appointment
    under Section 4.3, to the extent that they concern the identification and handling of cores and records.
  target: VOL-I 4.2
  change_type: CT4
  expected_result: VOL-I 4.2 (disqualification for contact outside the Portal) does not apply to communications with the
    Authority's geotechnical consultant during a 4.3 appointment, so far as they concern the identification and handling
    of cores and records. Everything else in 4.2 is unchanged.
  consequence: A3 item VOL-I 4.2 narrows. VOL-I 4.1 is not disapplied (flag). The fifth declaration of Form 4-C (Arabic
    image), which commits to the communication rules of VOL-I 4.2, is read with the carve-out; the Form needs no change.
  a3: modified
answers:
- 'no': 15
  question: Will the minutes of the Pre-Bid Conference at Appendix B to Addendum No. 1 be issued in Arabic?
  response: No. The minutes are issued in English only. Section 3.2 of Addendum No. 1 continues to apply to them.
  class: decoy
  effect: None. It neither creates nor changes a requirement; ADD-01 3.2 already governs the minutes.
- 'no': 16
  question: At what stage must the grievance mechanism referred to in Volume II Clause 9.3 be in place?
  response: The grievance mechanism shall be established before construction, shall be accessible to the affected community
    and shall be maintained for the concession period. Volume II Clause 9.3 applies.
  class: confirming (imperative wording)
  effect: None. It restates VOL-II 9.3 ('established before construction and maintained for the concession period'). Do
    not create a new or changed row.
- 'no': 17
  question: Volume I Clause 10.1 states that no document other than Form 4-F and the Financial Model shall be placed in
    Envelope B, but Volume I Clause 10.6 requires a schedule of financing assumptions to be submitted with Form 4-F. Where
    is the schedule to be placed?
  response: The schedule required by Volume I Clause 10.6 forms part of Form 4-F and shall be attached to it in Envelope
    B. The schedule shall also state the minimum annual debt service cover ratio assumed. A schedule placed in Envelope
    A will be treated in accordance with Volume I Clause 6.2.
  class: changing
  effect: '(a) The VOL-I 10.6 schedule is deemed part of Form 4-F and attached to it in Envelope B, which resolves the ''only''
    wording of VOL-I 10.1 and Form 4-F. (b) It adds new schedule content: the minimum annual DSCR assumed. (c) A schedule
    in Envelope A falls under VOL-I 6.2 (commercial information) and makes the Proposal non-responsive. This is an existing
    A3 consequence now shown to apply.'
- 'no': 18
  question: Volume V Clause 39.5 refers to a Direct Agreement with the Senior Lenders. If the Direct Agreement provides
    for compensation on termination for Project Company default that differs from Volume V Clause 40.2, which prevails?
  response: The Authority notes the question. The order of precedence at Volume I Clause 3.2 applies. The Direct Agreement
    will be negotiated with the Senior Lenders after the Preferred Bidder Notification.
  class: human judgment
  effect: Not settled. VOL-I 3.2 ranks only the RFP Documents listed in VOL-I 3.1, and the Direct Agreement is not one of
    them; it does not exist yet. The printed precedence words (the response, recital 1.1 and the standard paragraph) do
    not decide whether Direct Agreement terms can override VOL-V 40.2. Escalate to legal or commercial; do not report 'Volume
    V prevails'.
- 'no': 19
  question: May Bidders inspect the borehole cores and laboratory records from the site investigation?
  response: Yes, by appointment. Section 4.3 of this Addendum applies. Requests made after the period stated in that Section
    will not be accommodated.
  class: confirming (of this Addendum's 4.3)
  effect: Points to 4.3 and adds that late requests will not be accommodated. The deadline reading is unresolved (D2), so
    plan to the earlier date, Thursday 19 November.
cover:
  text: This Addendum reduces the threshold in Volume V Clause 36.2 for compensation for a General Change in Law to SAR
    4,000,000, relocates the handback condition survey from Volume II to Volume V, replaces the remaining design life required
    at handback with minimum residual service lives for four asset classes set out in Table 42-1 (issued in Arabic), invites
    Bidders to describe in their Technical Proposals how their lifecycle plans address Table 42-1, inserts a new Volume
    V Clause 12.5 on adverse ground conditions and requires Bidders to state the ground conditions assumed for the design
    of foundations, provides for the inspection of borehole cores and laboratory records with a limited exception to Volume
    I Clause 4.2, and responds to clarification requests 15 to 19.
  planted_errors:
  - id: E1
    mechanism: stale-base arithmetic (a derived figure computed on a superseded base)
    cover_says: to SAR 4,000,000
    truth: SAR 1,500,000 (2,500,000 under ADD-02 8.1, less 1,000,000 under ADD-03 2.1, applied per recital 1.2)
    detect_by: Apply 2.1 to 36.2 as amended by ADD-02. The cover's figure equals base 5,000,000 less 1,000,000.
  - id: E2
    mechanism: modality downgrade (an obligation described as an invitation)
    cover_says: invites Bidders to describe in their Technical Proposals how their lifecycle plans address Table 42-1
    truth: '3.6: ''The Bidder shall demonstrate in the Technical Proposal ...''. Mandatory and scored (criterion C), not
      optional.'
    detect_by: Compare the cover's verb with 3.6's 'shall demonstrate'.
  - id: E3
    mechanism: cardinality error (a stated count the body contradicts)
    cover_says: for four asset classes
    truth: five asset classes (rows ١ to ٥ in the Arabic image; rows 1 to 5 in Appendix B)
    detect_by: Count the rows in Table 42-1.
  accurate_parts:
  - the relocation of the handback survey from Volume II to Volume V
  - Table 42-1 issued in Arabic
  - new VOL-V 12.5
  - the ground-conditions statement for foundations
  - core inspection with a limited exception to VOL-I 4.2
  - requests 15 to 19
secondary_undisclosed_effects:
- id: SU1
  effect: ADD-01 response 4 ('provided for information. Bidders shall satisfy themselves as to ground conditions') is now
    incomplete and partly wrong. Under new VOL-V 12.5 the Authority bears time and cost for ground conditions materially
    more adverse than the GBR. The addendum does not say this.
- id: SU2
  effect: The relocated survey (VOL-V 42.3) is open to deviation in Form 4-E. A deviation not listed is taken as accepted
    (Volume V Note to Bidders). Its precedence rank rises from VOL-I 3.2(d) to 3.2(c).
- id: SU3
  effect: VOL-V 12.5 can extend the Scheduled PCOD (12.1). The delay-LD start (18.1), the 365-day long-stop (18.3) and termination
    under 39.2 then move with it. Unlike a Relief Event (34.1, time only), 12.5 also pays costs. VOL-V 3.3 (no extension
    of the term) is not engaged.
- id: SU4
  effect: Arabic row 4 (7 years for electrical/I&C), against VOL-II 2.2 (M&E design life 20 years or the manufacturer's
    rated life, whichever is shorter), forces a lifecycle replacement of electrical/I&C equipment before handback. This
    affects lifecycle capex in the Financial Model and Availability Payment and the VOL-V 42.2 handback reserve.
- id: SU5
  effect: VOL-I 4.1 (all communications exclusively through the Portal) is not disapplied by 4.4. Form 4-C's fifth declaration
    refers to VOL-I 4.2 in the Arabic image ('البند ٤-٢ من المجلد الأول'), so a text search for '4.2' will not find it;
    it is read with the carve-out.
- id: SU6
  effect: Answer 17 removes the conflict between VOL-I 10.1 / Form 4-F ('only') and VOL-I 10.6. The Form 4-F schedule gains
    a DSCR item.
