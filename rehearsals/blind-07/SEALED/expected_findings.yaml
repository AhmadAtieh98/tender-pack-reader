- id: '3.1'
  text: 'Volume II Clause 8.5 is relocated to Volume V, in which it becomes Clause 42.3. Its text is unchanged and reads
    as follows: ‘42.3  A handback condition survey shall be carried out in the final two (2) years of the concession, and
    any remedial works identified shall be completed before transfer.’'
